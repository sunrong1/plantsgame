<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：happy（开心的）—— Story 1.8 第一批校准批，**情绪档**（抽象·表情）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 73%、重心居中、正面、全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横（下面提到 token 名时刻意省掉前导的两条短横）。

  ⚠️ **为什么不画成「一个开心的孩子」。**
     单元 1 里有 7 个人物词（teacher / student / father / mother / brother /
     sister / friend），再加 teacher 本批那张「戴眼镜拿书的人」，再画人只会加剧
     互相认错。抽象的表情符号没有这个问题：**单元 1 里只有它一张是脸。**

  ⚠️ **为什么底色不是明黄。**
     单元 1 里就有 yellow。若把它画成经典的「黄脸 + 光线」笑脸，
     孩子在 yellow 与 happy 两张之间会先被颜色吸引过去。
     这里用**奶油桃色**：既保住「暖、亮、开心」的语义，
     又和 yellow 拉开距离 —— 同样是暖色，但一个浅一个艳、一个有脸一个没有。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="开心">
  <!--
    光芒：8 条短圆头短线，从脸缘向外。
    ⚠️ 必须画在脸的**后面**（在 Z 序上更早），否则它们会被脸的描边切断，
       栅格化后像一圈断掉的刺。
  -->
  <g stroke="#ef9257" stroke-width="16" stroke-linecap="round">
    <path d="M 256 78 L 256 110" />
    <path d="M 256 402 L 256 434" />
    <path d="M 78 256 L 110 256" />
    <path d="M 402 256 L 434 256" />
    <path d="M 130 130 L 152 152" />
    <path d="M 360 360 L 382 382" />
    <path d="M 382 130 L 360 152" />
    <path d="M 152 360 L 130 382" />
  </g>

  <!-- 脸：正圆，半径 138。光芒的 stroke-width=16 且 linecap=round，
      会再向外伸出 8px —— 真实外沿是 372 / 约 72.7%，不是 178 那种算法得出的 70%。 -->
  <circle cx="256" cy="256" r="138" fill="#ffe0b8" stroke="#d99a52" stroke-width="12" />

  <!-- 腮红：分列在嘴的两侧，不能压到嘴上。 -->
  <ellipse cx="168" cy="296" rx="22" ry="14" fill="#ff9a8a" opacity="0.85" />
  <ellipse cx="344" cy="296" rx="22" ry="14" fill="#ff9a8a" opacity="0.85" />

  <!-- 眉毛：两道上扬短弧。情绪词里，眉毛比眼睛更早传达「开心」。 -->
  <g fill="none" stroke="#a8552f" stroke-width="11" stroke-linecap="round">
    <path d="M 196 206 Q 216 192 236 202" />
    <path d="M 276 202 Q 296 192 316 206" />
  </g>

  <!-- 眼睛：纯色实心，不描边。48px 下多一圈描边就糊成一坨（与 u1-dog 同理）。 -->
  <ellipse cx="216" cy="238" rx="17" ry="22" fill="#4a3a2c" />
  <ellipse cx="296" cy="238" rx="17" ry="22" fill="#4a3a2c" />

  <!--
    嘴：**实心的下弧**而不是一条线。
    ⚠️ 这是本图唯一不能省的形状 —— 48px 下一条描边弧线只剩 1px，
       而填实的下弧还能保住十几像素的暗色块，「笑」这个情绪全靠它。
  -->
  <path d="M 192 278 Q 256 264 320 278 A 66 66 0 0 1 192 278 Z" fill="#7a3226" />
</svg>
