<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：ball（球）—— Story 1.8 第一批校准批，**下限档**（具象·几何）。
  选它当本批第一张，因为纯圆 + 弧线是这批里最容易的一张：
  若连这张都画很久，说明成本不在「难」上，而在流程本身。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 69%、重心居中、正面偏 3/4、线条闭合

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横（下面提到 token 名时刻意省掉前导的两条短横）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="球">
  <!--
    球身。正圆是这一档的下限基准：半径 170 —— 注意**加上 stroke-width=14 的描边后**
    实际外沿是 177，四边留白 79px（占边长 15.4%），不是 177−170 那种算法。
    ⚠️ 留白这一条**不是被 §3.4 逼的** —— [CC] 2026-10-14 裁决词图不受 §3.2–§3.7 约束，
    它只是照 §5 模板留的。写在这里是为了让下一个人知道「它没被守着」。
  -->
  <circle cx="256" cy="256" r="170" fill="#d1601f" stroke="#7a3b10" stroke-width="14" />

  <!--
    受光面：上半球换成浅色，明暗交界是一条**向下鼓的曲线**。
    ⚠️ 第一版画的是「一道横向弧带 + 一道下摆弧带」，栅格化后读成**手提篮** ——
       上方那道弧的两端正好落在球体最宽处，从剪影上看就是一根提手。
    ⚠️ 第二版改成「暗球体 + 亮上半球」之后好了一些，但亮面的下缘是一段**直弦**，
       180px 下读成「地平线／落日」，48px 上尤其明显 —— 一个球不该有一条横贯的水平边。
       ⇒ 明暗交界改走二次曲线（向下鼓 = 光从上方来），水平边消失。
    亮面的外弧半径与球体一致（168），所以它精确地贴在球面内缘，
    描边盖住接缝，不需要 clipPath。
  -->
  <path d="M 89 236 Q 256 336 423 236 A 168 168 0 0 1 89 236 Z" fill="#f6a44a" />

  <!-- 高光：不描边。48px 下多余的描边会把这一小点糊成一坨。 -->
  <ellipse cx="186" cy="152" rx="40" ry="27" fill="#ffffff" opacity="0.72" transform="rotate(-30 186 152)" />
</svg>
