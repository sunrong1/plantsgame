<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：dog（狗）—— Story 1.8 第一批校准批，**曲线档**（具象·有机曲线）。
  选它是因为它是 path 的主战场：耳朵、尾巴、毛发轮廓全是曲线。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 82%、重心居中略偏下、3/4 侧面朝右
    （[CR] 2026-10-14 实测订正：尾巴 stroke-width=48 让整体超出 75% 上限，
      最小留白 38px 也低于 5.2 原定的 41px。§5 已就此分档改数，见 art-direction §5.1/5.2。）

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横（下面提到 token 名时刻意省掉前导的两条短横）。

  ⚠️ 三版返工的共同教训：**「头太大 + 口鼻太短」= 一个戴帽子的人。**
     狗与人最快的分界是口鼻 —— 它必须明显超出脑袋的右缘且足够粗，
     配上一个大圆头的鼻头。而胸口那一大块奶白色是「衣服」的读法来源，
     画上它，这只狗立刻变成一个穿围兜的小孩。奶白只留在脚与口鼻上。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="狗">
  <g stroke="#5f3a1c" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">

    <!--
      尾巴：从臀部甩向左上的一根粗曲线。
      ⚠️ 第一版画成 34px 且贴着身体，栅格化后读成一根小棍子。
      狗身上**最不会认错**的部位就是尾巴 —— 耳朵在 48px 上会并进脑袋，
      腿会被身体压住，尾巴不会。所以它比后腿更粗。
    -->
    <path d="M 138 340 Q 56 300 62 196" fill="none" stroke-width="48" />

    <!-- 身体：臀部 + 胸部两个椭圆并起来，分成两半是为了让肩线有起伏。 -->
    <ellipse cx="208" cy="336" rx="136" ry="110" fill="#d9a05b" />
    <ellipse cx="318" cy="308" rx="114" ry="104" fill="#d9a05b" />

    <!-- 前腿：两条竖柱，落点齐平（§5 模板的「落地线」） -->
    <rect x="306" y="326" width="60" height="122" rx="30" fill="#b87f42" />
    <rect x="258" y="334" width="60" height="114" rx="30" fill="#d9a05b" />

    <!--
      远侧的耳朵：只是脑袋右上方露出的一小截。
      ⚠️ 画得像个尖顶就成了一顶帽子（第二版的失败）；压在头顶正中也是（第一版的失败）。
      ⇒ 压扁成椭圆，并把它**下移贴住脑袋右缘** —— 它是「脑后那只耳朵」，
      不是一个放在头顶的东西。

      ✅ `[DS]` Story 1.9 已复核（原先登记为 defer，恢复条件是「与 §5 一并复核」）：
      **结论是保留。** 它被刻意画在头之前，头又画在它之后，
      所以露出来的只有贴着脑袋右缘的那一小截 —— 这正是「脑后那只耳朵」的读法。
      ⚠️ 48px 下它只剩约 1.9px，**在卡面量级上确实近乎不可见**；
      它的作用在更大尺寸（选项卡、复习卡）上，48px 只是「不碍事」而不是「看得见」。
      ⚠️ 它**不影响外接盒**：按 rx/ry/旋转实测它最右到 x≈393、最上到 y≈113，
      而 38px 那条最小留白来自尾巴（x=62 − 描边半宽 24）—— 去掉它五个实测量一个都不变。
      ⚠️ **已复核定案（`[DS]` Story 1.9, 2026-10-15）**：保留，判为
      **「≥180px 档质感」**，按 art-direction.md §5.5b「48px 可读性地板」——
      它不承担识别功能，**不许被引用为「别的图也应该这样」的依据**。
    -->
    <ellipse cx="344" cy="152" rx="46" ry="28" fill="#b87f42" transform="rotate(-26 344 152)" />

    <!-- 头：比第二版小一圈，给口鼻让出长度。 -->
    <ellipse cx="300" cy="200" rx="70" ry="64" fill="#d9a05b" />

    <!--
      口鼻：又长又粗，向右明显突出 —— 这是「侧面的狗」的唯一线索。
      ⚠️ 尖端收得太尖会读成鸟喙（第三版）。这里留一个近乎垂直的钝口。
    -->
    <path d="M 336 170 Q 436 168 448 186 Q 456 200 448 212 Q 436 230 336 224 Q 324 196 336 170 Z"
          fill="#d9a05b" />

    <!--
      近侧的垂耳：挂在头与脖子的交界处，位置比眼睛略低、偏向脑后。
      ⚠️ 画在头顶正中就是一顶帽子（第一版的失败）。
    -->
    <path d="M 274 142 Q 214 168 216 236 Q 218 296 268 300 Q 314 302 310 240 Q 306 172 300 146 Z"
          fill="#b87f42" />
  </g>

  <!-- 口鼻上的浅色：只到鼻头前一小段。再大就读成一条白围巾 / 一张白嘴。 -->
  <path d="M 350 180 Q 406 178 414 196 Q 410 214 350 214 Z" fill="#f6e7d2" />

  <!-- 五官：不描边。48px 下眼睛必须是一个纯色点，多一圈描边就糊了。 -->
  <ellipse cx="440" cy="197" rx="19" ry="16" fill="#3b2a1d" />
  <circle cx="330" cy="188" r="13" fill="#3b2a1d" />
  <circle cx="334" cy="184" r="4.5" fill="#ffffff" />
  <path d="M 378 224 Q 398 234 418 224" fill="none" stroke="#3b2a1d" stroke-width="9"
        stroke-linecap="round" />
</svg>
