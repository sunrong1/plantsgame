<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：playground（操场 / 游乐场）—— Story 2.1 产能实验样本，**多元素场景档**。
  版本：v4。**v4 相对 v3 只有注释改动，没有任何图形改动**（见文末「v4 的性质」）。
  v1–v3 的返工原因见「三次返工的路线」注释。

  ⚠️ **本图不是内容**：它落在 `docs/word-image-lab/`，不进 `public/assets/words/`。
     它的唯一用途是**给产能结论提供逐张耗时与返工版数的证据**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure

  ⚠️ **这是本 story 里档位缺口最大的一张，如实记账**：
     §5.1 的四档**没有任何一档是为「场景」设计的**。figure 的判据是「人物，由头 / 身 /
     肢 / 道具组合」—— 本图既没有人，也不是由部件组成的**一个**主体，
     它是**两个互不相连的主体并置**（滑梯 + 秋千）。
     取 figure 的理由只有一条：四档里 figure 的取值区间（70%–85%）最宽，
     且它的判据里「多部件组合」这一半能部分套用。
     ⇒ **本图的 §5.1 区间自检几乎不构成校验**。§5.1 需要新增一个「场景」档
       —— 记入 deferred-work。

  G10：不得含 text / image / foreignObject。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="操场">
  <!--
    ⚠️ **三次返工的完整路线 —— 本 story 里最有迁移价值的一段记录**：

      v1（描边 12/14/16px，含梯级与吊绳）
        几何三项一遍过；180px 四种底色下两件设施都读得出；
        **48px 不合格** —— 梯级、吊绳整段消失，48px 上只剩「一个橙拱 + 一个青门」。

      v2（删掉所有 48px 下会消失的笔画，描边统一拉到 §5.5 上限 16px）
        几何三项仍全绿；180px 读得更干净；
        **48px 仍勉强偏不合格** —— 48px 上仍是「两个架子」，读不出操场。
        v2 的做法是**加粗描边**，实测结论是：**加粗描边救不回 48px**。

      v3（本版：**彻底不用描边，全部改成实心色块**）
        算术依据：512 单位 → 48px 是 0.09375 倍。
          16px 描边 → 1.5px 墨（会糊、会并、会消失）
          46 单位的实心块 → 4.3px 色块（边界稳定）
        ⇒ 场景图在 48px 下唯一可能的画法是**大面积实心色块**，不是细线。
        这条结论与本图最终读没读出来无关，**它本身就是产出**（见 story 文档 §8.2）。

    构件清单（8 个元素，全部为**实心填充、无描边**）：
      滑梯：1 梯架带 / 2 平台 / 3 滑道带
      秋千：4 横梁 / 5 左腿 / 6 右腿 / 7 吊绳带 ×2 / 8 座板

    ⚠️ **§5.5 对「无描边」没有规定 —— 本图因此是规范空白处**：
       §5.5 只说「主体轮廓描边 12–16px」，预设了词图会有描边。
       本图一条描边都没有，落在规范没覆盖的地方。
       这**不是**我判断可以钻的空子，而是实测逼出来的：
       若「场景类词图必须可读于 48px」成立，规范就必须承认实心色块画法。
       ⇒ 记入 deferred-work，与「§5.1 缺场景档」一并登记。

    为什么**不加地面**：透明底是 §1 的硬要求；且一条地平线色带会从下缘再吃掉
      40px、把主体占比从 80.1% 顶到 88% —— 直接打红 §5.1。
      场景图靠「各构件下端齐平在 y=392」隐含地平线。
  -->

  <!-- 滑梯（占 x 52..308，约 63% 宽度）：暖橙 #f9a825。 -->
  <g fill="#f9a825">
    <!--
      梯架：一条**实心斜带**（46 单位宽 → 48px 下 4.3px），不是两根细杆。
      v1/v2 的两根竖杆在 48px 下相距仅 4.1px、彼此 1.5px 宽 —— 实测会并成一根更粗的斜柱，
      「梯」这个意思彻底消失。合成一条带之后，48px 下读到的是「一根实心斜柱」，
      配合上方的水平平台与下方的斜滑道，仍能推出「滑梯」。
    -->
    <path d="M 88 160 L 134 160 L 100 392 L 52 392 Z" />
    <!-- 平台：实心横条（98×40 → 48px 下 9.2×3.7px）。与梯架之间留 8 单位缝。 -->
    <path d="M 142 140 L 240 140 L 240 180 L 142 180 Z" />
    <!--
      滑道：实心弯带（顶 38 宽 / 底 44 宽），是全图 48px 下最大的一块橙色，
      也是读出「滑梯」的主笔画。顶端与平台右缘之间留 4 单位缝。
    -->
    <path d="M 282 192 C 300 240 306 292 308 392 L 264 392 C 262 294 252 246 244 192 Z" />
  </g>

  <!-- 秋千（占 x 322..456，约 33% 宽度）：青 #26a69a，比滑梯窄 ——
       两件设施等宽时 48px 下注意力无处落，会读成「两个差不多的东西」而不是「一个场景」。 -->
  <g fill="#26a69a">
    <!-- 横梁：实心横条（114×38 → 48px 下 10.7×3.6px），全图最宽的单块青色。 -->
    <path d="M 334 146 L 448 146 L 448 184 L 334 184 Z" />
    <!-- 两条外撇的腿：合成「门」形，是秋千在 48px 下的骨架。 -->
    <path d="M 344 190 L 380 190 L 358 392 L 322 392 Z" />
    <path d="M 402 190 L 438 190 L 456 392 L 420 392 Z" />
    <!-- 吊绳：两条实心窄带（20 单位 → 48px 下 1.9px，仍偏细，
         但它们的作用是「把座板接在横梁上」，座板本身承担识别。 -->
    <path d="M 362 190 L 382 190 L 386 272 L 366 272 Z" />
    <path d="M 402 190 L 422 190 L 418 272 L 398 272 Z" />
  </g>

  <!--
    座板：全图唯一**红色**的实心块（72×36 → 48px 下 6.8×3.4px）。
    红色是场景图在 48px 下的救命色：滑梯是橙、秋千架是青，两者在 48px 下
    都是「竖笔画」，而一块红板给了秋千那一团一个中心与一个落点。
    v1 就已验证过它是**唯一在 48px 下留下可见痕迹**的场景元素。
  -->
  <path d="M 356 272 L 428 272 L 428 308 L 356 308 Z" fill="#e53935" />

  <!--
    外沿实算（v3 全部为实心块，**描边半宽为 0**，这是与 v1/v2 唯一不同的记账口径）：
      x  52..456（404 宽，来自梯架底左 52 与右腿底右 456）
      y 140..392（252 高，来自平台顶 140 与各构件下端 392）
    ⇒ §5.1 取**最长边** = 404 ⇒ 404/512 = **78.9%**，落在 figure 的 70%–85% 内
      （距上限 6.1pp）；
      §5.2 四边最小留白 52px（左缘 52），≥30.72px；
      §5.3 重心 (254, 266)，偏移 x 2 / y 10px，均 ≤30.72px。

    ⚠️ 样本量 n=1，且 48px 判读结论以 story 文档 §8.2 的实看为准。
       本图的 §5.1 结论**不可迁移**到别的场景图。

    v4 的性质：**纯注释修正，零图形改动**。

    v3 的注释里三个几何数字（80.1% / 46px / 重心 x=251）是**手算错的**，
    实测 `npm run word-image-metrics` 报的是 78.9% / 52.0px / (254,266)。
    错因：手算时把梯架底左的 x=52 误写成 46，并顺着那个 46 往下算了宽度与留白。
    按「实测值优先」改成实测值。

    ⚠️ **这一版会在产能统计里虚增一次返工，§8.2 已单独披露**：
      v3→v4 之间只有写注释的几十秒，不是画图时间。产能报告里 playground 的
      逐版耗时逐条列出，正是为了让读者能把这一次摘出来。
      教训：**图里的几何数字必须由工具产出后回填，不能手算后直接写死。**
  -->
</svg>
