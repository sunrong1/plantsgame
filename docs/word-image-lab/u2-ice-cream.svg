<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：ice cream（冰淇淋）—— Story 2.1 产能实验样本，**需要组合的元素档**。
  版本：v3（返工 2 次；v1 / v2 的返工原因见下方樱桃与叶片处注释）。

  ⚠️ **本图不是内容**：它落在 `docs/word-image-lab/`，不进 `public/assets/words/`。
     它的唯一用途是**给产能结论提供逐张耗时与返工版数的证据**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure

  ⚠️ **这是一次档位拉伸，如实记账**：
     §5.1 的 figure 成员全是人物，判据是「由头 / 身 / 肢 / 道具组合，有明确的前后关系」。
     本图**没有人**，但确实满足该判据里最关键的那一半 —— **多个部件且有明确的上下关系**
     （蛋筒在下 → 大球 → 小球 → 樱桃），单看剪影无法推出「冰淇淋」。
     §5.1 的四档里没有「食物」这一档：organic 的判据是「轮廓由曲线主导」，
     而本图剪影的主导形状是**蛋筒那个三角形**；geometric / abstract 更不沾。
     ⇒ 取四档中判据命中最多的 figure，**并在 story 文档 §8.2 里把「§5.1 无食物档」
       记为实测发现**。本图的 §5.1 区间自检因此只算**弱校验**。

  G10：不得含 text / image / foreignObject。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="冰淇淋">
  <!--
    蛋筒。倒三角，顶边 y=288、底尖 y=462。
    顶边只取 x 168..344（184 宽），比它下方 y=288 处的大球轮廓（162..350）**窄 5px** ——
    刻意让蛋筒整个藏在大球背后。踩过的坑：顶边若与球等宽或更宽，
    两角会从球边缘露出两个小尖，在 48px 下那两个尖读成「猫耳朵」，
    整张图立刻跑偏成「猫 / 狐狸」。
  -->
  <path d="M 168 288 L 256 462 L 344 288 Z"
        fill="#e8b878" stroke="#a3703a" stroke-width="14" stroke-linejoin="round" />

  <!--
    下层球（草莓味）：c(256,266) r=96，是全图**唯一撑住 §5.1 主体占比的部件**。
    r 从 96 再往上加会让顶端的樱桃越出 85% 上限，往下加会让蛋筒露得太少
    （48px 下蛋筒只剩几个像素，读不出「这是蛋筒不是别的什么」）⇒ 96 是两头都要顾的取值。
  -->
  <circle cx="256" cy="266" r="96" fill="#f7a1c4" stroke="#a3703a" stroke-width="14" />

  <!--
    上层球（香草味）：c(256,184) r=74，与下层球在 y 170..258 带重叠 88px ——
    重叠是硬要求：只相切的话 48px 下两层球之间会出现一条发丝缝，
    在浅色底（white / grass）上这条缝直接把球切成两半，读成「两个半圆」。
  -->
  <circle cx="256" cy="184" r="74" fill="#fff3d9" stroke="#a3703a" stroke-width="14" />

  <!--
    樱桃柄（12px 绿弧）：**只承担连接作用**，见下方 §5.5b 记账。
  -->
  <path d="M 258 88 C 262 82 266 80 272 78"
        fill="none" stroke="#6b8f3f" stroke-width="12" stroke-linecap="round" />

  <!--
    樱桃：c(256,108) r=25，压在球顶（球顶 y=110）上，露出上半。

    ⚠️ **v1 → v2 的返工原因：§5.5b 记账错误，不是剪影错误**。
       v1 的 48px 判读是**通过**的（四种底色均判为冰淇淋）。但复核 v1 时发现
       v1 注释里那句话是**错的**：v1 写「柄是让整张图从『粉白两球 + 三角形』
       升级为『冰淇淋』的那一个部件」。实测 48px 下柄不足 1px、**根本不在画面上** ——
       48px 下读出「冰淇淋」的是「三角 + 双球 + 红点」这套**剪影**，与柄无关。
       v1 把一个 48px 下不存在的东西记成了识别来源，这是 §5.5b 明令禁止的记账方式
       （每个元素要么在 48px 下承担识别，要么如实声明为 ≥180px 专属）。

       ⇒ v2 两处一起改：
         (1) **加一枚叶片**替柄做识别 —— 叶片是一块 48px 下约 4×2px 的实心绿，
             且它带来一个**颜色**线索（红 + 绿），而 48px 下形状线索已经用尽了；
         (2) 把柄的注释改成它实际干的事：**只在 ≥180px 承担「这是樱桃不是小番茄」**，
             48px 下不承载任何识别，**如实声明为 ≥180px 专属**。
  -->
  <circle cx="256" cy="108" r="25" fill="#e63946" stroke="#a3202c" stroke-width="12" />

  <!--
    叶片：48px 下承担识别的那一个部件（替 v1 的柄）。

    ⚠️ **v2 → v3 的返工原因：算错了主体占比，且错的方向是危险的**。
       v2 手算叶片顶在 y=56，据此写下的占比是 80.7%；实测 `npm run word-image-metrics`
       报的是 **83.1%**，比手算高 2.4pp。查因：**度量器对带 rotate 的元素按
       「先取未旋转外接框、再旋转其四个角点」算界，而不是按真实旋转椭圆的极值**。
       旋转 −24° 后外接框角点 (308,52) 被推到 y=43.5，比真实椭圆最低点低约 6px。

       后果：83.1% 距 figure 的 85% 上限**只剩 1.9pp**。上限是硬的，
       再往上挪任何一个部件就会打红 §5.1；这种「贴着上限」的状态不可接受
       —— 它让本图对后续任何微调都没有余量。

       ⇒ v3 把叶片从 44×26 收到 **40×24**（cy 66→80、rx 24→20、ry 14→12），
         实测占比回到 79.7%（余 5.3pp），叶片在 48px 下仍约 3.7×2.3px，识别功能未丢。

    ⚠️ 这条同时是**「手算不如实跑」的一个实例**，记在这里备查：
       本 story 之前已在两处栽过（分位点的排序预期、基线 1969 vs 1970）。
  -->
  <ellipse cx="284" cy="80" rx="20" ry="12" transform="rotate(-24 284 80)" fill="#6b8f3f" />

  <!--
    外沿实测值（`npm run word-image-metrics docs/word-image-lab`，v3）：
      x 153..359（206 宽，来自下层球 r=96 + 7）、y 60.9..469（408.1 高，叶片顶与蛋筒尖）
    ⇒ §5.1 主体占比 **79.7%**，落在 figure 的 70%–85% 内（距上限 5.3pp）；
      §5.2 四边最小留白 43px（蛋筒尖 462+7 = 469，余 43px），≥30.72px；
      §5.3 重心 (256, 265)，偏移 9.0px，≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      蛋筒 ✓（三角剪影） / 下层球 ✓ / 上层球 ✓（两球的台阶轮廓）
      樱桃 ✓（顶部唯一红点，颜色线索）/ 叶片 ✓（红旁的唯一绿点）
      樱桃柄 ✗ —— **≥180px 专属**，48px 下不可见，如实声明
  -->
</svg>
