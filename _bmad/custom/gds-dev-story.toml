  "测试执行纪律：Step 7 的 'Run all existing tests' 在本项目理解为「跑与当前 task 直接相关的测试文件」，不是全量套件。做法：用 git diff --name-only 看本 task 改了哪些测试文件及其被测源文件，只跑这批；若某 task 的改动可能影响其他模块，补跑受影响的那几个文件并在 Completion Notes 里说明为什么补。全量 `npm run test` 只在 Step 9 收口时跑一次。",
]
