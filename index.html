<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 禁掉双击缩放：否则 Android 上双击有 300ms 延迟，
      直接击穿 FR78 的「点击反馈 ≤100ms」预算。
      viewport-fit=cover 让 env(safe-area-inset-*) 生效（架构决策 10 的安全区预留）。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- 色板属 Story 1.6，此处不预设品牌配色。theme-color 在那之前留空，
         浏览器会用默认色；随手填一个会被后续 story 当成「已定稿」继承。 -->
    <meta name="theme-color" content="" />
    <title>PVZ Pixel</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
