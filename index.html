<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      maximum-scale=1 禁掉双击缩放：否则 Android 上双击有 300ms 延迟，
      直接击穿 FR78 的「点击反馈 ≤100ms」预算。
      viewport-fit=cover 让 env(safe-area-inset-*) 生效（架构决策 10 的安全区预留）。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- 色板已由 Story 1.6 定稿（docs/art-direction.md §2），但 **theme-color 仍留空**：
         它是浏览器地址栏/任务栏的品牌色，属于「应用层外观」，归 Story 1.7 的应用化。
         随手填一个会被后续 story 当成「已定稿」继承。 -->
    <meta name="theme-color" content="" />
    <title>PVZ Pixel</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
