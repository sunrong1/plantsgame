<?xml version="1.0" encoding="UTF-8"?>
<!--
  范围塔（aoe）—— Story 1.7。

  规格（docs/art-direction.md 第 1 节 / 第 3 节）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图（§3）：3/4 侧、**面朝右**、描边 16px、主体占画布约 62%
  色板：#7a3200 = tokens.css 的 color-tower-aoe（字面副本，见 §4 第 2 条）
         ⚠️ 不写前导双短横：XML 注释正文里不允许出现连续双短横，见 G8。

  规格就写在上面这段注释里。几何守卫必须先剥注释再匹配属性，
  否则这张文件会因为这几行字而**恒绿**（AC-15 / 变异清单 M8）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="范围塔">
  <!--
    剪影分工（§4 第 5 条）：**aoe 是三塔里唯一「顶部由多个分开的圆瓣组成」的**。
    三个圆瓣 + 一片外扩的宽扁躯体，去掉颜色之后，
    它是三张图里唯一顶部有**三个峰**的。
    （slow 顶部是一条平滑长弧，direct 顶部是单个圆钮加一根右指的炮管。）
  -->
  <g fill="#7a3200" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- 泥土基座：三塔共用同一形状（§3.6 跨塔一致性） -->
    <rect x="176" y="378" width="160" height="56" rx="18" />
    <!-- 短躯干 -->
    <rect x="232" y="316" width="48" height="62" rx="16" />
    <!-- 外扩的宽扁躯体：比 slow 的伞盖低、比它的茎粗 -->
    <ellipse cx="256" cy="264" rx="138" ry="74" />
    <!-- 三个圆瓣：aoe 的辨识签名（顶部三峰） -->
    <circle cx="256" cy="166" r="46" />
    <circle cx="162" cy="198" r="42" />
    <circle cx="350" cy="198" r="42" />
  </g>

  <!--
    细节：不描边。外扩方向的四道短弧是「它打一片而不是打一个」的视觉提示，
    用白色而非第四种色值（G4 锁死了可用色）。
  -->
  <g fill="#ffffff">
    <polygon points="118,236 150,226 150,246 118,256" />
    <polygon points="362,226 394,236 394,256 362,246" />
    <ellipse cx="256" cy="150" rx="20" ry="14" />
  </g>
</svg>
