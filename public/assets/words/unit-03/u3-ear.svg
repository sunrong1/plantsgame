<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：ear（耳朵）—— 单元 3 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 73%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么用描边画而不是实心块**：耳朵没有「体积」，它是一条**卷起来的边**
     ⇒ 用一条粗的开口曲线（外耳廓）+ 一条细的（耳内褶）最像；
     实心块会读成「一片叶子」。

  ⚠️ **为什么它与 `u3-eye` 必须一眼可分**：单元 3 的单词卡是二选一，
     而耳朵与眼睛都是「曲线团」⇒ 本图是**竖着的、不对称的 C 形**，
     眼睛那张是**横着的、左右对称的杏形 + 正中的圆**。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="耳朵">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!--
      外耳廓：一条开口的 C 形粗线（描边 40px 当作「耳廓的厚度」）。
      ⚠️ 描边粗是**装饰性粗笔**（§5.5 的界线）：它不是轮廓线，而是耳朵本身。
    -->
    <path d="M 374.8 117.8 C 269 78.9 154.5 148 135 253.8 C 115.6 359.7 184.7 437.4 281.9 437.4
             C 333.8 437.4 370.5 405 366.2 364 C 361.8 323 323 310 299.2 331.6"
          stroke-width="40" />

    <!-- 耳内褶：一条更细的 C 形（比外廓短、比外廓窄）。 -->
    <path d="M 327.3 204.2 C 277.6 195.5 238.7 230.1 234.4 273.3 C 230.1 312.2 260.3 340.2 299.2 340.2"
          stroke-width="24" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-03` 实测）：
      主体占比 **72.4%**，最小留白 **54.6px**，重心偏移 **16.1px**，重心 (253, 272)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 54.6px ≥30.72px；§5.3 的 16.1px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      外耳廓粗线 ✓（**主识别来源**：一条竖着的 C 形）
      耳内褶细线 ✗ —— 48px 上只剩 2px，是纯细节 ⇒ 只加不减
  -->
</svg>
