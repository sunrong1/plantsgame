<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：nose（鼻子）—— 单元 3 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 73%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么画成正面**：侧面鼻（一个弯钩 + 一个鼻孔）更写实，
     但 48px 下那根弯钩只剩两三个像素 ⇒ **正面**（一个上下收窄的立体块
     + 两个鼻孔）才留得住「鼻子」这个读法。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鼻子">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!--
      鼻梁 + 鼻头：上窄下宽的一整块（正面看的鼻子）。
      ⚠️ 上下都收成圆角，不要画成尖三角 —— 尖三角读成「山峰」。
    -->
    <path d="M 256 70 C 206 168 172 240 160 292 C 140 372 190 430 256 430
             C 322 430 372 372 352 292 C 340 240 306 168 256 70 Z"
          fill="#f6d7b0" stroke-width="12" />

    <!-- 两个鼻孔：实心深色（§5.5：小图元实心不描边）。 -->
    <ellipse cx="198" cy="352" rx="26" ry="20" fill="#a2673f" stroke="none" />
    <ellipse cx="314" cy="352" rx="26" ry="20" fill="#a2673f" stroke="none" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-03` 实测）：
      主体占比 **72.7%**，最小留白 **64.0px**，重心偏移 **6.0px**，重心 (256, 250)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 64.0px ≥30.72px；§5.3 的 6.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      鼻体 ✓（**主识别来源**：一个上窄下宽的立体块）
      两个鼻孔 ✓（**第二识别来源**：底部的两点深色 —— 没有它会读成「下巴」）
  -->
</svg>
