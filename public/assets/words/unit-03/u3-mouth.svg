<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：mouth（嘴）—— 单元 3 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 75%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么画成「张开的嘴」而不是一条线**：嘴巴闭着就是一条线，
     48px 下与「嘴」这个部位的其它画法都读不出来；张开的嘴（深色口腔 + 一排白牙）
     是小孩认得最多的那个形状。

  ⚠️ **为什么它与 `u3-face` 必须一眼可分**：单元 3 的单词卡是二选一，
     而脸也含嘴 ⇒ 脸那张的嘴只是整张脸里的一小块，
     本图则是一整张画布上**唯一**的东西（外轮廓是半圆 + 一条直边）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="嘴">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!--
      口腔：一个半圆（下半圆）+ 一条平直的上沿。
      ⚠️ 上沿必须**平**：弧 + 弧会读成「舌头」或「香蕉」。
      ⚠️ 位置定在 y=163，使半圆的竖直中心正好落在画布中线（重心居中，§5.3）。
    -->
    <path d="M 70 163 L 442 163 A 186 186 0 0 1 70 163 Z" fill="#a8324a" stroke-width="12" />

    <!--
      牙齿：贴着上沿的一条白带（中间略下凹，像上下牙之间的缝）。
      ⚠️ 48px 下这条白带只剩 3px 高 —— 但它正是「嘴」而不是「洞」的识别来源。
    -->
    <path d="M 88 169 L 424 169 L 414 213 Q 256 231 98 213 Z" fill="#ffffff" stroke="none" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-03` 实测）：
      主体占比 **75.0%**，最小留白 **64.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 64.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      深色口腔 ✓（**主识别来源**：一个半圆形的深色块）
      白牙带 ✓（**第二识别来源**：深色块上边的一条白）
  -->
</svg>
