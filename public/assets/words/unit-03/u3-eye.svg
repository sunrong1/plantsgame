<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：eye（眼睛）—— 单元 3 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 73%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么归 organic**：眼睛是「轮廓由曲线主导」的形状（上下两条弧合成的杏形），
     不是几何体、也不是全身人物 ⇒ 归 abstract 会把它塞进 60%–75% 那条更紧的区间。

  ⚠️ **为什么它与 `u3-ear` 必须一眼可分**：单元 3 的单词卡是二选一，
     而耳朵与眼睛都是「一个带洞的曲线团」⇒ 轮廓必须能分开：
     本图是**横着的杏形 + 正中的圆瞳**（左右对称、有圆心），
     耳朵那张是**竖着的 C 形卷曲**（不对称、没有圆心）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="眼睛">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!--
      眼白：上下两条二次曲线合成的杏形。
      ⚠️ 左右两端尖、上下饱满 —— 这是「眼睛」的通用画法；
         画成圆形会读成「瞳孔」，画成矩形会读成「窗户」。
    -->
    <path d="M 76 256 Q 256 106 436 256 Q 256 406 76 256 Z" fill="#fdf6e6" stroke-width="12" />

    <!-- 虹膜：一只正中的圆，把「杏形」锚成「眼睛」。 -->
    <circle cx="256" cy="256" r="92" fill="#3b6ea5" stroke="none" />

    <!-- 瞳孔：更深的圆。⚠️ 48px 下它只剩 4px，但它给出「这是眼睛」的深度感。 -->
    <circle cx="256" cy="256" r="42" fill="#16202c" stroke="none" />

    <!-- 高光：实心不描边（§5.5：眼睛与高光一律实心）。 -->
    <circle cx="216" cy="212" r="20" fill="#ffffff" stroke="none" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-03` 实测）：
      主体占比 **72.7%**，最小留白 **70.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 70.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      杏形眼白 ✓（**主识别来源**：横着的对称杏形）
      虹膜圆 ✓（**第二识别来源**：正中一个大圆）
      瞳孔 ✗ —— 48px 上只剩 4px，是虹膜里的深色 ⇒ 只加不减
      高光 ✗ —— 纯装饰
  -->
</svg>
