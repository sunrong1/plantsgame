<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：bear（熊）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 76%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：熊是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **熊最认错的两个邻居**：
     · `dog`（u1）—— 熊的耳朵是**圆的、立在头顶上**，狗的耳朵是**垂的**。
     · `tiger` / `lion` —— 熊**没有条纹、没有鬃毛**，而且有一根**粗短的小尾巴**
       （虎狮的长尾是它们的标志）。
     ⇒ 这张图的三条主线是：**圆耳朵 + 粗短身体 + 一个球形的小尾巴**。

  ⚠️ **为什么用棕而不是黑**：黑熊更常见，但 `u1-panda` 已经占用了黑白配色，
     而 `u2-mouse` 用的是灰褐。熊用**暖棕 #a3703a**，与 `u2-egg` 的沙色差一个饱和度。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="熊">
  <!--
    尾巴：一个小圆球（r=26）。
    ⚠️ **熊的尾巴极短** —— 画长了就读成 `tiger` / `dog`。
       这个小球是「熊 vs 虎狮」最省事的一条区别线索。
  -->
  <circle cx="86" cy="296" r="26" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />

  <!--
    身体：臀部 + 胸部两个椭圆并起来。
    ⚠️ 熊比虎**更圆更厚**（rx 更大、ry 更大）—— 瘦长就读成虎。
  -->
  <ellipse cx="200" cy="318" rx="126" ry="108" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />
  <ellipse cx="302" cy="296" rx="112" ry="102" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />

  <!--
    腿：两根落点齐平的粗腿（熊的腿粗）。
  -->
  <rect x="154" y="326" width="60" height="104" rx="30" fill="#8c5f2e" stroke="#5c3a1a" stroke-width="12" />
  <rect x="300" y="318" width="60" height="112" rx="30" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />

  <!--
    耳朵：两只**大圆耳**，立在头顶正中偏左。
    ⚠️ **圆耳是熊的第一识别线索**（狗耳是垂的、猫耳是尖的）。
    ⚠️ 耳朵画在头**之前**，头画在耳朵之后 ⇒ 只露出上半截，
       这样才读成「头顶上的两只圆耳」，而不是「贴在旁边的两个球」。
  -->
  <circle cx="302" cy="136" r="30" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />
  <circle cx="386" cy="136" r="30" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />

  <!--
    头：熊的头**比虎的大**（rx 76 / ry 68），且更圆 —— 头身比是熊的关键。
  -->
  <ellipse cx="344" cy="196" rx="76" ry="68" fill="#a3703a" stroke="#5c3a1a" stroke-width="12" />

  <!--
    口鼻：熊的吻部是**一个浅色的宽椭圆**，不是尖出去的一条 ——
           尖吻读成犬科，熊是熊科。
  -->
  <ellipse cx="398" cy="224" rx="44" ry="32" fill="#f0dcbd" stroke="#5c3a1a" stroke-width="12" />

  <!--
    鼻头：深色的扁椭圆，压在吻部右上。
    ⚠️ 鼻头 + 宽吻 = 熊；鼻头 + 长吻 = 狗。
  -->
  <ellipse cx="418" cy="212" rx="15" ry="12" fill="#3b2a1d" />

  <!--
    五官：不描边的纯色点。
    ⚠️ **小圆眼**（r=13）：熊的眼睛小而圆，瞪大眼会读成「惊讶的卡通熊」。
  -->
  <circle cx="366" cy="182" r="13" fill="#3b2a1d" />
  <circle cx="370" cy="178" r="4.5" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **77.0%**，最小留白 **54.0px**，重心偏移 **12.0px**，重心 (251, 268)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 54.0px ≥30.72px；§5.3 的 12.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      圆耳 ×2 ✓（**主识别来源**：立在头顶的两只大圆耳）
      身体 + 粗腿 ✓（**剪影**：敦实的四足兽）
      头 + 宽吻 ✓（**第二识别来源**：熊科的宽吻，不是犬科的尖吻）
      小圆尾巴 ✓（**第三识别来源**：球形短尾）
      鼻头 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
