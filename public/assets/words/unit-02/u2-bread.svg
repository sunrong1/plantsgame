<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：bread（面包）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：food    ← 食物档（§5.1：60%–80%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 62%、重心居中、正面

  ⚠️ **为什么归 `food`**：面包是食物，归 `food` 档（60%–80%）。
     ⚠️ **不要归 `geometric`** —— 外轮廓虽然是拱形，但 §5.1 的 `geometric`
     判据指的是「盒体 / 圆柱 / 笔杆」这类**规则几何体**，面包属于食物本体。

  ⚠️ **v1 被判为「门洞 / 拱门」—— 这一版改了什么**（2026-10-23，48px/180px 栅格化复核）：
     v1 是「棕色描边里嵌一块米白」，180px 上整张读成**一扇拱门**。
     两处改法（改成 🍞 面包片的标准画法）：
     ① **米白面包芯只占上半部**（一个拱顶的圆顶），**下半部整片是棕色的外壳**；
        v1 的米白是**四边包一圈棕**，那个「棕框」正是门洞的读法来源。
     ② **底部两角做小圆角** —— 门洞的底边是死平的直角，面包片的底角是圆的。

  ⚠️ **为什么切成「一片」而不是「一整个圆面包」**：切面（米白）+ 外壳（棕）
     两色是这个词的直译线索；圆面包只有一个棕球，和 `egg`（米白球）撞。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="面包">
  <!--
    整片面包的外轮廓：上圆顶、下方略方的身子。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
    ⚠️ **顶是「圆顶」不是「半圆」**：单段圆弧的顶太尖，读成「山丘」；
       两段三次曲线接起来才有面包顶那种饱满的弧。
    ⚠️ **底角小圆角**（C 8px）—— 直角底边 = 门洞，圆底角 = 面包片。
  -->
  <path d="M 104 336 C 104 196 174 122 256 122 C 338 122 408 196 408 336
           L 408 400 C 408 409 401 416 392 416 L 120 416 C 111 416 104 409 104 400 Z"
        fill="#c98b4b" stroke="#6b4a3a" stroke-width="14" stroke-linejoin="round" />

  <!--
    面包芯：上半部的一个米白圆顶。
    ⚠️ **芯只到 y=336 就停**，下半截整片留棕 —— 这是 🍞 面包片的分色，
       也正是把 v1 从「门洞」救回来的那一刀。
    ⚠️ 面包芯**不描边**：描了会在 48px 下多出一圈灰线，把芯和壳糊在一起。
  -->
  <path d="M 121 336 C 121 212 181 143 256 143 C 331 143 391 212 391 336 Z"
        fill="#f6e6c6" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **62.1%**，最小留白 **89.0px**，重心偏移 **13.0px**，重心 (256, 269)
    ⇒ §5.1 落在 food 的 60%–80% 内；§5.2 的 89.0px ≥30.72px；§5.3 的 13.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      外壳轮廓 ✓（**主识别来源**：圆顶 + 略方的身子 = 一片面包）
      米白面包芯 ✓（**第二识别来源**：上白下棕的两色分法）
  -->
</svg>
