<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：pencil（铅笔）—— Story 1.9 第二批，**几何直线档**。
  ⚠️ 交付位置：原画在单元 1 的 `u1-pencil.svg`，Story 2.10 换源后
     `pencil` 属教材 1A 单元 2 ⇒ 随 `git mv` 改名为本文件 `u2-pencil.svg`，
     **画面本身未改**（只有本注释与外沿实算块被更新）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：**斜置 45°**、笔尖朝左下、主体占画布约 64%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本图是**长条斜置件**里最容易与「别的笔」混淆的一张）：
  ⚠️ 本图与其它笔类（钢笔、马克笔）的分工全在**两端**与**侧面**：
     ① 铅笔的左端是**削出来的木质圆锥 + 一小截深色笔芯**，
        轮廓上是一段**从方到尖的直线收口**；
        钢笔的左端是**一段短的金属锥**，更短更钝。
     ② 铅笔的右端有**橡皮头**：圆头、颜色与笔身完全不同，
        轮廓上多出一小截**粗细不变的方柱**。
     ③ 笔夹这类**侧向凸起**在本图的轮廓上**一个都没有**，
        这是最干净的一条分界。
  ⚠️ **本图与 `u2-ruler` / `u2-rubber` 的分工**（这三张同属「斜置长条」族，
     在四选一里并排时最易撞）：尺子有**刻度**，橡皮是**块状**，
     本图是**一端收尖、两端异色的细长杆**。
  ⚠️ 三段结构（芯 / 木 / 杆）必须**都画出来**。
     只画一个圆锥加一根杆的话，与钢笔几乎一样。
  ⚠️ 六棱的暗示只用**两条极浅的暗线**：
     48px 上棱线必然消失，加粗会把笔身切成三段，反而读成铅笔盒。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="铅笔">
  <!--
    ⚠️ 整组斜置 45°（rotate(-45)，逆时针），绕画布中心 ⇒ 木锥尖落在**左下**。
    为什么斜置：完全水平的长条在 48px 上是一根「棍子」，
    斜过来之后重心与边界都更接近方阵，§5.1 的占比与 §5.3 的居中都更好看。
    为什么斜置不影响 §5.3：守卫跟着 transform 一起算外接盒（M33 验过）。
  -->
  <g transform="rotate(-45 256 256)" stroke="#3b3226" stroke-width="12"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- 橡皮头：圆头、粉色，与笔身颜色完全不同。 -->
    <rect x="430" y="228" width="28" height="56" rx="13" fill="#f2a0b8" />

    <!-- 金属箍：橡皮与笔杆之间的一圈，两道浅线交代它是箍不是杆。 -->
    <rect x="382" y="228" width="50" height="56" fill="#c2c8d2" />
    <path d="M 396 232 L 396 280 M 416 232 L 416 280" fill="none" stroke="#9aa2b0"
          stroke-width="8" />

    <!-- 笔杆：黄色，正六棱的暗示靠下面两条暗线。 -->
    <rect x="146" y="228" width="240" height="56" fill="#f0c14b" />
    <path d="M 196 232 L 196 280 M 262 232 L 262 280" fill="none" stroke="#d9a92f"
          stroke-width="8" />

    <!-- 木质的锥：从方到尖的直线收口 —— 本图与钢笔的第一分界。 -->
    <path d="M 50 256 L 150 230 L 150 282 Z" fill="#e8c98f" />

    <!-- 笔芯：锥尖最前面一小截深色。 -->
    <path d="M 50 256 L 82 242 L 82 270 Z" fill="#3f3a33" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **63.8%**，最小留白 **92.0px**，重心偏移 **0.7px**，重心 (255, 257)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 92.0px ≥30.72px；§5.3 的 0.7px ≤30.72px。
  -->
</svg>
