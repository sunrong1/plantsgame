<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：balloon（气球）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 71%、重心居中、正面

  ⚠️ **为什么归 `geometric`**：气球是一个**规则的旋转体**（正圆轮廓 + 一个结），
     轮廓由圆弧主导、没有曲线主导的「有机」特征 ⇒ 与 `organic`（具象动物）不沾。

  ⚠️ **为什么是紫色**：单元 2 的两个颜色词是 `green` / `pink`，
     这两个色**不许大面积出现**；苹果是红的（`u2-apple`），
     若气球也用红，**同局里就有一张红苹果和一张红气球**（都在第 2 局）⇒ **混淆**。
     ⇒ 紫色是本单元里没人占用的颜色。
     ⚠️ 代价：紫色在草绿底（#7cb342）上明度接近，48px 下轮廓要靠深色描边站住 ——
        这就是描边 14px 不许省的原因。

  ⚠️ **与 `u2-egg` 的区分**：egg 是米色的**不对称卵形**，气球是正圆 + 结 + 线。
     §5.1 的 §5.1.1 实测记录过 egg 的 v1 曾经「退化成近似对称的椭圆，
     **与球 / 气球不可区分**」—— 那次返工把蛋的**上肩收窄**压了出来，
     本图的气球是**正圆**，两者在 48px 下不同形 ✓。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="气球">
  <!--
    球体：正圆（rx 124 / ry 132，接近正圆）。
    ⚠️ **刻意不做成完美正圆**：rx 比 ry 小 8px，气球才有「被吹起来」的鼓感；
       完美正圆会读成「一颗紫色的球 / 葡萄」。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <ellipse cx="256" cy="196" rx="124" ry="132" fill="#7b2cbf" stroke="#4a1d6b" stroke-width="14" />

  <!--
    高光：一枚偏亮的斜椭圆，画在左上。
    ⚠️ §5.5b 的记账：48px 下约 7×9px，**承担识别功能** ——
       没有它，气球在草绿底上只剩一个紫色剪影，读成「紫色的球」而不是「气球」。
  -->
  <ellipse cx="212" cy="150" rx="26" ry="36" fill="#b57bdc" />

  <!--
    结：球体下方一个小三角（气球的扎口）。
    ⚠️ **必须有**：没有结的气球读成「球 / 葡萄 / 紫色的蛋」。
       48px 下这个结约 3px 高 —— 刚好越过 §5.5b 的 3px 门槛 ⇒ 承担识别功能。
  -->
  <path d="M 240 316 L 272 316 L 256 348 Z" fill="#4a1d6b" />

  <!--
    线：一条从结垂下来的波线，8px。
    ⚠️ **48px 下不足 1px ⇒ ≥180px 专属**，如实声明。
       它在 ≥180px 上的作用是「这东西是拴着的、会飘」，
       48px 下的识别由「圆 + 结」承担。
    ⚠️ 线**没有拖到画布底边**：拖到底会把 §5.1 的占比顶出 60%–75% 的带。
  -->
  <path d="M 256 348 C 244 372 270 396 256 416" fill="none" stroke="#5c3a7a"
        stroke-width="8" stroke-linecap="round" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **70.9%**，最小留白 **57.0px**，重心偏移 **17.5px**，重心 (256, 239)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 57.0px ≥30.72px；§5.3 的 17.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      球体 ✓（**主识别来源**）
      高光 ✓（体积；也让紫色在草绿底上站得住）
      扎口结 ✓（「这是拴着的」）
      线 ✗ —— **≥180px 专属**
  -->
</svg>
