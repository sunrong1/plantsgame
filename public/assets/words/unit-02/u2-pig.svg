<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：pig（猪）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 75%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：猪是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **⚠️ 最需要小心的一张 —— 猪是粉色的，而 `pink` 是本单元的颜色词**：
     ⇒ 猪身用**灰调的粉**（#e8a0a8），不是鲜艳的粉；
     `pink` 那张色卡走**高饱和的玫粉**（见 u2-pink）。
     两者的明度与饱和度差得开（灰粉偏暗、玫粉偏亮）。
     ⚠️ 这一条要进 §5.4 的视角一致台账复核（Story 3.5）。

  ⚠️ **猪最认错的邻居**：`bear`（同一批画的熊）。
     ⇒ 猪的三条主线是：**扁圆的猪鼻（带两个鼻孔） + 尖耳朵 + 卷尾巴**，
     熊是圆耳朵 + 球形短尾 + 宽吻。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="猪">
  <!--
    尾巴：一根**卷起来**的细尾巴（螺旋）。
    ⚠️ 卷尾是猪最经典的特征，也是它和熊（球形短尾）、虎狮（长甩尾）的分界。
    ⚠️ 48px 下这个圈只剩约 2px ⇒ 它是加分项，主识别靠猪鼻。
  -->
  <path d="M 88 292 c -26 -18 -12 -46 10 -40 c 20 6 14 34 -6 34 c -14 0 -16 -16 -4 -20"
        fill="none" stroke="#b5646c" stroke-width="12" stroke-linecap="round" />

  <!--
    身体：猪是**滚圆的**（rx 与 ry 都大，接近正圆）—— 瘦长就读成狗。
  -->
  <ellipse cx="200" cy="320" rx="132" ry="110" fill="#e8a0a8" stroke="#b5646c" stroke-width="12" />
  <ellipse cx="302" cy="302" rx="116" ry="104" fill="#e8a0a8" stroke="#b5646c" stroke-width="12" />

  <!--
    腿：猪的腿**短**（画得高就变成一头小牛）。
  -->
  <rect x="156" y="336" width="56" height="94" rx="28" fill="#d98f97" stroke="#b5646c" stroke-width="12" />
  <rect x="300" y="330" width="56" height="100" rx="28" fill="#e8a0a8" stroke="#b5646c" stroke-width="12" />

  <!--
    耳朵：两只**尖的、朝外翻**的耳朵（猪耳是尖的，熊耳是圆的）。
    ⚠️ 耳尖朝上外侧张，角度大一点才读得出「猪耳」；
       贴着脑袋竖直会读成「猫耳」。
  -->
  <path d="M 288 158 L 296 106 L 348 142 Z" fill="#d98f97" stroke="#b5646c" stroke-width="12"
        stroke-linejoin="round" />
  <path d="M 366 146 L 408 108 L 398 160 Z" fill="#e8a0a8" stroke="#b5646c" stroke-width="12"
        stroke-linejoin="round" />

  <!--
    头：圆头，比熊小一号。
  -->
  <ellipse cx="344" cy="208" rx="72" ry="64" fill="#e8a0a8" stroke="#b5646c" stroke-width="12" />

  <!--
    猪鼻：**扁圆的鼻盘 + 两个鼻孔**。
    ⚠️ 这是猪的**第一识别线索** —— 有两个洞的扁圆鼻子，别的动物都没有。
    ⚠️ 鼻盘用**更深的粉** #d98290：它是身上最深的一块，48px 上是一块暗斑，
       和「圆脸」一起把猪读出来。
  -->
  <ellipse cx="400" cy="224" rx="40" ry="30" fill="#d98290" stroke="#b5646c" stroke-width="12" />
  <ellipse cx="390" cy="222" rx="7" ry="9" fill="#8f4550" />
  <ellipse cx="410" cy="222" rx="7" ry="9" fill="#8f4550" />

  <!--
    五官：不描边的纯色点。
  -->
  <circle cx="372" cy="192" r="12" fill="#3b2a1d" />
  <circle cx="375" cy="189" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **75.0%**，最小留白 **62.0px**，重心偏移 **12.0px**，重心 (254, 268)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 62.0px ≥30.72px；§5.3 的 12.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      猪鼻（扁圆 + 两个鼻孔）✓（**主识别来源**：全身唯一有「两个洞」的地方）
      滚圆的躯干 ✓（**剪影**：一个圆滚滚的侧身兽）
      尖耳朵 ✓（**第二识别来源**：与熊的圆耳分开）
      卷尾巴 ✓（**第三识别来源**：与熊的球尾、虎狮的长尾分开）
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
