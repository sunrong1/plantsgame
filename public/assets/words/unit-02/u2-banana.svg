<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：banana（香蕉）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：food    ← 食物档（§5.1：60%–80%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 71%、重心居中、横向的新月

  ⚠️ **为什么归 `food`**：Story 2.5 §0 裁决 9 逐字写着
     「`egg` / `ice-cream` → `food`，`sun` 不变」，`banana` 同属可入口食物。
     ⚠️ **不要因为它「弯」就归 `organic`** —— `organic` 档的成员是动物与曲线形体（`fish` / `dog` / `cat`），
     水果归 `food`；这一档的 60%–80% 区间比 organic 的 70%–85% 宽，
     把它放错档会让 G11 取错区间。

  ⚠️ **颜色的串扰风险**：香蕉的黄（#f4d35e）与 `sun` 的金黄（#ffb703）同族。
     两者的形状差别极大（新月 vs 圆盘加光芒），48px 上应能分开；
     但这一条要进 §5.4 的视角一致台账复核（Story 3.5）。

  ⚠️ **为什么整条往上挪**：香蕉是**下厚上薄**的新月，重心天然偏下。
     不抬起来的话重心偏移会超过 §5.3 的 6%（30.72px）上限。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="香蕉">
  <!--
    香蕉本体：一条**新月**（外弧 + 内弧围成的月牙）。
    ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
    ⚠️ **两端是尖的**（外弧与内弧在两端汇合），不是齐口 —— 齐口会读成「一段弯管」。
  -->
  <path d="M 92 159 C 80 279 170 369 280 369 C 380 369 432 299 434 215
           C 428 269 376 295 292 299 C 202 301 122 261 92 159 Z"
        fill="#f4d35e" stroke="#8a5a44" stroke-width="12" stroke-linejoin="round" />

  <!--
    果柄：左端的一个深褐色小疙瘩。
    ⚠️ 它给新月的左端一个「凸出来的头」—— 48px 下约 1.4px，
       读不出「柄」，但能让左端不是一根光秃秃的尖。
    ⚠️ §5.5b 记为 **≥180px 专属**。
  -->
  <ellipse cx="88" cy="147" rx="13" ry="11" fill="#6b4a3a" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **71.3%**，最小留白 **72.0px**，重心偏移 **1.5px**，重心 (258, 256)
    ⇒ §5.1 落在 food 的 60%–80% 内；§5.2 的 72.0px ≥30.72px；§5.3 的 1.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      香蕉本体 ✓（**唯一的识别来源**：黄色新月）
      果柄 ✗ —— **≥180px 专属**
  -->
</svg>
