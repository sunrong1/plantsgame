<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：pink（粉色）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面

  ⚠️ **为什么是「一块粉色色卡」，不是粉色的什么**：
     同 u1-blue / u1-red / u1-yellow 的口径：颜色的通用符号是**色卡本身**。
     画一个粉色的猪 = pig + pink 两个答案同时在场，比画错还糟。

  ⚠️ **形状为什么是「圆角六边形」**：
     单元 1 的三张颜色词用了 **心 / 方 / 星**；
     同单元的 `green` 用**圆角三角形**。
     ⇒ `pink` 用**圆角六边形**，三种语言互不重叠，灰度档下也都认得出。
     ⚠️ 六边形在本单元没有别的成员用它（`drum` 是圆柱、`clock` 是圆、
       `ruler` / `crayon` 是长条、`kite` 是菱形）。

  ⚠️ **⚠️ 颜色必须比 `u2-pig` 更艳**：猪是**灰调的粉** #e8a0a8，
     本色卡用**艳玫粉** #f25fa5 ⇒ 明度与饱和度都差得开。
     形状上更是分得很开（平面六边形 vs 圆滚滚的侧身兽）。
     ⚠️ 这一条要进 §5.4 的视角一致台账复核（Story 3.5）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="粉色色卡">
  <!--
    色卡主体：一枚**圆角六边形**（正六边形，尖顶朝上），平面、无厚度。
    ⚠️ 六个角都用二次曲线收圆（Q + 顶点作控制点）——
       直角六边形会读成「一个化学分子式 / 螺母」。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <path d="M 231.7 98 L 137.1 158 Q 112.9 172 112.9 200 L 112.9 312 Q 112.9 340 137.1 354
           L 231.7 414 Q 256 428 280.3 414 L 374.9 354 Q 399.1 340 399.1 312
           L 399.1 200 Q 399.1 172 374.9 158 L 280.3 98 Q 256 84 231.7 98 Z"
        fill="#f25fa5" stroke="#c23a76" stroke-width="14" stroke-linejoin="round" />

  <!--
    内侧一圈更深的描边：给色卡「有一圈边框」的结构。
    ⚠️ 与 u1-blue 同一条道理：内部轮廓的形状是区分「一块料子」与「一个实物」的关键。
    ⚠️ **不填高光** —— 高光 + 内框会被读成「玻璃面板」。
  -->
  <path d="M 256 108 L 316 156 L 316 228 L 256 276 L 196 228 L 196 156 Z"
        fill="none" stroke="#c23a76" stroke-width="10" stroke-linejoin="round" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **67.2%**，最小留白 **84.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 84.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      圆角六边形色块 ✓（**主识别来源**：一块艳粉的料子）
      内侧六边形轮廓 ✓（**第二识别来源**：内部的六边形 = 平面色卡）
  -->
</svg>
