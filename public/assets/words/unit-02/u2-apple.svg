<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：apple（苹果）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：food    ← 食物档（§5.1：60%–80%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 63%、重心居中、正面偏 3/4

  ⚠️ **为什么归 `food`**：§5.1 的 `food` 档成员表里逐字写着 `apple`。
     单元 1 里 `u1-red`（红心）是一张**颜色词**图，`u1-ball`（球）是器物；
     苹果两样都不是 —— 它是**一件吃的**，且 §5.1 的 `food` 判据是
     「**一种类别塞进两种形状（圆润 / 方正）**」里的圆润那一半（egg / apple / banana）。

  ⚠️ **为什么是红的而不是青的**：单元 2 的词条里有 **`green`（一片绿叶）**
     —— 若苹果画成青绿色，**整张图就是一个绿色大色块**，
     孩子听到「green」时手里握着两张绿图 ⇒ **答案串扰**。
     ⇒ 苹果取红，绿色留给 `u2-green` 那张。
     ⚠️ 代价：苹果与单元 1 的 `u1-red`（红心）同色系。
     但两者的**形状**差得很远（圆果 vs 心形），且 `red` 不在单元 2 的词表里 ⇒ 不构成串扰。

  ⚠️ **为什么不画叶子**：叶子是绿的（同上），而且叶子是「苹果」这个答案的
     **可选**配件，不是必需件；只用**一根棕色的梗**，48px 下就足够。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="苹果">
  <!--
    果身：一条闭合路径，左右两瓣在顶端汇成一道**凹口**（y=170 处）。
    ⚠️ **凹口不能省**：两端各自圆、顶上一条直边的苹果读成「樱桃 / 番茄」；
       有了凹口才读成「苹果」（梗从凹口里长出来）。
    ⚠️ **底部是圆的不是方的**：方的底部读成「番茄的横切面」。
  -->
  <path d="M 256 170
           C 304 128 392 148 410 228
           C 426 314 362 408 256 408
           C 150 408 86 314 102 228
           C 120 148 208 128 256 170 Z"
        fill="#d92f3f" stroke="#9c1c2b" stroke-width="14" stroke-linejoin="round" />

  <!--
    果梗：从顶部凹口往上斜出一小截，12px 深棕。
    ⚠️ 梗是**「这是苹果」的第二个识别点**（红圆 + 梗），
       48px 下它约 5px 高，肉眼可见 ⇒ 不是质感图层。
    ⚠️ 梗的**方向刻意斜向右**（不是竖直）：竖直的梗配上对称的果身，
       整张图会读成「心形」；斜梗打破左右对称。
  -->
  <path d="M 256 168 C 258 150 264 130 272 112"
        fill="none" stroke="#6b3f1c" stroke-width="12" stroke-linecap="round" />

  <!--
    受光面：一枚偏亮的斜椭圆，画在左上。
    ⚠️ §5.5b 的记账：48px 下约 6×8px，**承担识别功能** ——
       没有它，48px 上只是「一个红圆 + 一根梗」，
       读不出体积，也就读不出「是一个果子」而不是「一个红色圆片」。
    ⚠️ **不许长到果身外面**：露出去就成了「一块浅红斑贴在边上」。
  -->
  <ellipse cx="196" cy="214" rx="30" ry="42" fill="#f4837f" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **63.8%**，最小留白 **92.6px**，重心偏移 **4.5px**，重心 (256, 261)
    ⇒ §5.1 落在 food 的 60%–80% 内；§5.2 的 92.6px ≥30.72px；§5.3 的 4.5px ≤30.72px。
    ⚠️ 手算的 62.9% 与实测 63.8% 差 0.9pp —— 差在**曲线上**：
       实算按贝塞尔采样取极值，手算只看了控制点。**以实测为准**（R-21）。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      果身 ✓（**主识别来源**：上窄下宽 + 顶端凹口）
      果梗 ✓（第二个识别点，「红圆 + 梗」= 苹果）
      受光面 ✓（体积）
  -->
</svg>
