<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：monkey（猴子）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 79%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：猴子是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **猴与熊是这一批里最容易混的两张**（都是棕色圆耳朵的胖兽）：
     ⇒ 猴的三条主线是：**耳朵长在头的两侧（不是头顶）+ 一条长卷尾 + 浅色的脸盘**。
     熊是圆耳在头顶 + 球形短尾 + 宽吻。

  ⚠️ **尾巴必须长**：猴子的长尾巴是它和熊最快分开的一条线索，
     而且尾巴在 48px 上是**不会认错**的部位（耳朵会并进脑袋，腿会被身体压住）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="猴子">
  <!--
    尾巴：一根长卷尾（24px），从臀部甩向左上再卷回来。
    ⚠️ **长度是这张图的重点**：短尾就读成 `bear`。
    ⚠️ 描边写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <path d="M 110 300 Q 50 250 66 180 Q 80 128 124 148" fill="none" stroke="#9c6b43"
        stroke-width="24" stroke-linecap="round" />

  <!--
    身体：臀部 + 胸部两个椭圆并起来。
  -->
  <ellipse cx="200" cy="320" rx="124" ry="104" fill="#9c6b43" stroke="#5c3a1a" stroke-width="12" />
  <ellipse cx="300" cy="300" rx="108" ry="98" fill="#9c6b43" stroke="#5c3a1a" stroke-width="12" />

  <!--
    腿：两根落点齐平的腿。
  -->
  <rect x="152" y="326" width="56" height="104" rx="28" fill="#855531" stroke="#5c3a1a" stroke-width="12" />
  <rect x="302" y="320" width="56" height="112" rx="28" fill="#9c6b43" stroke="#5c3a1a" stroke-width="12" />

  <!--
    耳朵：两只**大圆耳，长在头的两侧**。
    ⚠️ **这是猴与熊的分水岭**：熊耳在头顶、猴耳在两侧。
    ⚠️ 耳朵画在头**之前**、头画在耳朵之后 ⇒ 只露出外侧的一半，
       读起来才是「头两边张着的耳朵」，而不是「脑袋上贴了两个球」。
  -->
  <circle cx="268" cy="196" r="32" fill="#855531" stroke="#5c3a1a" stroke-width="12" />
  <circle cx="424" cy="196" r="32" fill="#9c6b43" stroke="#5c3a1a" stroke-width="12" />

  <!--
    头。
  -->
  <ellipse cx="346" cy="200" rx="68" ry="64" fill="#9c6b43" stroke="#5c3a1a" stroke-width="12" />

  <!--
    脸盘：猴子脸中央的**浅色区**（围住眼睛与嘴的那一圈）。
    ⚠️ 这是猴脸的典型样子，也是和熊（整张棕脸）分开的一条线索。
  -->
  <ellipse cx="352" cy="204" rx="52" ry="50" fill="#f0dcbd" stroke="#5c3a1a" stroke-width="10" />

  <!--
    嘴部：浅色区上的一个深色小椭圆（猴子的扁嘴）。
  -->
  <ellipse cx="378" cy="226" rx="18" ry="12" fill="#5c3a1a" />

  <!--
    五官：不描边的纯色点。
    ⚠️ 两只眼睛都画（3/4 视角），这是猴脸「看着你」的关键。
  -->
  <circle cx="330" cy="192" r="11" fill="#3b2a1d" />
  <circle cx="374" cy="188" r="12" fill="#3b2a1d" />
  <circle cx="333" cy="189" r="4" fill="#ffffff" />
  <circle cx="377" cy="185" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **80.3%**，最小留白 **50.0px**，重心偏移 **28.0px**，重心 (256, 284)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 50.0px ≥30.72px；§5.3 的 28.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      长卷尾 ✓（**主识别来源**：48px 下最不会认错的部位）
      头的两侧的大圆耳 ✓（**第二识别来源**：与熊的头顶圆耳分开）
      浅色脸盘 ✓（**第三识别来源**：猴脸的典型分色）
      躯干 + 头 ✓（**剪影**）
      嘴部 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
