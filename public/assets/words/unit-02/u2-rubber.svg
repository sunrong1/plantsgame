<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：rubber（橡皮）—— **单元 2 的内容**（Story 2.10 换源批次）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：**斜置 18°**、主体占画布约 71%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么归 `geometric`**：橡皮**就是一个长方体**
     （§5.1 的 `geometric` 档判据：「盒体 / 圆柱 / 笔杆本质是几何体」）。

  ⚠️ **为什么用粉色**：单元 2 这一批要同时出现 `book`（靛蓝）/ `ruler`（冰蓝）/
     `pencil`（明黄）三张图 ⇒ 橡皮必须落在**第四个色区**里才不撞色。
     粉红是「橡皮」在英语世界里的公共符号（eraser 的经典形象），
     也是这条换源链里唯一没有被 `book` / `ruler` / `pencil` 占掉的暖色。
     ⚠️ 铅笔图里那截橡皮头也是粉色（#f2a0b8）—— 但它在**细长黄色笔杆的一端**，
       轮廓与本图的**块状**完全不同，不会混。

  ⚠️ **中间那道浅色横带是「纸套」**：光一个粉色方块在 48px 上读成「一块砖」；
     中间包着的一圈纸套才是「橡皮」而不是「积木」的第一交代。
     纸套与橡皮**同宽**（不是更宽的包裹盒）—— 更宽会让轮廓变成第二个矩形，
     48px 上读成「盒子里的东西」。

  ⚠️ **为什么斜置 18°**：完全轴对齐的长方形读成「一块板」。
     斜过来之后它与 `book`（12°）、`ruler`（30°）、`pencil`（45°）同属「斜置件」这一族，
     §5.4 的「同一批之间视角一致」也才成立。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="橡皮">
  <!--
    ⚠️ 整组斜置 18°，绕画布中心 (256,256)。
    为什么斜置不影响 §5.3：守卫跟着 transform 一起算外接盒
    （这一点由变异 M33 验过：把词图整体 translate 之后 G13 照样能红）。
  -->
  <g transform="rotate(-18 256 256)" stroke="#3b3226" stroke-linejoin="round">

    <!--
      橡皮本体：一块圆角长方体。
      ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
         实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
      ⚠️ 本体 320×144 + 描边半宽 ⇒ 未旋转时外接盒 332×156；
         旋转 18° 后外接盒约 364×251 ⇒ 最长边 **71.1%**，落在 geometric 的 60%–75% 内。
    -->
    <rect x="96" y="184" width="320" height="144" rx="16" fill="#ef8fb0" stroke-width="12" />

    <!--
      纸套：横贯中间的一道浅色带。
      ⚠️ **与本体同宽**（不是更宽的包裹盒）—— 见文件头的「为什么中间那道浅色横带」。
      ⚠️ 上下两条描边就是「纸套的两条折边」，48px 上仍能读成「被纸包着」。
    -->
    <rect x="96" y="222" width="320" height="68" fill="#fdf6e6" stroke-width="12" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **70.5%**，最小留白 **75.6px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 75.6px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      橡皮本体 ✓（**主识别来源**：块状 + 粉色）
      纸套横带 ✓（**第二识别来源**：中间一道浅色带 = 被纸包着）
      圆角 ✗ —— 48px 上看不出，纯装饰
  -->
</svg>
