<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：elephant（大象）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 78%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：大象是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **大象的两条主线**：**一根长鼻子 + 一只巨大的耳朵**。
     这两条都是「器官大到不成比例」的画法，
     也正是 48px 上唯一还能认出来的两条（其余细节都会糊掉）。

  ⚠️ **鼻子用「深色粗描边 + 灰色细描边」两道同路径的线画**：
     这样才有一圈外轮廓。第一版只画一根灰线 ⇒ 48px 上鼻子是一根灰棍，
     读成「象鼻」但没有体积感。两道线的差（34 − 22 = 12）就是那圈外轮廓。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="大象">
  <!--
    尾巴：一根细尾，末端一小撮毛。
    ⚠️ 象尾是「细 + 末端一撮」，和猴子的长卷尾、虎狮的长尾都不一样。
  -->
  <path d="M 84 292 Q 56 322 62 372" fill="none" stroke="#5c646a" stroke-width="11" stroke-linecap="round" />
  <ellipse cx="63" cy="384" rx="13" ry="18" fill="#5c646a" transform="rotate(8 63 384)" />

  <!--
    身体：一个横着的大椭圆（象身宽而低）。
  -->
  <ellipse cx="212" cy="288" rx="142" ry="102" fill="#9aa0a6" stroke="#4a5157" stroke-width="12" />

  <!--
    腿：三条柱状腿（象腿像柱子，几乎不弯）。
    ⚠️ **远侧那条腿画浅一档**（#8b9196）—— 制造纵深，也是「这是三头身」的意思。
  -->
  <rect x="116" y="352" width="54" height="88" rx="22" fill="#8b9196" stroke="#4a5157" stroke-width="12" />
  <rect x="186" y="372" width="52" height="68" rx="20" fill="#8b9196" stroke="#4a5157" stroke-width="12" />
  <rect x="300" y="360" width="54" height="80" rx="22" fill="#9aa0a6" stroke="#4a5157" stroke-width="12" />

  <!--
    耳朵：一大片贴在头后侧的耳朵（**大象的第一标志之一**）。
    ⚠️ 画在头**之前**、头画在耳朵之后 ⇒ 露出来的是头后面那一片，
       读起来才是「贴在头侧的巨耳」。
  -->
  <ellipse cx="304" cy="196" rx="66" ry="82" fill="#8b9196" stroke="#4a5157" stroke-width="12"
           transform="rotate(-8 304 196)" />

  <!--
    头。
  -->
  <ellipse cx="356" cy="208" rx="74" ry="68" fill="#9aa0a6" stroke="#4a5157" stroke-width="12" />

  <!--
    鼻子：先画一道**深色粗线**（当外轮廓），再在同一条路径上叠一道**灰色细线**。
    ⚠️ 两道线的差（34 − 22 = 12px）就是鼻子的外轮廓。
       只画一根灰线的话，48px 上鼻子是一根没有体积的灰棍。
    ⚠️ 鼻尖向上回勾 —— 象鼻不是直的，是 S 形的。
  -->
  <path d="M 392 196 C 436 202 458 244 448 288 C 440 322 418 344 398 336"
        fill="none" stroke="#4a5157" stroke-width="34" stroke-linecap="round" />
  <path d="M 392 196 C 436 202 458 244 448 288 C 440 322 418 344 398 336"
        fill="none" stroke="#9aa0a6" stroke-width="22" stroke-linecap="round" />

  <!--
    象牙：一小截白色的弯牙。
    ⚠️ 象牙是从嘴角往前下方伸出的**短而弯**的一段；
       画长了会读成「獠牙」（野猪）。
  -->
  <path d="M 402 254 Q 436 262 442 288" fill="none" stroke="#f7f3e8" stroke-width="13" stroke-linecap="round" />

  <!--
    五官：不描边的纯色点。
    ⚠️ 眼睛在头与耳朵之间，位置偏上。
  -->
  <circle cx="378" cy="184" r="11" fill="#3b2a1d" />
  <circle cx="381" cy="181" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **82.0%**，最小留白 **44.6px**，重心偏移 **16.8px**，重心 (258, 273)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 44.6px ≥30.72px；§5.3 的 16.8px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      鼻子 ✓（**主识别来源**：一条从脸上垂下来的粗管子）
      巨耳 ✓（**第二识别来源**：头后一大片）
      宽而低的身体 + 柱腿 ✓（**剪影**：象的笨重身形）
      尾巴 ✗ —— **≥180px 专属**
      象牙 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
