<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：duck（鸭子）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 79%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：鸭子是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **鸭与 `u1-bird` 是这一批里最需要分开的两张**（都是黄/白的小鸟）：
     ⇒ 鸭的专属线索是 **① 一张压平的橙色嘴（鸟喙是尖的）② 一双橙色的蹼脚
       ③ 一个又短又翘的尖尾巴**。三条都是鸟没有的。

  ⚠️ **颜色用暖黄 #f7cf46 而不是太阳的金黄 #ffb703**：
     太阳是「圆盘 + 放射光芒」，鸭是「胖身子 + 一张扁嘴」，形状差别极大；
     但颜色仍拉开一档，灰度档下不至于都读成同一个中灰圆。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鸭子">
  <!--
    尾巴：一个**又短又翘的尖尾巴**（三角）。
    ⚠️ 鸟的尾巴是分叉的羽毛，鸭的尾巴是**一个尖尖的翘角** ——
       这是把鸭和 `u1-bird` 分开的三条线索之一。
  -->
  <path d="M 146 256 L 68 210 L 84 296 Z" fill="#f7cf46" stroke="#a87a12" stroke-width="12"
        stroke-linejoin="round" />

  <!--
    身体：一个横着的胖椭圆（鸭子的身子是椭圆，不是球）。
  -->
  <ellipse cx="248" cy="300" rx="122" ry="94" fill="#f7cf46" stroke="#a87a12" stroke-width="12" />

  <!--
    翅膀：身上一块**略深的椭圆**。
    ⚠️ 这一块让「一只黄色的椭圆」变成「一只鸟」；48px 下约 1px 宽的边
       也足以看出「身体上有一片别的东西」。
  -->
  <ellipse cx="232" cy="296" rx="76" ry="54" fill="#e8b93a" stroke="#a87a12" stroke-width="10" />

  <!--
    脖子：一段向右上方翘起的粗脖子（圆角矩形 + 旋转 -22°）。
    ⚠️ 鸭子是**短脖子**，脖子太长就读成 `goose` / 天鹅。
    ⚠️ 实算脚本支持 rotate（只实现 translate / rotate，见脚本 Matrix 的注释）。
  -->
  <rect x="318" y="158" width="76" height="130" rx="38" fill="#f7cf46" stroke="#a87a12"
        stroke-width="12" transform="rotate(-22 356 223)" />

  <!--
    头：一个圆。
  -->
  <circle cx="364" cy="150" r="50" fill="#f7cf46" stroke="#a87a12" stroke-width="12" />

  <!--
    嘴：**一张压平的橙色嘴** —— 鸭嘴是这张图的**第一识别线索**。
    ⚠️ 鸟喙是尖的三角形；鸭嘴是**扁的、带圆头的铲形**。
    ⚠️ 嘴画在头**之前**、头画在嘴之后 ⇒ 只露出右侧那一片，
       读起来才是「嘴上伸出去一张扁嘴」。
  -->
  <path d="M 398 134 Q 462 132 460 150 Q 462 168 398 166 Z"
        fill="#e8802a" stroke="#a8541a" stroke-width="10" stroke-linejoin="round" />

  <!--
    腿与蹼脚：两条橙色的细腿 + 两片横着的蹼脚。
    ⚠️ **蹼脚**（横着的扁椭圆）是鸭的第三线索，鸟是爪（细长的三根）。
  -->
  <rect x="212" y="380" width="22" height="46" rx="11" fill="#e8802a" stroke="#a8541a" stroke-width="8" />
  <rect x="268" y="380" width="22" height="46" rx="11" fill="#e8802a" stroke="#a8541a" stroke-width="8" />
  <ellipse cx="223" cy="430" rx="28" ry="9" fill="#e8802a" stroke="#a8541a" stroke-width="8" />
  <ellipse cx="279" cy="430" rx="28" ry="9" fill="#e8802a" stroke="#a8541a" stroke-width="8" />

  <!--
    五官：不描边的纯色点。
  -->
  <circle cx="378" cy="136" r="11" fill="#3b2a1d" />
  <circle cx="381" cy="133" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **78.7%**，最小留白 **46.9px**，重心偏移 **12.5px**，重心 (264, 269)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 46.9px ≥30.72px；§5.3 的 12.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      扁嘴 ✓（**主识别来源**：铲形，不是尖喙）
      翅膀色块 ✓（**第二识别来源**：身上有一片「别的东西」）
      尖翘尾 ✓（**第三识别来源**：与鸟的分叉尾不同）
      身体 + 圆头 ✓（**剪影**）
      脖子 ✓
      蹼脚 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
