<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：sun（太阳）—— **单元 2 的内容**（Story 2.5）。
  基线：Story 2.1 产能实验样本 v1（搬运自 `docs/word-image-lab/u2-sun.svg`，2026-10-20）。

  ⚠️ **搬运时的唯一改动是「本图不是内容」那句声明作废** —— 其余逐字不动。
     lab 那份 v1 是**产能结论的证据**（`docs/word-image-lab/versions.jsonl` 的记录指着它），
     改它的画法就等于改证据。
  ⚠️ **档位注释一个字都没改**（仍是 `abstract`）—— Story 2.5 §0 裁决 9 逐字写着
     「**`sun` 档位不变**（仍 `abstract`，60–75% 含 70.31%）」。
     ⚠️ 别顺手把它改成 `food`：太阳不是食物，改档位会让 G11 取错区间，
     而 §5.1 的 `food` 成员表里没有它。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象符号档（§5.1：60%–75%）

  选它的理由（沿用 lab 的记法）：**独立复核 Story 1.8 / 1.9 的「abstract 档一遍过」结论**。
  它是 abstract 档的难度下限（公认符号、无需组合）。

  G10：不得含 text / image / foreignObject。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="太阳">
  <!--
    12 道光芒：一条三角 + 11 个 rotate 副本。
    写成「定义一次 + 旋转 12 次」而不是 12 条展开坐标，理由有二：
      (1) 文件体积 —— 12 条展开坐标约多 700 字节，而本仓库 §1 有单文件体积上限；
      (2) **可核对性** —— 改光芒长度只需改一处，不必担心漏改第 9 道。

    光芒**不描边**（只有圆盘描边）。这是本图与仓库既有词图风格上的一处偏离，
    记在这里是因为它违反「主体轮廓统一描边」的直觉：
      12 道各描 14px 的话，每道只有 46px 长（134→180），描边吃掉两端各 7px，
      实际可见三角只剩 32px 且边缘发黑 —— 实测（preview 180px/48px）比**不描边更糊**。
      圆盘的 14px 描边已经把主体轮廓交代清楚了，光芒是 §5.5 里说的装饰性笔画。

    外沿实算：光芒外端 r=180 ⇒ 360/512 = 70.3%，落在 abstract 的 60%–75% 内；
    §5.2 四边留白均为 76px，远高于 30.72px 下限（圆形天然居中，无偏移问题）；
    §5.3 重心 (256, 256)，偏移 0px。
  -->
  <g fill="#ffb703">
    <path d="M 243 122 L 256 76 L 269 122 Z" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(30 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(60 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(90 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(120 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(150 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(180 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(210 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(240 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(270 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(300 256 256)" />
    <path d="M 243 122 L 256 76 L 269 122 Z" transform="rotate(330 256 256)" />
  </g>

  <!--
    圆盘：太阳的识别主体。r=112，外沿描边后到 119，与光芒内端 134 之间留 15px 空隙。
    留这道空隙是刻意的：光芒若与圆盘外沿相接，48px 下两者会糊成一团放射形色块，
    读成「爆炸 / 星星」而不是「太阳」。
  -->
  <circle cx="256" cy="256" r="112" fill="#ffb703" stroke="#c77400" stroke-width="14" />
</svg>
