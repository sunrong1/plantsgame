<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：egg（鸡蛋）—— **单元 2 的内容**（Story 2.5）。
  基线：Story 2.1 产能实验样本 v2（搬运自 `docs/word-image-lab/u2-egg.svg`，2026-10-20）。

  ⚠️ **搬运时的唯一改动是档位注释**（`geometric` → `food`）＋ 一段 §5.5b 逐元素记账的**注释**
     （2026-10-23 补，Story 2.5 Task 3.7 的逐图义务）—— **图形逐字未动** ——
     lab 那份 v2 是**产能结论的证据**（`docs/word-image-lab/versions.jsonl` 的记录指着它），
     改它的画法就等于改证据；改它的档位注释则是**必需**的
     （§5.1 已有 `food` 档，而它是食物，见 Story 2.5 §0 裁决 4 / 裁决 9）。
  ⚠️ lab 那句「**本图不是内容**」的声明**已随之作废**：本文件现在**就是内容**，
     落在 `public/assets/words/unit-02/`，由 `u2-egg` 这条词条引用。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：food    ← 食物档（§5.1：60%–80%）；G11 按这一行取区间读，不写死
  ⚠️ **为什么归 `food` 而不是 `geometric`**：§5.1 的 `food` 档是 `[DS]` Story 2.5
     按 DF-105 补的，取值域里明写「成员 = egg / ice-cream / apple / banana / bread / milk」。
     lab 的 v1 曾把它归 `geometric` 并附「落 geometric 不勉强」的说明 ——
     **那条说明现在过时了**：档位存在时就没有「勉强」的问题。
     ⚠️ 但 §5.1 的 `food` 带是 **60%–80%**，比 `geometric` 的 60%–75% 宽 5 个百分点 ——
     本图 69.1% 落在两带里，但**档位必须写 `food`**，否则 G11 取的区间与 §5.1 的分档表分家。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鸡蛋">
  <!--
    蛋壳主体。单条闭合路径：上端窄肩、下腹宽（鸡蛋的识别特征就在这个不对称上）。

    ⚠️ **v1 → v2 的返工原因（48px 剪影不合格，不是几何不合格）**：
       v1 的蛋壳最宽处在 y=272、外沿 264 宽，几何三项在 v1 就全绿。
       但把 v1 栅格化到 48px 逐格看下来，**形体退化成一个近似对称的椭圆**，
       且 v1 唯一的内部元素（白 0.62 的受光面叠在米色蛋壳上）在 48px 下不足 1px、
       直接消失 ⇒ 48px 上只剩「米色椭圆 + 棕描边」，**与球 / 气球不可区分**。
       这一条对 4–8 岁孩子是致命的：选项只有 48px 时他会按形状挑。

       ⇒ v2 改两处，都是冲着 48px 去的：
         (1) **不对称压实** —— 上肩收窄（最宽处从 y=272 压到 **y=332**），
             48px 下「上窄下宽」看得出来了，椭圆读法被排除；
         (2) **硬二色替掉白色高光** —— v1 的白高光是**低对比**的（白 0.62 压米色），
             48px 下必然消失；改成**深色底 + 更大的浅色面**（对比来自明度差，不是叠加），
             48px 下约 15px 宽的浅色块还活着，能把「立体的蛋」与「剪影片」分开。

    外沿实算（加 14px 描边后）：256+14 = 270 宽 / 340+14 = 354 高
    ⇒ §5.1 主体占比 354/512 = 69.1%，落在 food 的 60%–80% 内；
      §5.2 四边最小留白 65px（下缘 440+7 = 447，余 65px），≥30.72px；
      §5.3 重心 (256, 270)，偏移 14px，≤30.72px。

    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **69.1%**，最小留白 **65.0px**，重心偏移 **14.0px**，重心 (256, 270)
    ⇒ §5.1 落在 food 的 60%–80% 内；§5.2 的 65.0px ≥30.72px；§5.3 的 14.0px ≤30.72px。
    ⚠️ `[CR]` 2026-10-23（Story 2.5）**补上这一行**：本文件原先只有上面那段
      **手算推导**，没有**工具实算**的逐字记录 ⇒ 守卫 **G286**（逐张核对实算值）
      在这里**无从核对** ⇒ 那一段手算一旦与真实渲染分家，没有任何东西会红。
  -->
  <path d="M 256 100 C 296 100 322 126 340 174 C 372 248 384 292 384 332 C 384 396 330 440 256 440 C 182 440 128 396 128 332 C 128 292 140 248 172 174 C 190 126 216 100 256 100 Z"
        fill="#d9ae76" stroke="#7a5a34" stroke-width="14" stroke-linejoin="round" />

  <!--
    受光面：一枚**完整落在蛋壳内部**的浅色椭圆（不裁剪、不叠白，靠明度差造体积）。
    刻意做成椭圆而不是不规则块 —— 不规则的块在小尺寸下会糊成一坨，
    规则椭圆在 48px 下边缘仍然干净。

    ⚠️ §5.5b 的记账：48px 下约 15×14px，**承担识别功能**
       （没有它，48px 上只是「深色椭圆 + 描边」，读不出立体、也读不出是蛋），
       所以不是质感图层，不需要在注释里降级为「≥180px 专属」。

    为什么不用 clipPath 把它精确贴到蛋壳轮廓上：多一个 <defs>/<clipPath> 会让
    主体 bbox 的测量口径多一层继承（word-image-metrics 的「对照（含 <g> 继承）」列
    就是为这种情形准备的），而这里只要「不越界」就够了 ⇒ 内缩到最窄处仍余 11px。
  -->
  <ellipse cx="252" cy="214" rx="78" ry="76" fill="#f6e6c6" />

  <!--
    §5.5b 逐元素记账（48px 下是否承担识别）：
      蛋壳 ✓（**主识别来源**：上窄下宽的**不对称**轮廓，48px 下仍能排除「球 / 气球」的椭圆读法）
      受光面（浅色椭圆） ✓（**第二识别来源**：48px 下约 15×14px，把「立体的蛋」与「剪影片」分开）
      ⚠️ **本图没有「≥180px 专属」的元素** —— 两个元素在 48px 下都在画面上。
    ⚠️ 本块是 2026-10-23（Story 2.5 Task 3.7 的**逐图**义务）补的**注释**，
       **图形一个字都没动**（lab 那份 v2 仍是产能结论的证据）。
  -->
</svg>
