<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：goodbye（再见）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 78%、重心居中、正面、完全对称

  ⚠️ **为什么归 `figure`**：§5.1 的 `figure` 判据是「由头 / 身 / 肢 / 道具组合，
     有明确的前后关系」。本图正是头 + 躯干 + 两臂 + 两腿的组合。

  ⚠️ **与单元 1 的 `u1-goodbye` 刻意不同图**：那一张画的是**一只挥手的手**
     （§5.4 台账第 2 行：「挥手的手手背朝前」）。
     本张画的是**一个挥手的人**（全身站姿）。
     ⚠️ **代价要如实记**：同一个词在两个单元里配了两张不同的图 ——
       好处是两张图在各自单元里都能与别的图区分开
       （本单元的 `figure` 成员是 doctor / driver，全是人形，
        若也用「一只手」，它与 `u1-goodbye` 在视觉上就撞了）；
       代价是「goodbye 这个词 = 这张画」的绑定在两单元之间不唯一。
     ⇒ 这一条登记给 1.19 / 2.9 的试玩复核（孩子会不会因为见过另一张而迟疑）。

  ⚠️ **为什么是「人」而不是「手」**：§5.1 的 `figure` 成员全是人形，
     本单元的另两张（doctor / driver）也是人形。
     若本张只画手，它在 48px 下就成了一块**没有身体依托的圆饼** ——
     而单元 1 那张之所以能用「手」，是因为它旁边另有 `u1-hello` 等人形图做对照。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="挥手的人">
  <!--
    头：r=48 的圆，cx 256 / cy 106。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <circle cx="256" cy="106" r="48" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />

  <!--
    眼睛：r=8 的实心深色圆，**不描边**（§5.5：眼睛一律实心）。
    ⚠️ 48px 下直径 16px ≈ 1.5px ⇒ **≥180px 专属**，如实声明。
  -->
  <circle cx="238" cy="100" r="8" fill="#2b2b2b" />
  <circle cx="274" cy="100" r="8" fill="#2b2b2b" />

  <!--
    嘴：一道 10px 的弧（§5.5：嘴允许 9–11px 描边）。
    ⚠️ 48px 下不足 1px ⇒ **≥180px 专属**。
  -->
  <path d="M 240 124 Q 256 136 272 124" fill="none" stroke="#8a5a44" stroke-width="10" stroke-linecap="round" />

  <!--
    躯干：肩宽 124px、到胯收窄的梯形（带圆肩）。
    ⚠️ 衣服取**蓝色系**：单元 2 的两个颜色词是 `green` / `pink`，
       这两个色**不许大面积出现**（会与颜色词那张图撞）⇒ 蓝 / 深蓝是安全的。
    ⚠️ 躯干画在头**之后**（即盖在头下方）：脖子被躯干压住，
       头与肩之间不会出现一段「悬空的脖子」。
  -->
  <path d="M 194 206 C 194 174 214 158 256 158 C 298 158 318 174 318 206 L 310 292 L 202 292 Z"
        fill="#3d7ea6" stroke="#274c6b" stroke-width="14" stroke-linejoin="round" />

  <!--
    左臂（举起的那只）：**先描一道 30px 的深色底，再压一道 16px 的肤色** ——
    两道叠起来的效果是「16px 宽的手臂 + 两侧各 7px 的深色轮廓」。
    ⚠️ 为什么要这么绕：直接用 16px 的肤色笔画手臂，轮廓就没有描边，
       与头 / 躯干 / 腿的画法不一致；而给手臂加描边又没法用单条描边实现
       （描边是**向外**扩的，会把手也撑粗）。
    ⚠️ 手臂从肩 (206,196) 斜向左上到 (156,124) —— **斜的**。
       竖直举起的手臂贴在身体边上，48px 下会被躯干吃掉半截。
  -->
  <path d="M 206 196 L 156 124" fill="none" stroke="#274c6b" stroke-width="30" stroke-linecap="round" />
  <path d="M 206 196 L 156 124" fill="none" stroke="#f2c6a0" stroke-width="16" stroke-linecap="round" />

  <!--
    左手（举起的那只）：r=20 的圆，**深色描边**。
    ⚠️ 48px 下约 9px，是本图**「挥手」的识别点** ⇒ 承担识别功能。
       不画手指：手指在 48px 下不到 1px，画了只是噪声。
  -->
  <circle cx="148" cy="116" r="20" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />

  <!--
    右臂（垂下的那只）：同左臂的两道画法（30px 底 + 16px 肤色）。
    ⚠️ 垂下的手臂**略微外撇**（肩 306,196 → 手 330,262）：
       贴着躯干垂下会读成「身体的一部分」，外撇才读成「一条手臂」。
  -->
  <path d="M 306 196 L 330 262" fill="none" stroke="#274c6b" stroke-width="30" stroke-linecap="round" />
  <path d="M 306 196 L 330 262" fill="none" stroke="#f2c6a0" stroke-width="16" stroke-linecap="round" />

  <!--
    右手：r=18 的圆，深色描边。48px 下约 8px ⇒ 承担识别功能
       （「一只手垂在身侧」比「身体多了一个包」更接近人）。
  -->
  <circle cx="334" cy="274" r="18" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />

  <!--
    两条腿：两根 32px 宽的竖条，从胯 (y=288) 到脚踝 (y=428)。
    ⚠️ **两腿之间留 28px 的空隙**（242 与 270 之间）：并成一条腿的话，
       48px 下整个人读成「一个柱子」。
  -->
  <rect x="210" y="286" width="32" height="142" fill="#3a3f4b" stroke="#23262e" stroke-width="14" stroke-linejoin="round" />
  <rect x="270" y="286" width="32" height="142" fill="#3a3f4b" stroke="#23262e" stroke-width="14" stroke-linejoin="round" />

  <!--
    两只鞋：扁椭圆，贴在腿底。
    ⚠️ 鞋**略微外撇**（左鞋偏左、右鞋偏右）：正对着的话，
       两条腿 + 两只鞋读成「一个梯形」。
  -->
  <ellipse cx="224" cy="430" rx="26" ry="13" fill="#6b4a3a" stroke="#3f2b21" stroke-width="12" />
  <ellipse cx="288" cy="430" rx="26" ry="13" fill="#6b4a3a" stroke="#3f2b21" stroke-width="12" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **77.7%**，最小留白 **51.0px**，重心偏移 **16.0px**，重心 (240, 250)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 51.0px ≥30.72px；§5.3 的 16.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      头 ✓ / 躯干 ✓ / 两条腿 ✓ / 两只鞋 ✓（合起来 = **站姿的人**）
      举起的左手 ✓（**「挥手」的识别点**：一个离开身体轮廓的圆）
      垂下的右手 ✓（让「一只手垂在身侧」成立）
      眼睛 ✗ —— **≥180px 专属**
      嘴 ✗ —— **≥180px 专属**
  -->
</svg>
