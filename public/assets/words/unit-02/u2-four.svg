<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：four（四）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 65%、重心居中、正面、完全对称

  ⚠️ **为什么是「2×2 的四块方砖」，而不是别的排法**：
     ① **数量必须一眼可数** —— 数词插画唯一的任务是让孩子在一眼之内数清楚。
        2×2 的排法是**唯一一种不需要低头数第二遍**的排法（1+1+1+1 要横着数一遍，
        一排四块要横着数一遍，2×2 只需竖着数一遍）。
     ② **方砖之间必须有真正的白缝**（不是描边挨着描边）——
        40px 的格距扣掉两侧各 14px 的描边，白缝还剩 26px（48px 下约 2.4px），
        **这道白缝是「四块」而不是「一块分成四格」的分界**。
        踩过的坑：格距只有 20px 时，两块砖的描边几乎贴在一起，
        48px 下四块读成「一块带十字缝的方板」。
     ③ **颜色必须中性木色** —— 单元 2 的词条里有 `green` / `pink` 两个**颜色词**，
        若方砖上大面积出现绿 / 粉，孩子选「four」时会被颜色带跑 ⇒ **答案串扰**。
     ④ **形状必须是方的** —— 本单元已有 `egg`（椭圆）、`balloon`（滴形）、
        `banana`（弯月），方砖把形状光谱铺开。

  ⚠️ **与单元 1 的 `u1-three` 刻意不同形**：那一张是**等距立方体堆成的金字塔**
     （3/4 视角、有三个面），本张是**正面的平面方砖**（无透视）——
     两张在同一本教材里出现时不能互相认错。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="四块方砖">
  <!--
    四块方砖，尺寸与位置完全一致（140×140），排成 2×2。
    ⚠️ **四块必须一模一样**（同色同形同大小）：
       两块一块大的话，孩子会先比「哪个大」而不是数「有几个」；
       颜色再带上深浅差别，就变成「两种砖各几块」的另一个问题。
    ⚠️ **落地线与顶边都齐平**（都在 y=96 / y=416）——
       错开一点点会读成「远处一个近处一个」，透视反而帮倒忙。
    ⚠️ **描边逐图元写在自身上**（不写在 <g> 上）：
       实算脚本的半宽口径只认元素自己声明的 stroke（art-direction.md §5「已知偏差」），
       写到 <g> 上会让实算值偏小 —— **偏小正是判绿的方向**。
  -->
  <rect x="96" y="96" width="140" height="140" fill="#c98b4b" stroke="#6b3f1c" stroke-width="14" stroke-linejoin="round" />
  <rect x="276" y="96" width="140" height="140" fill="#c98b4b" stroke="#6b3f1c" stroke-width="14" stroke-linejoin="round" />
  <rect x="96" y="276" width="140" height="140" fill="#c98b4b" stroke="#6b3f1c" stroke-width="14" stroke-linejoin="round" />
  <rect x="276" y="276" width="140" height="140" fill="#c98b4b" stroke="#6b3f1c" stroke-width="14" stroke-linejoin="round" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **65.2%**，最小留白 **89.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 89.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      四块方砖 ✓（**唯一的识别来源**：四块 + 四道白缝 ⇒ 一眼可数）
      ⚠️ 本图**没有**任何 <3px 的图元 —— 四块砖在 48px 下各约 13px，
         白缝约 2.4px。白缝是**块与块之间的空隙**（不是图元），
         它不需要按图元记账，但它是「四」成立的前提 ⇒ 上面的实测值必须保住它。
  -->
</svg>
