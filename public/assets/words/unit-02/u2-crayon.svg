<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：crayon（蜡笔）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 64%、重心居中、横放、尖端朝右

  ⚠️ **为什么归 `geometric`**：蜡笔的**本体是一根短粗的圆柱**（蜡），
     §5.1 的 `geometric` 判据里明写「笔杆本质是几何体」。

  ⚠️ **为什么横放而不斜放**：单元 2 里已经有斜置的 `ruler`（尺子）了，
     两张都斜放，48px 下就分不出「尺」和「笔」。⇒ 蜡笔横放。

  ⚠️ **v1 被判为「马克笔」—— 这一版改了什么**（2026-10-23，48px/180px 栅格化复核）：
     v1 是 3:1 的细长杆 + 尖头 ⇒ 180px 上读成「一支马克笔」。三处改法：
     ① **杆身压到 2.2:1**（248 宽 × 112 高）—— 蜡笔是短粗的，笔是细长的。
     ② **尖端改成钝的截锥**（v1 是尖三角）—— 尖头 = 铅笔 / 笔，钝头 = 蜡笔。
     ③ **纸套加宽到近半根**（96px）—— 蜡笔的纸标几乎裹住大半个杆身。

  ⚠️ **饱和蓝 + 一段米白纸套**：蜡笔的识别靠「**一根带纸套的短粗杆**」。
     蓝 #2d6cb5 与尺子的冰蓝 #cfe0e8 差一个明度档。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="蜡笔">
  <!--
    蜡身：一根横放的长条，圆角 14px。
    ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <rect x="100" y="200" width="248" height="112" rx="14"
        fill="#2d6cb5" stroke="#1b4a86" stroke-width="12" />

  <!--
    纸套：一段米白的箍，贴着尖端那头。
    ⚠️ **纸套要压在蜡身之上**（画在后面）：它是「套在外面的一层纸」，
       压在下面会读成「蜡身上贴了一条白胶带」。
    ⚠️ 纸套的描边用 8px（比蜡身细）：纸是薄的。
    ⚠️ 纸套是**不透明**的米白，不是挖空 —— 它挡着后面的蓝。
  -->
  <rect x="252" y="200" width="96" height="112" fill="#f7f3e8" stroke="#1b4a86" stroke-width="8" />

  <!--
    蜡尖：一个**截锥**（梯形），不是尖角。
    ⚠️ 尖角会读成铅笔 / 马克笔；钝头才读成蜡笔。
    ⚠️ 描边 12px、圆角接缝：与蜡身的粗细一致，才看得出是同一根。
  -->
  <path d="M 348 200 L 412 232 L 412 280 L 348 312 Z"
        fill="#2d6cb5" stroke="#1b4a86" stroke-width="12" stroke-linejoin="round" />

  <!--
    蜡尖的端面：一小块深色圆角矩形。
    ⚠️ 这是「蜡被磨平的那一面」⇒ 48px 下约 1.3px ⇒ **≥180px 专属**，如实声明。
  -->
  <rect x="406" y="232" width="14" height="48" rx="6" fill="#1b4a86" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **63.7%**，最小留白 **92.0px**，重心偏移 **1.0px**，重心 (257, 256)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 92.0px ≥30.72px；§5.3 的 1.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      蜡身 ✓（**主识别来源**：短粗的横杆）
      米白纸套 ✓（**第二识别来源**：「带纸套的杆」⇒ 蜡笔而非铅笔）
      钝锥蜡尖 ✓（把铅笔 / 马克笔排除掉）
      蜡尖端面 ✗ —— **≥180px 专属**
  -->
</svg>
