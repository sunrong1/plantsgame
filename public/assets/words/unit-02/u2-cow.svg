<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：cow（奶牛）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 80%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：奶牛是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **奶牛的三条主线**：**黑白花斑 + 弯角 + 宽平的鼻口**。
     花斑是最经得起缩小的那一条（48px 上还是黑白两色块），
     角和宽鼻口在 180px 上补足「牛」的读法。

  ⚠️ **v1 的三个毛病（2026-10-23，48px/180px 栅格化复核）**：
     ① **眼睛那块黑斑 + 浅色眼睛**在 180px 上读成一只「斗鸡眼」，整张脸垮了
        ⇒ v2 把黑斑挪到**额头上**，眼睛恢复成普通的深色点。
     ② **角几乎看不见**（角画在头之前，只露出 12px 的尖）
        ⇒ v2 的角整体上移，**露出头轮廓 50px**。
     ③ **尾巴在白底上看不见**（浅色细尾），尾毛成了一个孤零零的黑点
        ⇒ v2 的整条尾巴改成深色。

  ⚠️ **白底 + 黑斑在灰度档下会变成「灰底 + 深斑」** ——
     这不影响识别（深色斑块的分布就是花的形状），但 `u2-egg`（米白）
     与本图在灰度档下的明度接近，⚠️ 这一条要进 §5.4 台账复核。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="奶牛">
  <!--
    尾巴：一根**深色**的细尾，末端一团更粗的黑毛。
    ⚠️ 牛的尾巴在白底上本来就看不清 ⇒ 这里整条画成深色，
       否则尾毛会变成一个悬空的孤点（v1 的毛病）。
  -->
  <path d="M 96 300 Q 60 280 62 210" fill="none" stroke="#3b2b28" stroke-width="12" stroke-linecap="round" />
  <ellipse cx="62" cy="196" rx="16" ry="22" fill="#3b2b28" transform="rotate(8 62 196)" />

  <!--
    身体：臀部 + 胸部两个椭圆并起来。
    ⚠️ 奶牛比熊**更长**（rx 大、ry 小）—— 牛是长条形的家畜。
  -->
  <ellipse cx="196" cy="320" rx="136" ry="104" fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" />
  <ellipse cx="302" cy="300" rx="112" ry="100" fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" />

  <!--
    黑花斑：三块不规则的深色斑。
    ⚠️ **斑要「不规则」**：画成规整的圆就读成「几个洞」。
       用带缺口的形状（两个圆的并集）才像真的花斑。
    ⚠️ 斑**不描边**（它们本来就是深色块，描边只会多一圈灰）。
  -->
  <path d="M 112 268 C 112 238 148 222 174 238 C 202 254 190 300 156 304 C 128 306 112 290 112 268 Z"
        fill="#3b2b28" />
  <path d="M 232 244 C 232 216 270 206 292 226 C 312 246 296 288 264 288 C 238 288 232 266 232 244 Z"
        fill="#3b2b28" />
  <path d="M 330 338 C 330 308 368 300 388 320 C 404 340 388 380 356 380 C 332 380 330 360 330 338 Z"
        fill="#3b2b28" />

  <!--
    腿：牛腿最「柱状」（rx 小、笔直）。
  -->
  <rect x="146" y="326" width="58" height="104" rx="29" fill="#e8e2d4" stroke="#3f2b21" stroke-width="12" />
  <rect x="300" y="318" width="58" height="112" rx="29" fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" />

  <!--
    角：两只向上弯的小角，**整段画在头轮廓之上 50px**。
    ⚠️ v1 的角只露出 12px，180px 上根本看不见 ⇒ 这一版整体上移。
    ⚠️ 弯的、向上、尖端朝内 —— 直角会读成牛角插反了。
  -->
  <path d="M 314 150 Q 286 122 292 92" fill="none" stroke="#e8dcc4" stroke-width="22" stroke-linecap="round" />
  <path d="M 388 150 Q 416 122 410 92" fill="none" stroke="#e8dcc4" stroke-width="22" stroke-linecap="round" />

  <!--
    耳朵：头的两侧各一片横向的耳朵（牛耳是横的，不是竖的）。
  -->
  <ellipse cx="292" cy="198" rx="26" ry="16" fill="#f0ece2" stroke="#3f2b21" stroke-width="12" />
  <ellipse cx="412" cy="198" rx="26" ry="16" fill="#f0ece2" stroke="#3f2b21" stroke-width="12" />

  <!--
    头。
  -->
  <ellipse cx="350" cy="200" rx="64" ry="58" fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" />

  <!--
    额头上的黑斑：一块**不压眼睛**的花斑。
    ⚠️ v1 把黑斑画在眼睛上、眼睛又用浅色点 ⇒ 180px 上成了一只斗鸡眼。
       v2 的斑只占额头，眼睛回到普通的深色点。
  -->
  <path d="M 306 172 C 306 148 334 140 346 158 C 356 174 344 194 326 192 C 310 190 306 182 306 172 Z"
        fill="#3b2b28" />

  <!--
    鼻口：牛的口鼻**又宽又平**（比熊的更宽更扁），加两个鼻孔。
  -->
  <ellipse cx="406" cy="230" rx="44" ry="26" fill="#f0ece2" stroke="#3f2b21" stroke-width="12" />
  <ellipse cx="394" cy="226" rx="6" ry="8" fill="#7a6a60" />
  <ellipse cx="416" cy="226" rx="6" ry="8" fill="#7a6a60" />

  <!--
    眼睛：普通的深色点 + 一点高光。
  -->
  <circle cx="374" cy="190" r="12" fill="#3b2a1d" />
  <circle cx="377" cy="187" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **80.6%**，最小留白 **43.1px**，重心偏移 **6.5px**，重心 (250, 259)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 43.1px ≥30.72px；§5.3 的 6.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      黑花斑 ×3 ✓（**主识别来源**：白底上的深色块，缩小后依然成立）
      长条躯干 + 柱状腿 ✓（**剪影**：牛是长身的家畜）
      弯角 ✓（**第二识别来源**：180px 上最直接的「牛」）
      宽平鼻口 + 鼻孔 ✓（**第三识别来源**）
      额上的黑斑 ✓（**第四识别来源**：黑白花的分布）
      耳 ✓
      深色尾巴与尾毛 ✗ —— **≥180px 专属**
      眼睛 ✗ —— **≥180px 专属**
  -->
</svg>
