<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：doctor（医生）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 76%、重心居中、正面、左右对称

  ⚠️ **为什么归 `figure`**：§5.1 的 `figure` 判据是「由头 / 身 / 肢 / 道具组合，
     有明确的前后关系」。本图是头 + 白大褂 + 两臂 + 两腿 + **听诊器道具**。

  ⚠️ **医生的两条识别线索**：**白大褂 + 听诊器**。
     白大褂在 48px 下就是一件**白到发亮的长衣**（本单元没有第二件白衣，
     `u2-milk` 是奶白色但那是盒子）；听诊器那圈深色的 U 形挂在脖子上，
     是医生独有的道具 —— 48px 下约 2px 的深色弧。

  ⚠️ **大褂下面要露一点别的颜色**：全白的一团在 48px 下会读成「一块布」。
     ⇒ 领口露出一个**深蓝色的衬衫 V**，把上半身分成三块（头 / V / 白褂）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="医生">
  <!--
    头：r=48 的圆，cx 256 / cy 104。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <circle cx="256" cy="104" r="48" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />

  <!--
    头发：贴在头顶上半部的一片（盖住额头的一部分）。
    ⚠️ 头发画在头**之后**（即叠在上面），只压住头顶 ⇒ 读成「有头发」而不是「戴帽子」。
  -->
  <path d="M 208 100 C 208 50 304 50 304 100 C 292 80 220 80 208 100 Z" fill="#4a3020" />

  <!--
    眼睛：r=8 的实心深色圆，**不描边**（§5.5：眼睛一律实心）。
    ⚠️ 48px 下直径 16px ≈ 1.5px ⇒ **≥180px 专属**，如实声明。
  -->
  <circle cx="238" cy="98" r="8" fill="#2b2b2b" />
  <circle cx="274" cy="98" r="8" fill="#2b2b2b" />

  <!--
    嘴：一道 10px 的弧（§5.5：嘴允许 9–11px 描边）。
    ⚠️ 48px 下不足 1px ⇒ **≥180px 专属**。
  -->
  <path d="M 240 122 Q 256 134 272 122" fill="none" stroke="#8a5a44" stroke-width="10" stroke-linecap="round" />

  <!--
    白大褂：从肩一直到膝的**一整件长衣**。
    ⚠️ 肩要圆（曲线的肩线），腰身略收，下摆张开一点 ——
       直筒的白块读成「一块白板」。
    ⚠️ 大褂**盖住脖子**（画在头之后）：脖子被压住，
       头与肩之间不会出现一段悬空的脖子（同 u2-goodbye 的做法）。
  -->
  <path d="M 190 206 C 190 172 212 154 256 154 C 300 154 322 172 322 206
           L 334 366 L 178 366 Z"
        fill="#f7f3e8" stroke="#3f2b21" stroke-width="14" stroke-linejoin="round" />

  <!--
    领口露出的深蓝衬衫：一个**倒三角**。
    ⚠️ 这个 V 把上半身分成三块（头 / V / 白褂），
       48px 下才不是「一块白」；V 形也是开襟白大褂的典型样子。
  -->
  <path d="M 232 156 L 280 156 L 264 232 L 248 232 Z" fill="#3d7ea6" />

  <!--
    听诊器：挂在脖子上的一圈**深色 U 形管** + 胸前的一枚听头。
    ⚠️ **这是医生的专属道具**，也是 48px 下唯一能认出「医生」而不是「穿白大褂的人」的东西。
    ⚠️ U 形管画在白大褂之上（深色压浅色）⇒ 48px 下是一道约 2px 的深弧。
  -->
  <path d="M 208 182 Q 256 268 304 182" fill="none" stroke="#274c6b" stroke-width="13"
        stroke-linecap="round" />
  <circle cx="206" cy="180" r="11" fill="#274c6b" />
  <circle cx="306" cy="180" r="11" fill="#274c6b" />
  <circle cx="300" cy="262" r="16" fill="#274c6b" />

  <!--
    两条腿：深色长裤，从大褂下摆 (y=360) 到脚踝 (y=428)。
    ⚠️ **两腿之间留 30px 的空隙**（242 与 272 之间）：
       并成一条腿的话，48px 下整个人读成「一个柱子」。
  -->
  <rect x="212" y="360" width="30" height="70" fill="#3a3f4b" stroke="#23262e" stroke-width="14"
        stroke-linejoin="round" />
  <rect x="272" y="360" width="30" height="70" fill="#3a3f4b" stroke="#23262e" stroke-width="14"
        stroke-linejoin="round" />

  <!--
    两只鞋：扁椭圆，贴在腿底，略微外撇。
  -->
  <ellipse cx="226" cy="430" rx="26" ry="13" fill="#6b4a3a" stroke="#3f2b21" stroke-width="12" />
  <ellipse cx="288" cy="430" rx="26" ry="13" fill="#6b4a3a" stroke="#3f2b21" stroke-width="12" />

  <!--
    两条手臂：沿用 u2-goodbye 的两道画法 ——
    **先描一道 30px 的深色底，再压一道 16px 的白袖**，等于「16px 宽的手臂 + 两侧各 7px 的轮廓」。
    ⚠️ 手臂**略微外撇**：贴着躯干垂下会读成「身体的一部分」。
    ⚠️ 手是**肤色**的小圆：白袖 + 白大褂连成一片就看不出有手了。
  -->
  <path d="M 204 210 L 172 300" fill="none" stroke="#3f2b21" stroke-width="30" stroke-linecap="round" />
  <path d="M 204 210 L 172 300" fill="none" stroke="#f7f3e8" stroke-width="16" stroke-linecap="round" />
  <path d="M 308 210 L 340 300" fill="none" stroke="#3f2b21" stroke-width="30" stroke-linecap="round" />
  <path d="M 308 210 L 340 300" fill="none" stroke="#f7f3e8" stroke-width="16" stroke-linecap="round" />
  <circle cx="168" cy="312" r="18" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />
  <circle cx="344" cy="312" r="18" fill="#f2c6a0" stroke="#8a5a44" stroke-width="14" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **75.6%**，最小留白 **62.0px**，重心偏移 **13.5px**，重心 (256, 243)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 62.0px ≥30.72px；§5.3 的 13.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      头 ✓ / 白大褂 ✓ / 两条腿 ✓ / 两只鞋 ✓（合起来 = **站姿的人**）
      白大褂的白色 ✓（**主识别来源**：一件长到膝的白衣）
      听诊器 ✓（**第二识别来源**：脖子上那圈深色 U + 胸前的听头）
      领口的深蓝 V ✓（**第三识别来源**：把上半身分开，不是一整块白）
      两只手 ✓（让「垂手站在那儿」成立）
      头发 ✗ —— **≥180px 专属**
      眼睛 ✗ —— **≥180px 专属**
      嘴 ✗ —— **≥180px 专属**
  -->
</svg>
