<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：tiger（老虎）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 78%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：老虎是具象动物，轮廓由曲线主导，
     §5.1 的 `organic` 成员（`fish` / `dog` / `cat` / `rabbit` / `panda` / `bird`）同族。

  ⚠️ **认虎不看脸，看条纹**：条纹是这个词最硬、也最经得起缩小的线索 ——
     耳朵在 48px 上会并进脑袋，腿会被身体压住，**条纹不会**。
     ⇒ 条纹画在躯干上有 4 道、头上 3 道、尾巴上 2 环。

  ⚠️ **和 `lion` 的分工**：两者都是橙黄色大猫。
     ⇒ `tiger` 给**深色条纹**，`lion` 给**鬃毛**（一圈放射的尖瓣），
     两个词的特征互不重叠。

  ⚠️ **为什么用橘色 #ee9b3f 而不是狮子的金**：狮子用更饱和的橙黄（见 u2-lion），
     老虎用偏红的橘，两者在灰度档下也差得开（橘更暗、更红）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="老虎">
  <!--
    尾巴：从臀部甩向左上的一根粗曲线（40px）。
    ⚠️ 尾巴画得粗是有理由的：它是 48px 下最不容易认错、也最不容易被身体压住的部位。
    ⚠️ 描边写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <path d="M 120 300 Q 66 250 76 148" fill="none" stroke="#ee9b3f" stroke-width="40"
        stroke-linecap="round" />

  <!--
    尾巴上的两环深色条纹。
    ⚠️ 48px 下每环约 1.4px ⇒ 尾巴条纹本身不承担识别，
       躯干上的条纹才承担（见下方 §5.5b 记账）。
  -->
  <path d="M 92 256 L 116 282" fill="none" stroke="#7a3b12" stroke-width="13" stroke-linecap="round" />
  <path d="M 64 166 L 86 184" fill="none" stroke="#7a3b12" stroke-width="13" stroke-linecap="round" />

  <!--
    身体：臀部 + 胸部两个椭圆并起来，分成两半是为了让肩线有起伏。
    ⚠️ 两个椭圆都**描边**（各自的），接缝处因此有一小段弧线 ——
       这是 u1-dog 以来本仓库的做法，描边让剪影在 48px 上是实的。
  -->
  <ellipse cx="196" cy="320" rx="128" ry="104" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />
  <ellipse cx="306" cy="300" rx="104" ry="96" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />

  <!--
    躯干上的四道条纹：**最长的识别线索**。
    ⚠️ 每一道都画在躯干椭圆**内部**（不出边）—— 出边的条纹会读成「毛」。
  -->
  <g fill="none" stroke="#7a3b12" stroke-width="15" stroke-linecap="round">
    <path d="M 120 258 Q 138 310 126 358" />
    <path d="M 170 240 Q 188 300 176 350" />
    <path d="M 220 228 Q 236 290 226 336" />
    <path d="M 288 232 Q 302 280 292 330" />
  </g>

  <!--
    后腿（远侧，颜色略深）与前腿：两根落点齐平的竖柱（§5 模板的「落地线」）。
  -->
  <rect x="150" y="326" width="56" height="104" rx="28" fill="#d98530" stroke="#7a3b12" stroke-width="12" />
  <rect x="306" y="320" width="56" height="112" rx="28" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />

  <!--
    耳朵：两只**圆的**耳朵（老虎的耳朵是圆的，狮子是尖的）。
    ⚠️ 圆耳 + 圆脸 = 熊 / 狗；配上条纹才是虎。
  -->
  <ellipse cx="316" cy="150" rx="24" ry="22" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />
  <ellipse cx="384" cy="150" rx="24" ry="22" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />

  <!--
    头：比身体小一圈的圆头，给口鼻让出长度。
  -->
  <ellipse cx="350" cy="200" rx="66" ry="60" fill="#ee9b3f" stroke="#7a3b12" stroke-width="12" />

  <!--
    头上的三道短纹：额头的「王」字是虎的标志，
     但 48px 下画不出「王」⇒ 只画三道短促的弧。
  -->
  <g fill="none" stroke="#7a3b12" stroke-width="13" stroke-linecap="round">
    <path d="M 316 154 Q 330 172 318 194" />
    <path d="M 352 148 Q 364 168 354 190" />
    <path d="M 386 158 Q 396 176 388 196" />
  </g>

  <!--
    口鼻：向外突出的浅色吻部 + 一个深色鼻头。
    ⚠️ 浅色只到鼻头前一小段；再大就读成「一条白围巾」。
  -->
  <path d="M 396 174 Q 452 178 452 202 Q 452 226 396 230 Q 384 202 396 174 Z"
        fill="#f6e7d2" stroke="#7a3b12" stroke-width="12" stroke-linejoin="round" />

  <!--
    五官：不描边的纯色点（描边在 48px 下会糊成一个饼）。
  -->
  <circle cx="378" cy="188" r="13" fill="#3b2a1d" />
  <circle cx="382" cy="184" r="4.5" fill="#ffffff" />
  <ellipse cx="446" cy="202" rx="13" ry="10" fill="#7a3b12" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **79.0%**，最小留白 **53.0px**，重心偏移 **24.0px**，重心 (257, 280)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 53.0px ≥30.72px；§5.3 的 24.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      躯干 + 胸部 ✓（**剪影**：侧身站立的四足兽）
      躯干四道条纹 ✓（**主识别来源**：**唯一**能把它和 `lion` / `bear` 分开的特征）
      头 + 圆耳 ✓
      口鼻 + 鼻头 ✓
      尾巴 ✓（**第二识别来源**：一条粗长的甩尾）
      尾巴上的两环纹 ✗ —— **≥180px 专属**
      头上三道额纹 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
