<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：giraffe（长颈鹿）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 80%、重心居中略偏下、3/4 侧面朝右

  ⚠️ **为什么归 `organic`**：长颈鹿是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **长颈鹿最认错的是 `horse` / `cow`**（都是长身子的家畜）：
     ⇒ 长颈鹿的三条主线是：**一条长得离谱的脖子 + 头顶两个带球的小角
       + 身上不规则的褐色斑块**。脖子是那一条「一眼就分得开」的。

  ⚠️ **脖子不能画成一根圆柱**：脖子是**上粗下细**的楔形，
     顶端接着那个小脑袋、底端连着身子 —— 一头粗一头细才像长颈鹿。

  ⚠️ **斑块用不规则的形状**：规整的圆斑读成「泡泡纸」。

  ⚠️ **v1 超标（85.4% / 留白 18.5px）**：初版把角画得太高、腿画得太长，
     外接盒高 433px、上缘只剩 18.5px。⇒ 这一版整体压矮 20px 左右，
     目标外接盒高约 410px、四边留白都 ≥44px。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="长颈鹿">
  <!--
    尾巴：一根细尾，末端一小撮毛。
  -->
  <path d="M 96 296 Q 66 322 72 370" fill="none" stroke="#a3703a" stroke-width="10" stroke-linecap="round" />
  <ellipse cx="73" cy="378" rx="12" ry="16" fill="#a3703a" transform="rotate(8 73 378)" />

  <!--
    身体：一个横着的椭圆（长颈鹿的身子其实不大）。
    ⚠️ **身子要画得比脖子小**：身子一大就压过脖子，读成「一匹马」。
  -->
  <ellipse cx="215" cy="328" rx="126" ry="66" fill="#f4e0b0" stroke="#7a4a1c" stroke-width="12" />

  <!--
    腿：两条长腿（象的柱腿是粗的，长颈鹿的腿是细长的）。
  -->
  <rect x="140" y="372" width="40" height="76" rx="18" fill="#e6cd95" stroke="#7a4a1c" stroke-width="12" />
  <rect x="266" y="372" width="40" height="76" rx="18" fill="#f4e0b0" stroke="#7a4a1c" stroke-width="12" />

  <!--
    身上的褐色斑块：两块不规则的形状。
    ⚠️ 形状要有缺口（两个圆的并集），规整的圆会读成「泡泡纸」。
  -->
  <path d="M 138 306 C 138 282 170 270 192 284 C 214 298 204 336 174 340 C 148 342 138 326 138 306 Z"
        fill="#a3703a" />
  <path d="M 236 292 C 236 268 270 260 288 278 C 304 296 288 328 260 324 C 240 322 236 308 236 292 Z"
        fill="#a3703a" />

  <!--
    脖子：一段**上细下粗**的楔形，从身子前面一直伸到画面上方。
    ⚠️ 脖子是这张图的**主识别线索**，必须够长（从 y≈336 到 y≈144）。
    ⚠️ 上细下细会读成「一根管子插在身子上」。
  -->
  <path d="M 296 336 C 296 262 302 196 320 144 L 386 160 C 372 214 372 272 372 336 Z"
        fill="#f4e0b0" stroke="#7a4a1c" stroke-width="12" stroke-linejoin="round" />

  <!--
    脖子上的斑块：两块。
  -->
  <path d="M 306 262 C 306 244 332 238 348 252 C 362 266 348 292 326 288 C 310 286 306 274 306 262 Z"
        fill="#a3703a" />
  <path d="M 322 192 C 322 176 346 170 360 184 C 372 198 360 220 340 216 C 326 214 322 204 322 192 Z"
        fill="#a3703a" />

  <!--
    头：一个小椭圆（长颈鹿的头很小）+ 一个更深的吻部。
  -->
  <ellipse cx="372" cy="120" rx="54" ry="42" fill="#f4e0b0" stroke="#7a4a1c" stroke-width="12" />
  <ellipse cx="414" cy="132" rx="28" ry="19" fill="#a3703a" stroke="#7a4a1c" stroke-width="10" />

  <!--
    角：长颈鹿头顶的两个「带球小角」（ossicones）。
    ⚠️ **顶端要有一颗圆球** —— 尖角会读成山羊 / 牛；球是长颈鹿独有的。
  -->
  <rect x="344" y="64" width="13" height="26" rx="6" fill="#a3703a" stroke="#7a4a1c" stroke-width="9" />
  <circle cx="350" cy="62" r="13" fill="#a3703a" stroke="#7a4a1c" stroke-width="9" />
  <rect x="386" y="62" width="13" height="26" rx="6" fill="#a3703a" stroke="#7a4a1c" stroke-width="9" />
  <circle cx="392" cy="60" r="13" fill="#a3703a" stroke="#7a4a1c" stroke-width="9" />

  <!--
    五官：不描边的纯色点。
  -->
  <circle cx="398" cy="112" r="11" fill="#3b2a1d" />
  <circle cx="401" cy="109" r="4" fill="#ffffff" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **80.4%**，最小留白 **42.5px**，重心偏移 **7.8px**，重心 (253, 248)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 42.5px ≥30.72px；§5.3 的 7.8px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      长脖子 + 小头 ✓（**主识别来源**：整张图的剪影就是它）
      身体与细腿 ✓（**剪影**：长身子的家畜）
      褐色斑块 ✓（**第二识别来源**：不规则深色块）
      带球小角 ✓（**第三识别来源**：180px 上把长颈鹿和山羊分开）
      吻部 ✗ —— **≥180px 专属**
      尾巴与尾毛 ✗ —— **≥180px 专属**
      眼睛与高光 ✗ —— **≥180px 专属**
  -->
</svg>
