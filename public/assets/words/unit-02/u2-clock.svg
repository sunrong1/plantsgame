<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：clock（钟）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 65%、重心居中、正面、完全对称

  ⚠️ **为什么归 `geometric`**：钟面是**正圆 + 两根指针**，轮廓由规则的圆弧主导。
     §5.1 的 `geometric` 成员（`ball` / `book` / `pen` / `bag` / `desk` / `chair`）
     都是「规则几何形」这一族，钟与它们同族。

  ⚠️ **钟面不写数字**（G10 禁 `<text>`）—— 用**四根刻度线**代替 12 / 3 / 6 / 9。
     刻度是「这是一只钟」的第一个线索（钟面 + 指针就够了，但刻度让指针有参照）。

  ⚠️ **指针的角度刻意不对称**（时针指向 10 点方向、分针指向 4 点方向）：
     两针都竖直（12 点整）的话，钟面会读成「一个带两条线的圆盘」；
     不对称的十字才有「在走」的意味。
     ⚠️ **不用数字 10 / 4 的写法**（禁 `<text>`），但两针夹角明显不是直角 ⇒ 读成「钟」。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="钟">
  <!--
    表圈：r=158 的圆。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <circle cx="256" cy="256" r="158" fill="#6b4a3a" stroke="#3f2b21" stroke-width="14" />

  <!--
    表盘：r=138 的浅色圆。
    ⚠️ **比表圈小 20px**：这一圈深色的边就是「钟壳」，
       没有它，钟面读成「一个白色的盘子」。
    ⚠️ 底色取**米白**（#f7f3e8）而不是纯白：纯白在灰度档下与纸白底同明度，
       整张图会「消失」。§5.4 的 48px 台账里，米白/白底都要能站住。
  -->
  <circle cx="256" cy="256" r="138" fill="#f7f3e8" />

  <!--
    四根刻度：12 / 3 / 6 / 9 四个方向，10px。
    ⚠️ **只画四根，不画十二根**：十二根在 48px 下每根不到 1px，会糊成一圈灰环，
       反而把表盘弄脏。四根在 48px 下各约 1px，但**位置明确**（正交）⇒ 读得出钟面。
  -->
  <path d="M 256 138 L 256 172" fill="none" stroke="#3f2b21" stroke-width="10" stroke-linecap="round" />
  <path d="M 256 340 L 256 374" fill="none" stroke="#3f2b21" stroke-width="10" stroke-linecap="round" />
  <path d="M 138 256 L 172 256" fill="none" stroke="#3f2b21" stroke-width="10" stroke-linecap="round" />
  <path d="M 340 256 L 374 256" fill="none" stroke="#3f2b21" stroke-width="10" stroke-linecap="round" />

  <!--
    时针：指向 10 点方向（左上），14px。
    ⚠️ **比分钟针粗**（14 > 12）：两根一样粗的话，钟面读成「一个转盘」。
  -->
  <path d="M 256 256 L 202 200" fill="none" stroke="#3f2b21" stroke-width="14" stroke-linecap="round" />

  <!--
    分针：指向 4 点方向（右下），12px。
    ⚠️ 两针**夹角不是直角**（左上 vs 右下 ≈ 150°）——
       直角的两针读成「十字准星 / 风扇」。
  -->
  <path d="M 256 256 L 330 300" fill="none" stroke="#3f2b21" stroke-width="12" stroke-linecap="round" />

  <!--
    中心轴：r=12 的深色实心圆，不描边。
    ⚠️ §5.5b 的记账：48px 下约 2.3px ⇒ **≥180px 专属**，
       如实声明（它是「两根针长在一起」的结构交代，不是识别点）。
  -->
  <circle cx="256" cy="256" r="12" fill="#3f2b21" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **64.5%**，最小留白 **91.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 91.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      表圈 ✓ / 表盘 ✓（合起来 = **一只钟壳**）
      四根刻度 ✓（给指针一个参照）
      时针 + 分针 ✓（**主识别来源**：两针交于一点、角度不对称）
      中心轴 ✗ —— **≥180px 专属**
  -->
</svg>
