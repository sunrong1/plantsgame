<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：mouse（老鼠）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 74%、重心居中、正面、完全对称

  ⚠️ **为什么归 `organic`**：§5.1 的 `organic` 判据是「具象动物，轮廓由曲线主导」。
     老鼠全身由椭圆与圆构成，没有一条直线 ⇒ 归 `geometric` 不对，
     归 `abstract` 也不对。

  ⚠️ **与 `u2-bear` 的区分靠「耳朵相对身体的大小」，不靠配色**：
     两只都是「圆身体 + 圆耳朵 + 灰褐色」。
     ⇒ 老鼠的耳朵**直径 136px，几乎与身体同宽**（孩子的第一印象就是「大耳朵」），
       熊的耳朵只有身宽的四分之一。
     48px 下这个比例差是**看得见的**（耳朵 13px vs 身体 26px），
     而「老鼠 vs 熊」正是本卡要考的分辨。

  ⚠️ **为什么没有胡须**：胡须是老鼠的标志，但它在 48px 下不到 1px，
     而且横向伸出会把主体外接盒撑宽、把 §5.1 的占比顶进带的上沿。
     ⇒ 判它是「48px 下不存在的部件」，**不画**（§5.5b 只要求如实记账，不要求把质感画出来）。
     ⇒ 48px 的识别由「**两颗大圆耳 + 一张圆脸**」承担。

  ⚠️ **颜色刻意避开 `green` / `pink`**（单元 2 的两个颜色词）：
     灰褐色 + 米色内耳。若内耳画成粉色，孩子看到「pink」会在这张图上停住 ⇒ **答案串扰**。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="老鼠">
  <!--
    身体（兼头）：一个椭圆，cx 256 / cy 300 / rx 134 / ry 118。
    ⚠️ **偏扁**（rx 134 > ry 118）：正圆会读成「球」，
       老鼠的正面剪影是**横向略宽**的（身子比头圆，两侧有腿）。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <ellipse cx="256" cy="300" rx="134" ry="118" fill="#a09488" stroke="#5c5147" stroke-width="14" />

  <!--
    两只耳朵：r=68 的圆，中心 (142, 146) 与 (370, 146)。
    ⚠️ **耳朵画在身体之后**（即叠在身体上面）：正面看的老鼠，
       耳朵是**贴着头的两侧立起来的**，会盖住头顶的一小段轮廓。
       若把耳朵画在身体下面，只有上半圈露出来，48px 下变成「两坨小补丁」。
    ⚠️ 耳朵之间留 44px 的空隙（370−142 = 228，两个半径 68 的圆相距 228 ⇒ 空隙 92px）：
       耳朵连成一片的话，整张图读成「一个带缺口的大圆」。
  -->
  <circle cx="142" cy="146" r="68" fill="#a09488" stroke="#5c5147" stroke-width="14" />
  <circle cx="370" cy="146" r="68" fill="#a09488" stroke="#5c5147" stroke-width="14" />

  <!--
    内耳：r=32 的浅色圆，不描边。
    ⚠️ §5.5b 的记账：48px 下约 6px，**承担识别功能** ——
       它把「两只圆」变成「两只**耳朵**」（内耳是耳廓的标志），
       没有它，48px 上只是一张脸加两块圆饼。
  -->
  <circle cx="142" cy="146" r="32" fill="#dcc9b8" />
  <circle cx="370" cy="146" r="32" fill="#dcc9b8" />

  <!--
    眼睛：r=17 的实心深色圆，**不描边**（§5.5：眼睛与高光一律实心）。
    ⚠️ 直径 34px ⇒ 48px 下约 3.2px，刚好越过 §5.5b 的 3px 门槛 ⇒ 承担识别功能。
       眼睛是「这是一张脸而不是一块饼」的第二个信号。
  -->
  <circle cx="214" cy="268" r="17" fill="#2b2b2b" />
  <circle cx="298" cy="268" r="17" fill="#2b2b2b" />

  <!--
    鼻子：小椭圆，rx 15 / ry 11，实心深褐，**不描边**。
    ⚠️ 颜色取深褐而不是粉 —— 粉是单元 2 的词条（见文件头的串扰说明）。
    ⚠️ 48px 下约 3×2px，**承担识别功能**（鼠鼻的位置是「脸朝前」的锚点）。
  -->
  <ellipse cx="256" cy="314" rx="15" ry="11" fill="#8a5a44" />

  <!--
    嘴：一道 10px 的弧（§5.5：嘴允许 9–11px 描边）。
    ⚠️ 48px 下不足 1px ⇒ **≥180px 专属**，如实声明。
       它在 ≥180px 上的作用是让表情从「呆」变成「笑」。
  -->
  <path d="M 240 336 Q 256 350 272 336" fill="none" stroke="#5c5147" stroke-width="10" stroke-linecap="round" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **73.8%**，最小留白 **67.0px**，重心偏移 **8.0px**，重心 (256, 248)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 67.0px ≥30.72px；§5.3 的 8.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      身体 ✓（**主识别来源**：偏扁的圆）
      两只耳朵 ✓（**主识别来源**：相对身体的大小就是「鼠 vs 熊」的分界）
      内耳 ✓（把「圆饼」变成「耳朵」）
      眼睛 ✓（把「脸」变成「有表情的脸」）
      鼻子 ✓（脸朝前的锚点）
      嘴 ✗ —— **≥180px 专属**（48px 下不足 1px）
      胡须 —— **不画**（48px 下不存在，画了只会撑宽外接盒）
  -->
</svg>
