<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：kite（风筝）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面偏 3/4

  ⚠️ **为什么归 `geometric`**：风筝的骨架是**菱形 + 两根十字骨**，
     轮廓由直线段主导（只有四条边略带弧度）⇒ 与 `organic`（曲线主导）、
     `figure`（头身肢组合）都不沾。§5.1 的 `geometric` 成员全是器物，
     风筝与它们同属「规则几何形」这一族。

  ⚠️ **为什么四边不是直的，而是略带内凹的弧**：
     48px 下**正菱形读成「一块方糖 / 一个筹码」**，而内凹的边让轮廓读成
     「被风鼓起来的面」⇒ 这是**轮廓层**的识别点，不靠颜色。
     单元 1 的 `u1-three` 用的是同色方块（数词靠计数），
     本图不能重蹈「同色 ⇒ 只剩剪影」的覆辙。

  ⚠️ **四块红蓝配色刻意避开 `green` 与 `pink`** ——
     单元 2 里 `green` / `pink` 是**词条**（颜色词）。
     若风筝用绿色大色块，孩子看到「绿色」会去找 green 那张图 ⇒ **答案串扰**。
     红蓝与单元 1 的 `u1-red` / `u1-blue` 同族，但本单元没有这两个词条。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="风筝">
  <!--
    底：整块菱形，先铺满再由四块色面覆盖。
    ⚠️ 之所以拆成「底 + 四块色面 + 单独描边」三层：
       若给四块色面各自描边，内部会多出四道描边，48px 下糊成一团；
       只给外轮廓描一次边（见下），内部交界的清晰度交给**明度差**。
  -->
  <path d="M 256 88 C 302 134 348 186 376 236 C 348 286 302 338 256 384 C 210 338 164 286 136 236 C 164 186 210 134 256 88 Z"
        fill="#e63946" />

  <!--
    四块色面（棋盘式对角同色）：上右 + 下左 = 红，上左 + 下右 = 蓝。
    ⚠️ **对角同色而不是上下同色**：上下同色的话，风筝上窄下宽的梯形感会
       把轮廓读成「房子」；对角同色时四个色面里没有任何一个能与整体轮廓同形。
  -->
  <path d="M 256 88 C 302 134 348 186 376 236 L 256 236 Z" fill="#e63946" />
  <path d="M 136 236 C 164 186 210 134 256 88 L 256 236 Z" fill="#457b9d" />
  <path d="M 376 236 C 348 286 302 338 256 384 L 256 236 Z" fill="#457b9d" />
  <path d="M 256 384 C 210 338 164 286 136 236 L 256 236 Z" fill="#e63946" />

  <!--
    外轮廓：只描一次，14px（§5.5 的主轮廓区间 12–16px）。
    ⚠️ **描边写在元素自己身上**，不写在 <g> 上 ——
       实算脚本的半宽口径只认元素自身声明的 stroke（art-direction.md §5「已知偏差」），
       写到 <g> 上会让实算值偏小（偏小正是判绿的方向）。
  -->
  <path d="M 256 88 C 302 134 348 186 376 236 C 348 286 302 338 256 384 C 210 338 164 286 136 236 C 164 186 210 134 256 88 Z"
        fill="none" stroke="#8c1c2b" stroke-width="14" stroke-linejoin="round" />

  <!--
    十字骨：一竖一横，10px。
    ⚠️ 骨比外轮廓细（10 < 14）是刻意的：骨架在真实风筝上是**贴在面上**的，
       比包边细；48px 下骨只提供「这里有结构」的暗示，不承担识别。
  -->
  <path d="M 256 88 L 256 384" fill="none" stroke="#f4e3c1" stroke-width="10" stroke-linecap="round" />
  <path d="M 136 236 L 376 236" fill="none" stroke="#f4e3c1" stroke-width="10" stroke-linecap="round" />

  <!--
    尾绳：一段 10px 的波线，从风筝下角垂到 y=436。
    ⚠️ **48px 下尾绳不足 1px** —— 它是**≥180px 专属**的部件（见文件末的逐元素记账）。
       48px 下的识别完全由「菱形 + 内凹边 + 四块红蓝」承担。
       ⚠️ 尾绳**没有拖到画布底边**：拖到底会把主体占比顶出 60%–75% 的带，
       而 §5.2 要求四边各留 ≥6% 边长。
  -->
  <path d="M 256 384 C 270 400 242 414 256 436" fill="none" stroke="#8c1c2b"
        stroke-width="10" stroke-linecap="round" />

  <!--
    尾绳上的两个蝴蝶结：两个对顶的小三角（十字结的省略画法）。
    ⚠️ 同上 —— 48px 下每个结约 2px，**≥180px 专属**。
       它们的作用是让「这是风筝不是旗子」在 ≥180px 上成立。
  -->
  <path d="M 250 392 L 266 400 L 250 408 Z M 262 392 L 246 400 L 262 408 Z" fill="#f4d35e" />
  <path d="M 250 420 L 266 428 L 250 436 Z M 262 420 L 246 428 L 262 436 Z" fill="#f4d35e" />

  <!--
    外沿实算（加 14px 描边后）：x 129..383（254 宽）、y 81..441（360 高）
    ⇒ §5.1 主体占比 360/512 = 70.3%，落在 geometric 的 60%–75% 内；
      §5.2 四边最小留白 71px（下缘 436+5 = 441，余 71px），≥30.72px；
      §5.3 重心 (256, 261)，偏移 5px，≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      菱形轮廓 ✓（**唯一的识别来源**：内凹边让它读成「鼓起来的面」而不是方块）
      四块色面 ✓（明度差给出「面 / 骨」的结构）
      十字骨 ✗ —— **≥180px 专属**（48px 下不足 1px）
      尾绳 ✗ —— **≥180px 专属**
      蝴蝶结 ✗ —— **≥180px 专属**
  -->
</svg>
