<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：milk（牛奶）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：food    ← 食物档（§5.1：60%–80%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 64%、重心居中、正面

  ⚠️ **为什么归 `food`**：牛奶是食物，归 `food` 档（60%–80%）。

  ⚠️ **为什么画「纸盒」而不是「一杯奶」**：牛奶杯的轮廓和 `egg` 的米白球、
     `bread` 的米白面包芯都是「浅色块」，48px 上会互相糊。
     纸盒的**梯形山墙 + 平顶封口脊**是牛奶独有的剪影。

  ⚠️ **v1 / v2 都读成「帐篷」或「房子」—— 这一版改了什么**
     （2026-10-23，48px/180px 栅格化复核）：
     v1 是「米灰色屋顶压在白色盒身上」⇒ 读成**一间带瓦顶的屋子**；
     v2 改成同色屋顶 + 山墙正中一条竖缝 + 顶部小鳍 ⇒ 读成**一顶帐篷**
     （竖缝成了帐篷的中柱，鳍成了帐篷的支杆）。
     v3 换思路：**把尖顶改成平顶**。
     ① **山墙顶从三角形改成梯形**（左右各留 50px 的斜面，中间是 156px 的平顶）——
        帐篷的顶是**尖的**，纸盒的顶是**平的**（封口脊所在）。
     ② **封口脊改成横跨整个平顶的宽脊**（178–334）——
        窄脊（v2 的 26px 小鳍）会读成烟囱，宽脊才读成「压合封口」。
     ③ **删掉山墙正中的竖缝** —— 那条线是 v2 帐篷读法的主要来源。

  ⚠️ **整体比「高」比「宽」**：牛奶纸盒是竖长方体（268 宽 × 327 高），
     房子是横宽的；这一条单独就能把两者分开。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="牛奶">
  <!--
    盒身：一个竖长的纸盒正面。
    ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
    ⚠️ 盒身用**米白**：牛奶是白的；深色盒身会读成「一个礼品盒」。
  -->
  <rect x="128" y="238" width="256" height="190" rx="6"
        fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" />

  <!--
    山墙顶：左右各一段斜面 + 中间一段平顶的**梯形**（不是三角形）。
    ⚠️ **梯形是这一版的关键**：三角形顶 = 帐篷 / 房子；平顶 = 纸盒。
    ⚠️ 与盒身**同色**（米白）：v1 用了米灰屋顶，180px 上直接读成「一间带瓦顶的屋子」。
       同色之后，斜面只是「折痕」，不是「另一种材料」。
    ⚠️ 描边 12px、圆角接缝 —— 与盒身同粗，才看得出是同一个纸盒折出来的。
  -->
  <path d="M 128 238 L 178 140 L 334 140 L 384 238 Z"
        fill="#f7f3e8" stroke="#3f2b21" stroke-width="12" stroke-linejoin="round" />

  <!--
    封口脊：横跨平顶的一条宽脊（利乐包装压合出来的那道封口）。
    ⚠️ **与平顶等宽**（178–334）—— 窄脊会读成烟囱 / 帐篷支杆。
    ⚠️ 与盒身同色，**只靠轮廓线存在** —— 异色会又变成「另一种材料」。
    ⚠️ 48px 下约 1.9px ⇒ §5.5b 记为 **≥180px 专属**。
  -->
  <rect x="178" y="112" width="156" height="30" rx="10"
        fill="#f7f3e8" stroke="#3f2b21" stroke-width="10" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **63.9%**，最小留白 **78.0px**，重心偏移 **14.5px**，重心 (256, 271)
    ⇒ §5.1 落在 food 的 60%–80% 内；§5.2 的 78.0px ≥30.72px；§5.3 的 14.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      盒身 ✓（**主识别来源**：竖长方体 = 包装盒）
      梯形山墙 ✓（**第二识别来源**：平顶 + 两段斜面 = 折出来的纸盒顶）
      封口脊 ✗ —— **≥180px 专属**
  -->
</svg>
