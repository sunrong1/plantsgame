<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：frog（青蛙）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 79%、重心居中、**正面**

  ⚠️ **为什么归 `organic`**：青蛙是具象动物，轮廓由曲线主导，与 `organic` 档同族。

  ⚠️ **⚠️ 青蛙是绿的，而 `green` 是本单元的颜色词**：
     ⇒ 青蛙用**偏黄的绿** #8ac640，色卡 `green` 用**偏深的绿** #3fa34d；
     两者明度与饱和度都差得开。
     ⚠️ 形状上更是分得很开：色卡是一个**圆角三角形**的平面色块，
     青蛙是一个**宽而扁、两只眼睛鼓在头顶**的侧对称兽。
     ⚠️ 这一条要进 §5.4 的视角一致台账复核（Story 3.5）。

  ⚠️ **青蛙是这一批里唯一的「正面」画法**：
     青蛙正面看才是「两只眼睛鼓在头顶」的那副样子，
     侧身看会读成一只趴着的蜥蜴。
     ⚠️ 本单元的 `u2-mouse` 也是正面；单元 1 的 `u1-panda` 同样是正面坐姿
     ⇒ 正面画法在本项目里是被接受的一种（见 §5.4 视角一致台账）。

  ⚠️ **两条主线**：**两只鼓在头顶的大眼睛 + 一条横贯的大嘴线**。
     这两条在 48px 上都还在（眼睛是两块浅色圆 + 深色瞳，嘴是一条粗弧）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="青蛙">
  <!--
    ⚠️ 整组上移 20px：初版的外接盒中心落在 y=286，
       距 §5.3 的 30.72px 上限只剩 0.7px 余量（实测 30.0px）——
       那种余量不算通过。上移 20px 后余量变成 20px，
       且下缘仍留 84px、横向仍留 58.6px，§5.2 不受影响。
    ⚠️ 这个 <g> **只带 translate，不带 stroke** ——
       实算只认元素自身声明的 stroke，描边写在元素上（每一条都写了）。
  -->
  <g transform="translate(0 -20)">
  <!--
    后腿：两侧各一条向外撇的粗腿（旋转的圆角矩形）。
    ⚠️ **青蛙是「蹲」着的**：后腿往外撇、前腿直立，
       这个剪影和四足兽完全不同。
    ⚠️ 实算脚本支持 rotate（只实现 translate / rotate，见脚本 Matrix 的注释）。
  -->
  <rect x="70" y="330" width="128" height="54" rx="27" fill="#7ab436" stroke="#3f6b18" stroke-width="12"
        transform="rotate(-20 134 357)" />
  <rect x="314" y="330" width="128" height="54" rx="27" fill="#7ab436" stroke="#3f6b18" stroke-width="12"
        transform="rotate(20 378 357)" />

  <!--
    身体：一个宽而扁的椭圆（青蛙的身子横向摊开）。
  -->
  <ellipse cx="256" cy="300" rx="140" ry="88" fill="#8ac640" stroke="#3f6b18" stroke-width="12" />

  <!--
    前腿：两条直立的短腿，落在身体前面。
  -->
  <rect x="152" y="356" width="48" height="86" rx="23" fill="#8ac640" stroke="#3f6b18" stroke-width="12" />
  <rect x="312" y="356" width="48" height="86" rx="23" fill="#8ac640" stroke="#3f6b18" stroke-width="12" />

  <!--
    肚皮：身体下半部一块**更浅的黄绿**。
    ⚠️ 这一块是青蛙的标志（白肚皮），也让正面朝向变得明确。
  -->
  <ellipse cx="256" cy="336" rx="84" ry="46" fill="#d6eb9c" />

  <!--
    头：画在身体之上，和身体**没有脖子**地连在一起（青蛙的头是直接长在身上的）。
    ⚠️ 头比身体窄，但**不能画成圆形**（圆头读成青蛙玩偶/外星人）。
  -->
  <ellipse cx="256" cy="236" rx="112" ry="72" fill="#8ac640" stroke="#3f6b18" stroke-width="12" />

  <!--
    眼睛：两只**鼓在头顶的大圆眼**（浅色的眼窝 + 深色的瞳）。
    ⚠️ **这是青蛙的第一识别线索** —— 眼睛长在头顶上方，不是脸的两侧。
    ⚠️ 眼窝画成比身体浅的一档（#b8e06a），深浅对比在 48px 上才有「凸出来」的感觉。
  -->
  <circle cx="194" cy="168" r="38" fill="#b8e06a" stroke="#3f6b18" stroke-width="12" />
  <circle cx="318" cy="168" r="38" fill="#b8e06a" stroke="#3f6b18" stroke-width="12" />
  <circle cx="194" cy="170" r="17" fill="#2b2b2b" />
  <circle cx="318" cy="170" r="17" fill="#2b2b2b" />
  <circle cx="188" cy="164" r="6" fill="#ffffff" />
  <circle cx="312" cy="164" r="6" fill="#ffffff" />

  <!--
    嘴：一条横贯脸的大弧线。
    ⚠️ **画成向上弯的弧（嘴角更高）**，不是一条直线 ——
       直线读成「一道划痕」，弧线才读成「一张大嘴」。
  -->
  <path d="M 176 254 Q 256 300 336 254" fill="none" stroke="#3f6b18" stroke-width="13"
        stroke-linecap="round" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **77.1%**，最小留白 **58.6px**，重心偏移 **10.0px**，重心 (256, 266)
    ⇒ §5.1 落在 organic 的 70%–85% 内；§5.2 的 58.6px ≥30.72px；§5.3 的 10.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      两只鼓在头顶的大眼睛 ✓（**主识别来源**：眼睛的位置就是线索）
      宽扁的身子 + 外撇的后腿 ✓（**剪影**：蹲着的兽，不是四足兽）
      大嘴弧线 ✓（**第二识别来源**）
      浅色肚皮 ✓（**第三识别来源**：正面朝向）
      眼瞳与高光 ✗ —— **≥180px 专属**
  -->
</svg>
