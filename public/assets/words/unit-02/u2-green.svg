<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：green（绿色）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面

  ⚠️ **为什么是「一块绿色色卡」，不是绿色的什么**：
     同 u1-blue / u1-red / u1-yellow 的口径：颜色的通用符号是**色卡本身**，
     不是「绿色的某个东西」。画一片绿叶子 = leaf + green 两个答案同时在场，比画错还糟。

  ⚠️ **形状为什么是「圆角三角」**：
     单元 1 的三张颜色词已经用了 **心 / 方 / 星** 三种形状；
     单元 2 的 `pink` 用**圆角六边形**。
     ⇒ `green` 用**圆角三角形**，三种语言（心/方/星、三角、六边形）互不重叠，
     灰度档下三张也都认得出。
     ⚠️ 三角形还和本单元的 `kite`（菱形）、`sun`（圆盘 + 光芒）、
       `four`（方块组）都不同形。

  ⚠️ **⚠️ 颜色必须比 `u2-frog` 深**：青蛙是**偏黄的绿** #8ac640，
     本色卡用**偏深的绿** #3fa34d ⇒ 明度与饱和度都差得开。
     形状上更是分得很开（平面三角形 vs 宽扁的蹲姿兽）。
     ⚠️ 这一条要进 §5.4 的视角一致台账复核（Story 3.5）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="绿色色卡">
  <!--
    色卡主体：一枚**圆角三角形**，平面、无厚度。
    ⚠️ 三个角都用二次曲线收圆（Q + 顶点作控制点）——
       直角三角会读成「一个几何图形 / 播放按钮」，圆角才读成「一块料子」。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <path d="M 270.9 103.2 L 414.1 363.8 Q 429 391 398 391 L 114 391 Q 83 391 97.9 363.8
           L 241.1 103.2 Q 256 76 270.9 103.2 Z"
        fill="#3fa34d" stroke="#2a6b32" stroke-width="14" stroke-linejoin="round" />

  <!--
    内侧一圈更深的描边：给色卡「有一圈边框」的结构。
    ⚠️ 这一圈不是装饰 —— 它让这张图在 48px 下有一个**内部的三角轮廓**，
       而 `u2-kite` 内部有交叉的骨架、`u2-four` 内部是并列的方块。
       内部轮廓的形状是区分的关键（与 u1-blue 同一条道理）。
    ⚠️ **不填高光**：u1-blue 第一版压过一道斜高光，栅格化后整张读成「手机屏幕」
       （高光 + 内框 = 玻璃面板）。⇒ 只留内框。
  -->
  <path d="M 266 132 L 386 352 L 126 352 Z" fill="none" stroke="#2a6b32" stroke-width="10"
        stroke-linejoin="round" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **66.4%**，最小留白 **82.6px**，重心偏移 **15.7px**，重心 (256, 240)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 82.6px ≥30.72px；§5.3 的 15.7px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      圆角三角形色块 ✓（**主识别来源**：一块深绿的料子）
      内侧三角轮廓 ✓（**第二识别来源**：内部的三角 = 平面色卡，不是别的实物）
  -->
</svg>
