<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：drum（鼓）—— **单元 2 的内容**（Story 2.5）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric    ← 几何体档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、略俯视

  ⚠️ **为什么归 `geometric`**：鼓身是**一段圆柱**（上下两个正圆面 + 一条直的侧壁），
     §5.1 的 `geometric` 判据明写「盒体 / 圆柱 / 笔杆本质是几何体」。

  ⚠️ **v1 被判为「锅」—— 这一版改了什么**（2026-10-23，48px/180px 栅格化复核）：
     v1 的鼓身矮胖（312 宽 × 210 高）＋ 一根平放在鼓面上的鼓槌，
     180px 上整张读成「一口带盖的锅」。三处改法：
     ① **鼓槌改成斜插在鼓面里、一头带圆珠探出鼓沿**（不是平放在面上）——
        平放的一根会读成「锅盖的把手」，斜插带珠才是「鼓槌」。
     ② **鼓身两侧加张力螺杆**（两根深色竖条）—— 锅没有这个。
     ③ **鼓面保持米白色**（不是锅口的深色内腔）—— 白鼓皮是鼓的关键线索。

  ⚠️ **为什么用青绿色**：单元 2 的两个颜色词是 `green` / `pink`，
     `green` 是**大片出现就危险**的那个 ⇒ 鼓身**不用绿**，
     改用偏蓝的青绿 #2a9d8f（与 `green` 档那片叶子的草绿明度差得开）。
     ⚠️ 这一条要在 48px 台账里复核（见 Story 3.5）。

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鼓">
  <!--
    鼓身：一段圆柱的侧壁 —— 两条直边 + 底部的椭圆弧。
    ⚠️ 描边 14px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
  -->
  <path d="M 96 180 L 96 320 C 96 372 168 408 256 408 C 344 408 416 372 416 320 L 416 180 Z"
        fill="#2a9d8f" stroke="#1b6b61" stroke-width="14" stroke-linejoin="round" />

  <!--
    鼓面：cx 256 / cy 180 / rx 160 / ry 58 的米白色椭圆。
    ⚠️ **鼓面画在鼓身之后**（即叠在上面）：鼓面是鼓的**顶**，
       画在身子上层才有「上口」的层次；反过来会读成「一个盘子扣在桶上」。
    ⚠️ **米白色不是深色**：锅口看见的是**深色的内腔**，鼓面是**一整张白皮**。
       这一条是把 v1 从「锅」救回来的关键。
    ⚠️ 椭圆**压扁**（ry 只有 rx 的 1/3 不到）：正圆鼓面读成「一个球」，
       压扁的椭圆才有「从斜上方看下去」的透视。
  -->
  <ellipse cx="256" cy="180" rx="160" ry="58" fill="#f7f3e8" stroke="#3f2b21" stroke-width="14" />

  <!--
    张力螺杆：鼓身正面两根深色竖条（圆角矩形）。
    ⚠️ **这是「鼓」与「锅」最硬的一条区别线索** —— 锅身是光的，鼓身有张力杆。
    ⚠️ 竖条只到 y=340，不到底：鼓身底部是圆的，螺杆不会插到最下面。
    ⚠️ 48px 下每根约 1.4px ⇒ 它们是「加分项」，主识别仍靠鼓面 + 鼓槌；
       §5.5b 如实记为 **≥180px 专属**（在 180px 上它们是认得出「鼓」的关键）。
  -->
  <rect x="138" y="212" width="18" height="128" rx="9" fill="#1b6b61" />
  <rect x="356" y="212" width="18" height="128" rx="9" fill="#1b6b61" />

  <!--
    鼓槌：斜插在鼓面上的一根木棒（13px），左端探出鼓沿并带一个圆珠头（r=13）。
    ⚠️ **左端探出鼓沿**是关键：v1 那根平放在面上的短槌 180px 上读成「锅盖把手」；
       探出鼓沿 + 带珠头就明确是「一根鼓槌」。
    ⚠️ **48px 下整根槌不足 1.5px ⇒ ≥180px 专属**，如实声明。
  -->
  <path d="M 76 148 L 330 228" fill="none" stroke="#8a5a44" stroke-width="13" stroke-linecap="round" />
  <circle cx="76" cy="148" r="13" fill="#6b4a3a" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-02` 实测）：
      主体占比 **70.3%**，最小留白 **63.0px**，重心偏移 **13.0px**，重心 (243, 265)
    ⇒ §5.1 落在 geometric 的 60%–75% 内；§5.2 的 63.0px ≥30.72px；§5.3 的 13.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      鼓面 ✓（**主识别来源**：一整张米白的圆皮）
      鼓身 ✓（**第二识别来源**：圆柱）
      张力螺杆 ✗ —— **≥180px 专属**（180px 上是「鼓 ≠ 锅」的关键）
      鼓槌 + 珠头 ✗ —— **≥180px 专属**
  -->
</svg>
