<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：draw（画）—— 单元 4 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 79.5%、重心略偏左

  G10：不得含 text / image /foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么是「纸 + 笔」而不是「画本身」**：画出来的内容（房子 / 人）会被
     读成那个东西，而不是「画」这个动作 ⇒ 必须画**正在画**这件事：
     一张纸 + 一支正在纸上画的笔。

  ⚠️ **为什么纸上有几条彩色短线**：一张空纸读成「白板」；
     纸上的几笔彩色线条让「在画」成立，而它们**不是**任何具体图案
     （不画房子、不画太阳）⇒ 不会把答案引到别处。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="画画的人">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!-- 头。 -->
    <circle cx="256" cy="110" r="56" fill="#f6d7b0" stroke-width="12" />

    <!-- 头发：盖住头的上半。 -->
    <path d="M 200 110 A 56 56 0 0 1 312 110 Z" fill="#3a2a22" stroke="none" />

    <!-- 身体：绿色上衣。 -->
    <rect x="200" y="166" width="112" height="150" rx="42" fill="#43a047" stroke-width="12" />

    <!-- 两条腿站直。 -->
    <path d="M 226 308 L 214 444" fill="none" stroke-width="22" />
    <path d="M 288 308 L 300 444" fill="none" stroke-width="22" />

    <!-- 一只手托着纸，另一只手握笔。 -->
    <path d="M 208 196 L 152 300" fill="none" stroke-width="22" />
    <path d="M 304 196 L 344 244" fill="none" stroke-width="22" />

    <!-- 纸：一张白纸（略微倾斜 ⇒ 用四边形而不是矩形）。 -->
    <path d="M 132 286 L 330 262 L 344 396 L 146 420 Z" fill="#ffffff" stroke-width="12" />

    <!-- 纸上的几笔彩色线条（不画具体图案）。 -->
    <path d="M 168 330 L 236 318" fill="none" stroke-width="10" stroke="#e53935" />
    <path d="M 176 366 L 250 352" fill="none" stroke-width="10" stroke="#1e88e5" />

    <!-- 铅笔：笔杆 + 笔尖（正在纸上画）。 -->
    <path d="M 316 250 L 268 316" fill="none" stroke-width="16" stroke="#fdd835" />
    <path d="M 268 316 L 258 334" fill="none" stroke-width="10" stroke="#2a2a4a" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-04` 实测）：
      主体占比 **79.5%**，最小留白 **48.0px**，重心偏移 **15.5px**，重心 (241, 252)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 48.0px ≥30.72px；§5.3 的 15.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      纸 ✓（**主识别来源**：一块白 + 两条彩色笔迹）
      铅笔 ✓（**第二识别来源**：斜插在纸上的一根黄条）
      彩色的两笔 ✗ —— 48px 上是纹理（但没有它们纸就空了）⇒ 只加不减
      头发 ✗ —— 纯装饰
  -->
</svg>
