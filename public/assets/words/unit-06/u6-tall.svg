<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：tall（高的）—— 单元 6 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 81%、重心偏上、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **「高」在 48px 上靠头身比，不靠把整个人拉长**：画布是固定的，
     把人拉长 = 主体占比涨到 85% 以上（§5.1 判红）⇒
     正确做法是**小头 + 很长的腿**：
       本图  ＝ 头 r=46 / 腿 150px
       `u6-short` ＝ 头 r=76 / 腿 105px
     两张并排时，头的大小差是 48px 上最清楚的信号。

  ⚠️ **为什么躯干是窄的**：高的人本来就瘦；但**窄不是本图的识别来源**
     （那是 `u6-thin` 的）⇒ 本图的识别来源只算「小头 + 长腿」。

  ⚠️ **重心偏上是正常的**：腿长 ⇒ 重心在中线以下、bbox 中心偏上，
     实测偏移 10.5px 仍在 §5.3 的 30.72px 容差内。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="高的人">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!-- 头：小头（**本图的识别来源之一**）。 -->
    <circle cx="256" cy="90" r="46" fill="#f6d7b0" stroke-width="12" />

    <!-- 头发：盖住头的上半。 -->
    <path d="M 210 90 A 46 46 0 0 1 302 90 Z" fill="#3a2a22" stroke="none" />

    <!-- 躯干。 -->
    <rect x="210" y="146" width="92" height="150" rx="36" fill="#5c6bc0" stroke-width="12" />

    <!-- 两条长手臂。 -->
    <path d="M 214 172 L 190 320" fill="none" stroke-width="20" />
    <path d="M 298 172 L 322 320" fill="none" stroke-width="20" />

    <!-- 两条长腿（**本图的识别来源之二**）。 -->
    <path d="M 230 288 L 218 442" fill="none" stroke-width="22" />
    <path d="M 282 288 L 294 442" fill="none" stroke-width="22" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-06` 实测）：
      主体占比 **81.1%**，最小留白 **38.0px**，重心偏移 **10.5px**，重心 (256, 246)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 38.0px ≥30.72px；§5.3 的 10.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      小头 ✓（**主识别来源**：与 `u6-short` 的大头对照）
      长腿 ✓（**第二识别来源**：腿占身高的比例）
      手臂 ✗ —— 通用人形 ⇒ 只加不减
  -->
</svg>
