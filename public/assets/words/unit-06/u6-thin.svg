<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：thin（瘦的）—— 单元 6 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 77%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **「瘦」在 48px 上是宽度**：躯干画成细长的窄矩形（76px 宽，
     而 `u6-fat` 的肚子是 192px 宽）⇒ 两张并排时宽度差一眼可见。

  ⚠️ **头是正常大小、腿是正常长度**：本图与 `u6-tall` 的差别**只在头的大小**
     （瘦 = 正常头， 高 = 小头）⇒ 这样「瘦」与「高」不会互相顶替。
     换句话说：瘦说的是**横**、高说的是**纵**。

  ⚠️ **为什么手臂贴得很近**：瘦人的胳膊也细，两条手臂离身体只有 16px，
     在 48px 上整体读成「一根窄条」⇒ 这是瘦的第二道信号。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="瘦的人">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!-- 头：正常大小。 -->
    <circle cx="256" cy="110" r="52" fill="#f6d7b0" stroke-width="12" />

    <!-- 头发：盖住头的上半。 -->
    <path d="M 204 110 A 52 52 0 0 1 308 110 Z" fill="#3a2a22" stroke="none" />

    <!-- 窄躯干：细长矩形（**本图的识别来源**）。 -->
    <rect x="218" y="172" width="76" height="150" rx="34" fill="#26a69a" stroke-width="12" />

    <!-- 两条手臂贴在身侧。 -->
    <path d="M 222 196 L 204 300" fill="none" stroke-width="20" />
    <path d="M 290 196 L 308 300" fill="none" stroke-width="20" />

    <!-- 两条腿（长度正常）。 -->
    <path d="M 232 312 L 224 436" fill="none" stroke-width="22" />
    <path d="M 280 312 L 288 436" fill="none" stroke-width="22" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-06` 实测）：
      主体占比 **77.1%**，最小留白 **52.0px**，重心偏移 **6.5px**，重心 (256, 250)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 52.0px ≥30.72px；§5.3 的 6.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      窄躯干 ✓（**主识别来源**：整体读成一根窄条）
      贴身的双臂 ✓（**第二识别来源**：把轮廓收窄）
      正常大小的头 ✓（与 `u6-tall` 的小头分开）
  -->
</svg>
