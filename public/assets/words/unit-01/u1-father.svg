<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：father（爸爸）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、双手叉腰、主体占画布约 78%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ 爸爸与老师最容易撞，因为**两者的手臂都在躯干之外**。分界靠下面 5 处。
     ⚠️ **写作过程中有一条判据被实测算成是假的，已改判，记在这里别再抄回去**：
     原先写的是「叉腰会在手臂与躯干之间留下**两块三角形的空当**，
     48px 灰度下这两块空当就是爸爸的签名」。
     栅格化之后**根本没有空当** —— 叉腰的上手臂从肩点斜着往外下方走，
     而肩点本来就在躯干边缘上，算下来手臂内缘与躯干边缘只差 10px，
     折算到 48px 不到 1 个像素；前臂又整条收回躯干里面。
     ⇒ 叉腰这个**姿势**保留（它确实是「爸爸」的读法），
       但它**不能承担剪影分工**。真正在 48px 灰度上分开的是这五条：

  ① **胡子**：下半张脸一整块深色。灰度档下唯一还认得出的脸部信息 ——
     眼睛、嘴、眼镜在 48px 上都没了，胡子那块还在。
  ② **肩线是水平的直角**，老师的肩是从脖子向两侧塌下去的圆弧。
     ⚠️ 这里也踩过一个想当然：**肩宽不是分界** —— 爸爸的肩 196px、
     老师的肩 192px，只差 4px，48px 上分不出来。起作用的是**形状**不是**尺寸**。
  ③ **两只手是压在腰上的两个浅色圆**（叉腰的必然结果）。
  ④ **腰上一道深色皮带**，灰度档下把衣身断开成上下两截。
  ⑤ **爸爸的侧影是一整块实心的宽梯形**，从头到脚没有任何浅色块打断它；
     老师的侧影在腰前被**一块摊开的浅色书**打断。
     ⇒ 这一条是父子之间最强的分界：不是「有没有」，而是「有没有东西插在腰上」。
  ⚠️ 头要**相对身体画小**（r=58 对躯干宽 196，接近 1:3.4）。
     头身比一大就变成小孩 —— 爸爸与学生的差别全在这个比例上。
  ⚠️ 叉腰的手臂**不许加粗到把空当填掉**。这里用 36px，
     肘到腰的横向跨度必须大于臂宽，否则两块空当在 48px 上被糊掉。
  ⚠️ 皮带是第三重保险：腰上一道深色横带，在灰度档下与衣身分开。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="爸爸">

  <g stroke="#2f2a26" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!-- 腿与鞋：落点齐平（§5 模板的「落地线」）。 -->
    <rect x="206" y="374" width="52" height="70" rx="24" fill="#4a4f5e" />
    <rect x="258" y="374" width="52" height="70" rx="24" fill="#414655" />
    <ellipse cx="232" cy="444" rx="38" ry="17" fill="#2b313b" />
    <ellipse cx="284" cy="444" rx="38" ry="17" fill="#2b313b" />

    <!--
      上身：**肩线接近水平直角**，是本图与老师的第一处分界。
      ⚠️ 圆弧肩（老师的画法）会读成「一个穿蓝衣服的人」；
         直角肩 + 更宽的肩幅才读成大人。
    -->
    <path d="M 158 252 Q 158 220 256 220 Q 354 220 354 252 L 344 372 Q 336 388 256 388
             Q 176 388 168 372 Z" fill="#a06a3c" />

    <!-- 门襟：一条浅色的竖线，交代「开襟外套」而不是一块色块。 -->
    <path d="M 256 226 L 256 380" fill="none" stroke="#c98f5c" stroke-width="11" />

    <!-- 皮带：腰上一道深色横带（灰度档下的第三重保险）。 -->
    <rect x="188" y="344" width="136" height="28" rx="6" fill="#5d4126" />
    <rect x="242" y="340" width="28" height="36" rx="6" fill="#c9a227" />

    <!-- 脖子 -->
    <rect x="238" y="184" width="36" height="44" rx="14" fill="#e0b088" />

    <!-- 头发：矮、宽、压在头顶上 —— 「短平头」在侧影上就是「头顶没有隆起」。 -->
    <ellipse cx="256" cy="106" rx="62" ry="30" fill="#4a3524" />

    <!-- 头：比身体小一号的圆（头身比是「大人」的第二个关键）。 -->
    <circle cx="256" cy="142" r="58" fill="#e8bd97" />

    <!--
      胡子：下半张脸一整块深色，外加一道八字胡。
      ⚠️ 沿用 1.8 老师的判据：头发的下缘必须在眼睛之上 ——
         发 136 / 眼 146，只差 10px；胡子则从 156 起，在眼睛**下面**。
         两块深色上下分开，中间留出一条脸的浅色带，这是 48px 上唯一读得出的结构。
    -->
    <path d="M 232 158 Q 256 150 280 158 Q 256 168 232 158 Z" fill="#4a3524" stroke="none" />
    <path d="M 202 156 Q 256 178 310 156 Q 306 206 256 208 Q 206 206 202 156 Z"
          fill="#4a3524" stroke-width="12" />
  </g>

  <!--
    叉腰的双臂：肘在外、手回到腰。
    ⚠️ 先描一道更粗的深色再描浅色，是为了给这根粗笔画一个 6px 的轮廓 ——
       手臂与躯干同色，没有这道轮廓在 48px 上会糊成一片（见文件头第 ③ 条）。
    ⚠️ 不要指望这两条手臂与躯干之间会「露出空当」：文件头记了，算下来不成立。
  -->
  <g fill="none" stroke="#2f2a26" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 178 254 Q 138 302 148 336 Q 158 360 202 356" />
    <path d="M 334 254 Q 374 302 364 336 Q 354 360 310 356" />
  </g>
  <g fill="none" stroke="#a06a3c" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 178 254 Q 138 302 148 336 Q 158 360 202 356" />
    <path d="M 334 254 Q 374 302 364 336 Q 354 360 310 356" />
  </g>
  <!-- 手：明确的一只，压在腰上。 -->
  <circle cx="204" cy="352" r="21" fill="#e8bd97" stroke="#2f2a26" stroke-width="10" />
  <circle cx="308" cy="352" r="21" fill="#e8bd97" stroke="#2f2a26" stroke-width="10" />

  <!-- 五官：实心不描边。眉毛是本图唯一允许的额外线条，加粗到能扛住 48px。 -->
  <rect x="216" y="132" width="32" height="11" rx="5" fill="#4a3524" />
  <rect x="264" y="132" width="32" height="11" rx="5" fill="#4a3524" />
  <circle cx="232" cy="152" r="11" fill="#2f2a26" />
  <circle cx="280" cy="152" r="11" fill="#2f2a26" />
</svg>
