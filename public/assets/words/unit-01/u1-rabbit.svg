<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：rabbit（兔子）—— Story 1.9 第一批，**有机曲线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：坐姿 3/4 侧朝右、主体占画布约 80%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据：
  ⚠️ 兔与猫的分界在**耳朵的长度**：猫耳是「立在头顶的两个短尖」，
     兔耳是「从头顶长出去的两根长条」。耳朵画短了就变成猫，
     画成两根一样直的对称长条又会读成「一个竖着天线的人」。
     ⇒ 这里让两耳**一长一短、且都向外撇**（左耳长、右耳短并更立），
     不对称是兔耳与「天线」的分界。
  ⚠️ 后腿是兔子剪影上**最大的一块** —— 它必须比身体还宽出一截并向外伸，
     缩进身体里的话整只兔子读成一颗带耳朵的蛋。
  ⚠️ 尾巴是**一个小圆球**，不是猫那样甩出去的外弯曲线。尾巴画粗了外弯，
     剪影立刻与猫重合（同批两张图的唯一剪影分工就断了）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="兔子">
  <g stroke="#5d4a3c" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!--
      后腿：从身体向左下伸出的那一大坨 —— 兔子剪影上最大的单块。
      ⚠️ 必须**在躯干轮廓之外露出足够长的一段**，否则 48px 上读成蛋。
    -->
    <ellipse cx="188" cy="382" rx="104" ry="76" fill="#d8c8b6" />

    <!-- 后脚：一条向前伸的长脚掌，与后腿同色但描边分界。 -->
    <ellipse cx="146" cy="440" rx="76" ry="32" fill="#f2e8dc" />

    <!-- 躯干：上小下大的梨形，坐姿的重心压在后腿。 -->
    <ellipse cx="272" cy="344" rx="98" ry="88" fill="#f2e8dc" />

    <!--
      前爪：两只并拢的小手，落点齐平（§5 模板的「落地线」）。
      ⚠️ 比后腿细得多 —— 一旦同粗，整只兔子就散成一团。
    -->
    <ellipse cx="256" cy="428" rx="30" ry="24" fill="#f2e8dc" />
    <ellipse cx="302" cy="430" rx="27" ry="22" fill="#f2e8dc" />

    <!-- 尾巴：小圆球，紧贴后腿右上缘。 -->
    <circle cx="146" cy="330" r="34" fill="#ffffff" />

    <!--
      耳朵：一长一短、且都向外撇。
      ⚠️ 两根等长、对称、笔直的长条 = 「一个竖着天线的人」——
         不对称（长度差 + 倾角差）是兔子与那个读法的唯一分界。
    -->
    <ellipse cx="248" cy="118" rx="27" ry="70" fill="#f2e8dc" transform="rotate(-14 248 118)" />
    <ellipse cx="344" cy="112" rx="25" ry="62" fill="#f2e8dc" transform="rotate(12 344 112)" />

    <!-- 耳内：粉色，不描边。 -->
    <ellipse cx="248" cy="122" rx="13" ry="50" fill="#e8b4ae" stroke="none" transform="rotate(-14 248 122)" />
    <ellipse cx="344" cy="116" rx="12" ry="43" fill="#e8b4ae" stroke="none" transform="rotate(12 344 116)" />

    <!-- 头：比躯干小一圈。 -->
    <circle cx="296" cy="216" r="70" fill="#f2e8dc" />

    <!-- 口鼻：短而钝，向右突出一小块。⚠️ 拉长会读成鸟喙。 -->
    <ellipse cx="352" cy="236" rx="26" ry="21" fill="#ffffff" stroke-width="12" />
  </g>

  <!-- 五官：实心不描边。 -->
  <ellipse cx="326" cy="206" rx="14" ry="17" fill="#3b2a1d" />
  <ellipse cx="290" cy="204" rx="13" ry="16" fill="#3b2a1d" />
  <circle cx="330" cy="200" r="4.5" fill="#ffffff" />
  <circle cx="294" cy="198" r="4" fill="#ffffff" />

  <!-- 鼻头：小三角。 -->
  <path d="M 350 220 L 364 220 L 357 232 Z" fill="#d4707a" />

  <!-- 嘴：填实的两段短弧。48px 下纯描边弧线只剩 1px。 -->
  <path d="M 330 244 Q 342 256 354 244 Q 366 254 378 242"
        fill="none" stroke="#3b2a1d" stroke-width="9" stroke-linecap="round" />

  <!--
    门牙：兔子的第二分界。
    ⚠️ 必须**从嘴角往下露出来**并用实心色块，藏在嘴里的画法在 48px 上完全消失，
    而没有门牙的兔子与松鼠几乎无法区分。
  -->
  <rect x="340" y="258" width="34" height="22" rx="6" fill="#ffffff" stroke="#5d4a3c" stroke-width="9" />
  <path d="M 357 258 L 357 280" fill="none" stroke="#5d4a3c" stroke-width="9" />
</svg>
