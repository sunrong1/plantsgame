<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：desk（课桌）—— Story 1.9 第二批，**几何直线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面、略带上表面透视，主体占画布约 70%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（与同批 chair 的分工 —— 这两张都是「座具」，最容易撞）：
  ⚠️ 分界只有一条，但很硬：**课桌的上缘是一条横贯全宽的厚板，
     板子上面什么都没有**；椅子的上缘是一根**窄竖条（靠背）**。
     ⇒ 侧影上「顶上一条宽板」与「顶上一根窄条」是两种形状，
        48px 上不会混。
  ⚠️ 课桌**不许画椅子那种背靠**。加了靠背就与 chair 重合，
     而「课桌」这个词的通用画法本来就是一张只有台面和腿的桌子。
  ⚠️ 台面画成**两段（上面一块斜的四边形 + 前面一条厚板）**，
     才有「这是一个平面的桌面」的读法。
     只画一条横板就读成「一块搁板」。
  ⚠️ ⚠️ 本图重心天然偏下（长腿），偏移方向很容易凭感觉判断反。
     按「桌面在画布上半部」的直觉落笔的话，桌面大约在 y=130，
     实算 §5.3 偏移会到 46px（超出 ±30.7px）。
     ⇒ 落笔时就按算好的位置把整组顶到 y=84（**没有为此返工过**），
       这里的桌面位置是算出来的，不是画出来再修的。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="课桌">

  <g stroke="#5d4126" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!-- 抽屉：桌面下方、两条腿之间的一只方抽屉。 -->
    <rect x="176" y="172" width="160" height="58" rx="8" fill="#c9954f" />
    <rect x="232" y="192" width="48" height="12" rx="6" fill="#8a5f2c" stroke="none" />

    <!-- 桌腿：两条，前后各一对（只画前面一对，另一对由横枨交代）。 -->
    <rect x="132" y="160" width="32" height="258" fill="#a06a3c" />
    <rect x="348" y="160" width="32" height="258" fill="#a06a3c" />
    <!-- 横枨：两条腿之间的一根横杆，顺便交代「桌子有后腿」。 -->
    <rect x="164" y="330" width="184" height="18" fill="#8a5f2c" stroke="none" />

    <!-- 脚垫：腿底各一块加宽的板。 -->
    <rect x="120" y="404" width="56" height="24" rx="6" fill="#7a5028" />
    <rect x="336" y="404" width="56" height="24" rx="6" fill="#7a5028" />

    <!--
      台面：**上面一块斜的四边形 + 前面一条厚板**。
      ⚠️ 只画一条横板就读成「一块搁板」（见文件头）。
    -->
    <path d="M 136 84 L 376 84 L 406 126 L 106 126 Z" fill="#d9a86a" />
    <rect x="106" y="126" width="300" height="34" fill="#b8823f" />
  </g>
</svg>
