<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：yellow（黄色）—— Story 1.9 第二批，**颜色档**（抽象·通用符号）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面、上下对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么是黄星。**
     AC-11 定的口径：颜色词画**该颜色公认的通用符号**。黄色对应星（评分、优等生、
     「金星」）。若画一个黄色的太阳，那是 sun，且会激活「那是太阳还是星星」的歧义；
     画一根黄色铅笔，那是 pencil + yellow 两个答案同时在场。

  ⚠️ **与 u1-happy 的关系（本单元里最容易撞的一对，必须说清）。**
     u1-happy 是一张**带光芒的笑脸**，主色是奶油桃色（刻意避开明黄，
     见该图文件头「为什么底色不是明黄」）。
     两张的分界：**happy 的外轮廓是圆 + 光芒（向外发散），
     yellow 的外轮廓是尖角星（向内收）**。48px 上一眼可分。
     ⚠️ 因此**本图的五个角刻意画得很尖**（内外半径比 180:76 ≈ 2.4:1，
        比常见的五角星更「扎」），让剪影与 happy 的圆脸彻底分开。

  ⚠️ **与 u1-red / u1-blue 的分工在形状上，不在颜色上**：
     三张颜色词做成三种形状差别极大的符号（心 / 方 / 星），
     灰度档下三张都是同一个中灰明度，形状再接近就彻底认不出。

  ⚠️ **描边逐图元写在自身上** —— 实算脚本的半宽口径只认元素自己声明的 stroke。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="黄星">

  <!--
    五角星：外半径 180、内半径 76，一个尖朝上的正五角星。
    ⚠️ 十个顶点全部算出来写死，**不用 <polygon> 的 points 简写** ——
       因为实算脚本要读的就是这些数字，可读的十进制比「正多边形参数」更好核对。
    ⚠️ 内半径取 76（而不是常见的 ~110）是为了让五个角更尖、更扎 ——
       见文件头「与 u1-happy 的关系」。
  -->
  <path d="M 256 76
           L 300.7 194.5 L 427.2 200.4 L 328.3 279.5 L 361.8 401.6
           L 256 332 L 150.2 401.6 L 183.7 279.5 L 84.8 200.4 L 211.3 194.5 Z"
        fill="#f5c518" stroke="#b8860b" stroke-width="16" stroke-linejoin="round" />

  <!--
    ⚠️ 第一版在顶角上压过一块浅色高光，栅格化后**顶角被劈成两半**，
       整个星读成「一个尖上带缺口的东西」。48px 下那块高光不到 2px，
       承担不了任何识别功能 —— 按 §5.5b「48px 可读性地板」属噪声图层，v2 删掉。
  -->
</svg>
