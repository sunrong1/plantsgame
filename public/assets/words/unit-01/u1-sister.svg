<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：sister（姐姐）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、双手下垂、**短裙（膝盖以上）**、主体占画布约 78%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ 本图分三处，每一处都是**本批独有**的形状：
  ① **双马尾：头上两坨分离的圆团**，位置在**耳侧**（与头顶齐平，不高过头顶）。
     本批其余人物的头侧：妈妈是**连着垂到腰的长条**，
     哥哥是**一整条比头宽的横向帽檐**，学生 / 爸爸 / 老师是**紧贴头形的圆**。
     ⇒ 「两个分离的圆点」在本批是独一份。
     ⚠️ 两坨马尾的**下缘必须停在肩线之上**（214 对 228）。
        一路拖到肩膀就并进头发，48px 上整颗头读成「一个长头发的人」——
        那是妈妈，本图与她的唯一分界就没了。
  ② **泡泡袖：两个圆的肩**。侧影上肩膀位置各鼓起一个半圆。
     本批其余人物的肩是**梯形的直线边**（老师 / 学生 / 爸爸）
     或**一条水平直角**（爸爸）或**落在肩上的厚领**（哥哥）——
     没有任何一张的肩是圆的。
     ⚠️ 泡泡袖**必须鼓到肩线之外**（袖 r=40，肩线 194–318）。鼓不出去就只是两个圆点，
        48px 上完全消失，这一处分界就没了。
  ③ **短裙**：裙摆只到膝盖以上，**下面两条腿整段露出**。
     这是与妈妈的分界 —— 妈妈是及踝长裙，腿几乎看不见。
     ⚠️ 裙摆下缘必须**外张**（170–342），否则读成一条直筒裤。
  ⚠️ 与同批 friend 的分工（friend 的两人是并排的）：
     本图只有一颗头、两侧对称；friend 是两颗头错开高度。
     48px 下「一颗头 + 两侧两坨」与「两颗头」不会混。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="姐姐">

  <g stroke="#7a4520" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!-- 腿与鞋：落点齐平（§5 模板的「落地线」）。裙摆以下两条腿整段露出。 -->
    <rect x="216" y="378" width="42" height="70" rx="20" fill="#f0c9a4" />
    <rect x="254" y="378" width="42" height="70" rx="20" fill="#e8bd97" />
    <!-- 白袜：一道浅色，把腿和裙子分开。 -->
    <rect x="216" y="424" width="42" height="26" rx="10" fill="#ffffff" stroke="none" />
    <rect x="254" y="424" width="42" height="26" rx="10" fill="#ffffff" stroke="none" />
    <ellipse cx="237" cy="450" rx="32" ry="16" fill="#8f3d2f" />
    <ellipse cx="275" cy="450" rx="32" ry="16" fill="#8f3d2f" />

    <!-- 上身：肩宽腰窄。肩线是**直线**（泡泡袖另行加在两侧）。 -->
    <path d="M 194 252 Q 194 228 256 228 Q 318 228 318 252 L 310 322 Q 304 336 256 336
             Q 208 336 202 322 Z" fill="#ef6f5c" />

    <!-- 短裙：下缘**外张**，只到膝盖以上。 -->
    <path d="M 202 320 Q 256 332 310 320 L 342 386 Q 256 400 170 386 Z" fill="#d9564a" />

    <!-- 脖子 -->
    <rect x="240" y="196" width="32" height="34" rx="13" fill="#f0c9a4" />

    <!-- 头发（头顶那一层）：比脸宽、比脸上。 -->
    <ellipse cx="256" cy="118" rx="58" ry="38" fill="#c9743a" />

    <!-- 脸：比头发窄、后画，盖住发际线。 -->
    <circle cx="256" cy="152" r="54" fill="#f0c9a4" />

    <!-- 刘海：压到眉上。 -->
    <path d="M 208 130 Q 228 106 258 108 Q 288 110 306 136 Q 284 120 258 124
             Q 230 126 208 130 Z" fill="#c9743a" stroke="none" />

    <!--
      双马尾：**两坨圆团**，画在头的两侧。
      ⚠️ 两坨的**下缘（214）必须停在肩线（228）之上**，中间留出约 14px。
         一路拖到肩膀就并进头发，栅格化后整颗头读成「一个长头发的人」——
         那是妈妈，本图与她的唯一分界就没了。
         ⚠️ 两坨与头顶那层头发**必须有描边分开**（各 14px）：
            同色无描边会糊成一整片，同样读成长头发。
      ⚠️ 高度必须**齐耳**（cy 170），不许高过头顶 —— 高过就读成「两个天线」。
    -->
    <ellipse cx="172" cy="170" rx="36" ry="44" fill="#c9743a" transform="rotate(-12 172 170)" />
    <ellipse cx="340" cy="170" rx="36" ry="44" fill="#c9743a" transform="rotate(12 340 170)" />
    <!-- 发绳：两坨根部各一道粉色，是「扎起来」的交代。 -->
    <rect x="192" y="146" width="22" height="16" rx="7" fill="#e8506a" stroke="none"
          transform="rotate(-12 203 154)" />
    <rect x="298" y="146" width="22" height="16" rx="7" fill="#e8506a" stroke="none"
          transform="rotate(12 309 154)" />
  </g>

  <!--
    泡泡袖：**两个圆的肩**，鼓到肩线之外。
    ⚠️ r=40 对肩线 194–318 —— 袖子外缘 130 / 382，各鼓出 64px。
      鼓不出去就只是两个圆点，48px 上完全消失（见文件头 ②）。
  -->
  <circle cx="170" cy="268" r="40" fill="#ef6f5c" stroke="#7a4520" stroke-width="14" />
  <circle cx="342" cy="268" r="40" fill="#ef6f5c" stroke="#7a4520" stroke-width="14" />

  <!-- 领口：一道白色的 V + 一个浅色的领结。 -->
  <path d="M 228 232 L 256 254 L 284 232" fill="none" stroke="#ffffff" stroke-width="12" />
  <path d="M 256 254 L 236 268 L 256 278 Z" fill="#ffd94a" stroke="#7a4520" stroke-width="9" />
  <path d="M 256 254 L 276 268 L 256 278 Z" fill="#ffd94a" stroke="#7a4520" stroke-width="9" />

  <!-- 手臂：从泡泡袖下缘垂下，贴着躯干。肘不出轮廓。 -->
  <g fill="none" stroke="#ef6f5c" stroke-width="30" stroke-linecap="round">
    <path d="M 172 296 L 174 350" />
    <path d="M 340 296 L 338 350" />
  </g>
  <circle cx="174" cy="358" r="19" fill="#f0c9a4" stroke="#7a4520" stroke-width="10" />
  <circle cx="338" cy="358" r="19" fill="#f0c9a4" stroke="#7a4520" stroke-width="10" />

  <!-- 五官：实心不描边。 -->
  <circle cx="236" cy="162" r="11" fill="#3b2a1d" />
  <circle cx="276" cy="162" r="11" fill="#3b2a1d" />
  <circle cx="239" cy="158" r="4" fill="#ffffff" />
  <circle cx="279" cy="158" r="4" fill="#ffffff" />
  <!-- 微笑：一条短上弯线。 -->
  <path d="M 242 184 Q 256 196 270 184" fill="none" stroke="#8a5a3c" stroke-width="10"
        stroke-linecap="round" />
</svg>
