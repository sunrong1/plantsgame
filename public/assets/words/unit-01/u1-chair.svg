<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：chair（椅子）—— Story 1.9 第二批，**几何直线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面，主体占画布约 70%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（与同批 desk 的分工）：
  ⚠️ 分界在**最上面那一笔**：椅子的最上缘是**一根窄横杆**（宽约 176px），
     底下托着两根竖着的靠背柱；课桌的最上缘是**一块横贯全宽的厚板**（300px）。
     ⇒ 「窄杆 + 两根竖柱」与「宽板」在 48px 上是两种形状。
  ⚠️ 靠背与坐面之间必须**留出空当**（靠背底 260 / 坐面顶 252 之间有横档，
     但横档只占中间一小段，两侧是透空的）。
     靠背做成一块实心的板就与「课桌的厚台面」同构了。
  ⚠️ 四条腿要能数出来：两条靠背柱**一路落到地面**（它们兼作后腿），
     另加两条前腿。48px 上四条腿会并成两条，那没关系 ——
     椅子与课桌的分界不靠腿，靠顶上那一笔。
  ⚠️ ⚠️ 刻意**不加坐垫的颜色块与坐垫的圆角**：
     圆角一大，椅子顶上的窄杆就并进坐面，轮廓变成一块板，
     「椅背」这个唯一的分界就没了。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="椅子">
  <g stroke="#4a3428" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">

    <!--
      后腿（兼作靠背柱）：从最上面一直落到地面。
      ⚠️ 这两根柱子是「椅子」的骨架，画成两块实心板就与课桌的台面同构。
    -->
    <rect x="182" y="106" width="26" height="340" rx="10" fill="#a06a3c" />
    <rect x="304" y="106" width="26" height="340" rx="10" fill="#a06a3c" />

    <!-- 靠背的横档：只占中间一小段，两侧留空。 -->
    <rect x="182" y="168" width="148" height="22" fill="#8a5f2c" stroke="none" />

    <!-- 顶杆：本图在侧影上最上缘的那一笔，宽 176px —— 与课桌的 300px 厚板相对。 -->
    <rect x="168" y="100" width="176" height="30" rx="12" fill="#b8823f" />

    <!-- 前腿：比后腿靠外、只从坐面往下。 -->
    <rect x="146" y="268" width="28" height="178" rx="10" fill="#8a5f2c" />
    <rect x="338" y="268" width="28" height="178" rx="10" fill="#8a5f2c" />

    <!-- 坐面：薄薄的一块，角小。 -->
    <rect x="140" y="252" width="232" height="34" rx="12" fill="#c9954f" />
  </g>
</svg>
