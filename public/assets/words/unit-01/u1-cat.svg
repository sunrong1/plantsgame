<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：cat（猫）—— Story 1.9 第一批，**有机曲线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：坐姿 3/4 侧朝右、主体占画布约 75%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横（下面提到 token 名时刻意省掉前导的两条短横）。

  剪影判据（§5 模板 + 1.8 的教训）：
  ⚠️ 猫与狗的第一分界在**耳廓**。狗的耳朵是垂的（贴着脑袋两侧往下），
     猫的耳朵必须是**立在头顶上方的两个尖**。耳朵画成两片贴着头顶的椭圆时，
     栅格化到 48px 后会并进脑袋，整只猫立刻读成「一只没有耳朵的狗」。
  ⚠️ 尾巴必须**比后腿粗**且甩出一个明显的外弯 —— 贴着身体就成了一根小棍子
     （1.8 的狗第一版踩过）。
  ⚠️ 胸口**不许**有一大块奶白 —— 那是「衣服」的读法来源（1.8 的狗踩过，
     奶白一大块就变成一个穿围兜的小孩）。奶白只留在前爪与口鼻。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="猫">
  <g stroke="#6b3a17" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!--
      尾巴：从臀部甩向右下、再向上翘起的一根粗曲线。
      ⚠️ 粗到 34px 是故意的：48px 上后腿会被身体压住，尾巴不会。
    -->
    <path d="M 330 356 Q 420 384 414 292" fill="none" stroke-width="34" />

    <!-- 后腿 / 臀：坐在地上的一团圆，撑住整个剪影的左下角。 -->
    <ellipse cx="196" cy="342" rx="86" ry="82" fill="#e0a05f" />

    <!-- 躯干：比臀略高略窄，形成坐姿的斜坡。 -->
    <ellipse cx="286" cy="300" rx="92" ry="106" fill="#e8ac6b" />

    <!--
      前腿：两条并拢的竖柱。⚠️ 落点齐平（§5 模板的「落地线」），
      且**必须在躯干剪影之外露出足够长的一段** —— 全藏在身体里的话
      48px 上根本读不出「坐着」。
    -->
    <rect x="248" y="316" width="56" height="118" rx="26" fill="#f2c58e" />
    <rect x="310" y="320" width="52" height="112" rx="24" fill="#e8ac6b" />

    <!-- 前爪：两个圆头，把腿的方端收掉。 -->
    <ellipse cx="276" cy="428" rx="34" ry="22" fill="#f7e3c6" />
    <ellipse cx="336" cy="426" rx="31" ry="21" fill="#f7e3c6" />

    <!--
      耳朵：**两个立在头顶上方的尖**。这是猫与狗的第一分界。
      ⚠️ 画得矮而宽就并进脑袋；画成一个连成片的尖就成了一顶帽子（1.8 的狗第一版）。
    -->
    <path d="M 218 148 L 226 66 L 292 116 Z" fill="#e8ac6b" />
    <path d="M 336 116 L 372 62 L 384 156 Z" fill="#e8ac6b" />

    <!-- 头：略小于躯干，比例接近真实猫。 -->
    <circle cx="300" cy="168" r="76" fill="#e8ac6b" />

    <!--
      口鼻：短而钝的一小块，向右突出一点点。
      ⚠️ 拉长就成鸟喙（1.8 的狗第三版踩过）；完全不突出就成一张圆饼脸。
    -->
    <ellipse cx="360" cy="188" rx="30" ry="24" fill="#f7e3c6" stroke-width="12" />

    <!-- 耳内：一点浅色，让 48px 上的耳朵读得更尖。 -->
    <path d="M 240 140 L 244 92 L 280 122 Z" fill="#d9954f" stroke="none" />
    <path d="M 348 124 L 366 88 L 372 144 Z" fill="#d9954f" stroke="none" />
  </g>

  <!-- 五官：实心不描边。48px 下眼睛必须是一个纯色点，多一圈描边就糊了。 -->
  <ellipse cx="330" cy="158" rx="15" ry="19" fill="#3b2a1d" />
  <ellipse cx="292" cy="156" rx="14" ry="18" fill="#3b2a1d" />
  <circle cx="335" cy="151" r="5" fill="#ffffff" />
  <circle cx="297" cy="149" r="4.5" fill="#ffffff" />

  <!-- 鼻头：小三角，压在口鼻上缘。 -->
  <path d="M 358 172 L 372 172 L 365 184 Z" fill="#c0563f" />

  <!-- 嘴：填实的两段短弧。48px 下纯描边弧线只剩 1px。 -->
  <path d="M 336 196 Q 348 208 360 196 Q 372 206 384 194"
        fill="none" stroke="#3b2a1d" stroke-width="9" stroke-linecap="round" />

  <!-- 胡须：三根短线。48px 上基本不可见，但大尺寸下 unmistakably 是猫。 -->
  <g fill="none" stroke="#6b3a17" stroke-width="9" stroke-linecap="round">
    <path d="M 330 176 L 372 166" />
    <path d="M 332 188 L 376 190" />
    <path d="M 330 198 L 370 210" />
  </g>
</svg>
