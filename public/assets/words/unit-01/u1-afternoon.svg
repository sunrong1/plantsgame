<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：afternoon（下午）—— **单元 1 的内容**（Story 2.10 换源批次）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 69%、重心居中、**正面全对称**

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么归 `abstract`**：太阳是**有公认通用符号**的（§5.1 的 `abstract` 档判据）——
     没有哪本书要教孩子「这个图形是太阳」。

  ⚠️ **为什么画成「高悬的太阳」而不是「落山的太阳」**：下午 = 太阳还在天上。
     若画成半轮落日，它与「早上」的日出形状会撞在一起 —— 而单词卡是**二选一**，
     两张图必须一眼可分。⇒ 上午那张是**表盘**（圆里画了东西），
        下午这张是**太阳**（圆外长了尖刺）：一个是「圆内」，一个是「圆外」。

  ⚠️ **八根尖刺而不是光晕**：光晕（渐变圆）在 48px 上会糊成一个普通的圆点，
     与「早上」那只表盘几乎一样 ⇒ 认不出是下午。尖刺的轮廓在小尺寸上仍然成立。

  ⚠️ **尖刺是实心三角、不描边**：`docs/art-direction.md` §5.5 明写
     「词图不必有描边 —— 实心块画法同等合法」；描边还会把主体外接盒撑大 12px，
     徒增 §5.1 的占比压力。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="太阳">

  <!--
    八根尖刺：四根正交 + 四根斜向，全部是从内侧 r=110 收到尖端 r=176 的实心三角。
    ⚠️ 斜向端点按 45° 分量算：110/√2 = 77.8、176/√2 = 124.5、22/√2 = 15.6。
    ⚠️ **尖刺不描边** ⇒ 主体外接盒正好是 80..432，最长边 352px = **68.8%**。
  -->
  <g fill="#f9844a">
    <path d="M 256 146 L 256 80 L 234 146 Z" />
    <path d="M 366 256 L 432 256 L 366 278 Z" />
    <path d="M 256 366 L 256 432 L 278 366 Z" />
    <path d="M 146 256 L 80 256 L 146 234 Z" />
    <path d="M 178.2 178.2 L 131.5 131.5 L 193.8 162.6 Z" />
    <path d="M 333.8 178.2 L 380.5 131.5 L 318.2 162.6 Z" />
    <path d="M 333.8 333.8 L 380.5 380.5 L 318.2 349.3 Z" />
    <path d="M 178.2 333.8 L 131.5 380.5 L 193.8 349.3 Z" />
  </g>

  <!--
    太阳本体：暖黄的圆。
    ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
       实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
    ⚠️ 本体半径 104 + 半宽 6 = 110 < 尖刺的 176 ⇒ 它不决定外接盒。
  -->
  <circle cx="256" cy="256" r="104" fill="#f9c74f" stroke="#e08a2e" stroke-width="12" />

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-01` 实测）：
      主体占比 **68.8%**，最小留白 **80.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 80.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      八根尖刺 ✓（**主识别来源**：放射的轮廓 = 太阳）
      太阳本体 ✓（**第二识别来源**：圆心）
      本体描边 ✗ —— 48px 上只剩 1.1px，纯装饰
  -->
</svg>
