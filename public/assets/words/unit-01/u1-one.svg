<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：one（一）—— Story 1.9 第二批，**数词档**（抽象·字形）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 71%、重心居中、正面

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么数字要「画」而不是「写」。**
     G10 明令禁止 <text>，而这条禁令的理由在这里最尖锐 ——
     写 <text>1</text> 就等于**把答案直接印在图上**，
     孩子不用认字也能照抄，等于这张图零教学价值。
     ⇒ 只能用路径手绘字形。这与 u1-three（画三个箱子而不是写「3」）是同一条判据，
     1.8 当时写下的原话是「数量必须一眼可数」。

  ⚠️ **字形的三个决定（照抄黑板报的教学习惯，不是照抄某个字体）。**
     ① **带底横（base bar）** —— 儿童教本里的 1 大多带底横，
        没有底横的细长 1 在 48px 下会读成「一根竖线」或「一把刀」。
        ⚠️ 底横同时把整个字形的横向占位撑开，让 §5.1 的「最长边」落在合理的比例上。
     ② **左上角的斜旗（flag）** —— 它把 1 与 l / I / 一根柱子区分开。
        斜旗角度约 40°：太平读成「7 的上半截」，太陡读成「2 的一半」。
     ③ **笔画粗**（竖干宽 90）—— 48px 下细笔画会灰掉。

  ⚠️ **底横与竖干必须画成同一条路径。**
     分成两个图元时，竖干底端的描边会在底横中间露出一条横线，
     48px 下整条底横断成两截 ⇒ 本图用单一多边形。

  ⚠️ **与 u1-two 的分工**：
     1 有**底横 + 左上斜旗**，2 有**顶部圆弧 + 斜下笔**；
     1 的外轮廓是「直角多边形」，2 的外轮廓是「上圆下直」。
     48px 上这两条都还看得见，不靠颜色或明度区分。

  ⚠️ **描边逐图元写在自身上** —— 实算脚本的半宽口径只认元素自己声明的 stroke。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="一">

  <!--
    数字 1 的字形，单一闭合多边形，顺时针：
    竖干顶左 → 顶右 → 干右缘到底 → 底横右缘 → 底横右下 → 底横左下
    → 底横左缘 → 竖干左缘上行 → 斜旗下缘 → 闭合回顶左（斜旗上缘）。
    ⚠️ 六个顶点里 (340,396) 与 (400,396) 是底横与竖干交界的那两级台阶，
       少了它们底横就不是「一块板」而是「一截加粗」。
  -->
  <path d="M 250 90
           L 340 90 L 340 396 L 400 396 L 400 440
           L 190 440 L 190 396 L 250 396
           L 250 230 L 140 180 Z"
        fill="#2f3b4c" stroke="#16202b" stroke-width="16" stroke-linejoin="round" />

  <!--
    竖干上的一道浅色竖条：让字形在灰绿底上有一点体积，不至于糊成一坨黑。
    ⚠️ 画在竖干的**左半**，不居中：居中会让 48px 下这条浅色把竖干劈成两半，
       整个 1 读成「两根竖线」。
  -->
  <path d="M 268 110 L 296 110 L 296 386 L 268 386 Z" fill="#55677f" stroke="none" />
</svg>
