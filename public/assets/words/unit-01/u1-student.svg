<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：student（学生）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、双手贴身下垂、主体占画布约 81%、重心居中略偏下

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ 学生与老师的分工全在**手臂**。老师的双臂从肩甩到躯干**之外**（肘外八），
     所以老师的侧影是「上宽下窄 + 腰前一块摊开的书」；这里的手臂**贴着躯干下垂**，
     侧影的两侧是直的 —— 与老师绝不会撞。
  ⚠️ 书包是学生的识别点，必须**在躯干轮廓之外露出一整条竖鼓包**（右肩到腰）。
     塞进衣服里就等于没画，侧影上就退回「一个没有特征的人」。
  ⚠️ 本图与同批 brother 的分工在**头顶**：brother 的鸭舌帽是一枚**单侧尖刺**
     伸在头的一边，本图的头发是两侧对称的圆弧 —— 头顶一个是「不对称尖」，
     一个是「对称圆」，48px 灰度下也分得开。
  ⚠️ 呆毛**刻意没画**：它会把侧影顶部顶高 20px，把 §5.1 的占比推到 86% 出档，
     而它对「学生」这个读法没有任何贡献 —— 书包已经足够。
  ⚠️ 头发椭圆必须比脸**宽且偏上**，脸后画盖住发际；
     沿用 1.8 老师那条判据：**头发的下缘必须在眼睛之上**（发 150 / 眼 164）。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="学生">

  <g stroke="#33323a" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">

    <!-- 腿与鞋：落点齐平（§5 模板的「落地线」）。 -->
    <rect x="208" y="346" width="50" height="94" rx="24" fill="#4a4f5e" />
    <rect x="258" y="346" width="50" height="94" rx="24" fill="#414655" />
    <ellipse cx="233" cy="444" rx="38" ry="18" fill="#2b313b" />
    <ellipse cx="283" cy="444" rx="38" ry="18" fill="#2b313b" />

    <!--
      书包：**画在躯干之前**，露出来的是右肩外侧那一整条竖鼓包。
      ⚠️ 顺序反了就只剩肩上一小块，48px 上完全消失。
    -->
    <rect x="304" y="238" width="66" height="112" rx="30" fill="#d9534f" />
    <!-- 书包侧袋：一条浅色带，让鼓包不是一块纯色。 -->
    <rect x="326" y="292" width="34" height="42" rx="14" fill="#b8413d" stroke="none" />

    <!-- 上身：肩宽腰窄的梯形 —— 人形最容易认的骨架。 -->
    <path d="M 180 258 Q 180 222 256 222 Q 332 222 332 258 L 320 348 Q 312 364 256 364
             Q 200 364 192 348 Z" fill="#57a773" />

    <!-- 领口：一道浅色的 V，交代「这是件衣服」而不是一块色块。 -->
    <path d="M 224 226 L 256 252 L 288 226" fill="none" stroke="#e8f2ea" stroke-width="11" />

    <!-- 脖子 -->
    <rect x="234" y="178" width="44" height="52" rx="16" fill="#e8bd97" />

    <!-- 头发：比脸宽、比脸偏上的一个椭圆。 -->
    <ellipse cx="256" cy="106" rx="66" ry="44" fill="#3b2a1d" />

    <!--
      脸：比头发窄、后画，盖住发际线。
      ⚠️ 脸比头发窄这一点是「短发的学生」与「戴头巾的人」的分界。
    -->
    <ellipse cx="256" cy="152" rx="56" ry="60" fill="#f0c9a4" />

    <!-- 额前一撮刘海：只压到眉上，不许压到眼睛。 -->
    <path d="M 202 132 Q 226 106 262 108 Q 298 110 314 138 Q 288 122 258 126 Q 226 128 202 132 Z"
          fill="#3b2a1d" stroke="none" />

    <!--
      手臂：**贴着躯干下垂**，这是与老师的唯一分工。
      ⚠️ 肘不能再往外推 —— 老师那 36px 的外八弧形就是老师的签名，
         学生照抄就变成「两个人的侧面剪影一样」。
    -->
    <g fill="none" stroke="#57a773" stroke-width="34" stroke-linecap="round">
      <path d="M 196 258 L 198 336" />
      <path d="M 316 258 L 318 336" />
    </g>
    <circle cx="198" cy="348" r="21" fill="#f0c9a4" />
    <circle cx="318" cy="348" r="21" fill="#f0c9a4" />
  </g>

  <!--
    手里的书：竖着夹在左手边，露出一条**窄矩形**。
    ⚠️ 摊开 / 横过来拿就与老师腰前那块「摊开的书」同构了 ——
       竖直贴着腿下垂才是学生的读法，也是侧影上一处只在腰的高度出现的凸起。
  -->
  <g transform="rotate(-9 176 336)">
    <!-- 封面 -->
    <rect x="152" y="294" width="52" height="82" rx="9" fill="#f0a63c"
          stroke="#b06f18" stroke-width="12" />
    <!--
      书脊：左侧一条深色窄条。
      ⚠️ 第一版是「白页居中 + 橙框四周等宽」，栅格化后读成**一块平板** ——
         手机的读法就是这么来的。让深色条只占左边 1/4、白页偏右，
         才读成「一本合起来的书」。
    -->
    <rect x="152" y="294" width="15" height="82" rx="7" fill="#b06f18" stroke="none" />
    <!-- 白页 -->
    <rect x="169" y="302" width="30" height="66" rx="5" fill="#fdf3e0" stroke="none" />
  </g>

  <!-- 五官：实心不描边（§5.5：眼睛与高光一律实心）。 -->
  <circle cx="234" cy="166" r="13" fill="#3b2a1d" />
  <circle cx="278" cy="166" r="13" fill="#3b2a1d" />
  <circle cx="238" cy="161" r="4.5" fill="#ffffff" />
  <circle cx="282" cy="161" r="4.5" fill="#ffffff" />

  <!-- 微笑：一条短上弯线。画长了会读成小胡子。 -->
  <path d="M 238 194 Q 256 208 274 194" fill="none" stroke="#8a5a3c" stroke-width="10"
        stroke-linecap="round" />
</svg>
