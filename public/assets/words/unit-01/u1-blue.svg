<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：blue（蓝色）—— Story 1.9 第二批，**颜色档**（抽象·通用符号）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么是「一块蓝色色卡」，不是蓝色的什么。**
     同 u1-red 的口径：颜色的通用符号是**色卡本身**，不是「蓝色的某个东西」。
     画蓝色的球 = ball + blue 两个答案同时在场，比画错还糟。

  ⚠️ **最大的串扰风险与它的解药（本图存在的主要理由）。**
     单元 1 里已经有 **u1-three**（三个木色箱子）与 **u1-one**（一个数字 1），
     前者的主体就是方块 —— 一个蓝色的方块摆在 three 旁边，
     孩子有可能读成「blue 是一个箱子」。
     ⇒ 三条解药同时用上：
     ① **色卡不是立方体**：正圆角、**完全平面**、无顶面/侧面/背面的三面结构。
        three 的箱子刻意画了三个不同明度的面，那是有体积的读法；本图一个面都没有。
     ② **倾斜 8°**：three 的箱子是轴对齐的。倾一点点就与所有箱子分开。
     ③ **一道高光**：色卡有光泽，箱子没有。48px 上高光比倾角更容易被看见。

  ⚠️ **与 u1-yellow / u1-red 的分工在形状上，不在颜色上**：
     三张颜色词做成三种形状差别极大的符号（心 / 方 / 星），
     灰度档下三张都是同一个中灰明度，形状再接近就彻底认不出。

  ⚠️ **描边逐图元写在自身上** —— 实算脚本的半宽口径只认元素自己声明的 stroke。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="蓝色色卡">

  <g transform="rotate(8 256 256)">

    <!-- 色卡主体：一枚正圆角方片，平面、无厚度。 -->
    <rect x="100" y="100" width="312" height="312" rx="66" fill="#2f6fd0"
          stroke="#1c4a8f" stroke-width="16" stroke-linejoin="round" />

    <!--
      内侧一圈更深的描边：给色卡「有一圈边框」的结构。
      ⚠️ 这一圈不是装饰 —— 它让这张图在 48px 下有一个**内部的方形轮廓**，
         而 u1-three 的箱子内部是三个面。内部轮廓的形状是区分的关键。
      ⚠️ 第一版在色卡上压过一道斜的高光，栅格化后**整张读成一块手机屏幕**
         （高光 + 内框 = 手机的面板）。⇒ v2 删掉高光，
         只留内框 —— 内框留的是「一块料子」，高光留的是「一块玻璃」，后者是错的那个。
    -->
    <rect x="150" y="150" width="212" height="212" rx="34" fill="none"
          stroke="#1c4a8f" stroke-width="10" />


  </g>
</svg>
