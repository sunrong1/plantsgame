<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：goodbye（再见）—— Story 1.9 第二批，**手势档**（figure）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure  ← 人物/手势档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 77%、重心居中、**整体斜置 -28°**、五指并拢

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **本图与 u1-hello 的分工，是本 story 里唯一一处「靠剪影而非造型」的分界。**
     两只手**刻意用同一套肤色、同一套描边色、同样粗的手指** ——
     凡是颜色、明度、胖瘦上的差别都不算数，因为四选一里孩子会先比颜色。
     分界有三条，全部在 48px 上还看得见：

     ① **指缝是空的还是画的**：
        hello 的指间是**背景**（五指真的分开，缺口里透得出白）；
        goodbye 的指间是**三道暗色短条**（手指并拢，缝是画上去的）。

     ② **斜置**：
        hello 近乎竖直；**goodbye 整体斜置 -28°**。
        ⚠️ 这条是 v3 才补上的，也是最要紧的一条 ——
           「连指」在 48px 下与「一整块圆角形状」只差十几像素，
           而**倾斜是一个低频特征，缩到 48px 仍然一眼可辨**。
           换句话说：指缝那条是加分项，斜置这条才是真正的保险。

     ③ **挥动弧线的位置相反**：
        hello 的弧在手的**左右两侧**（左右挥）；goodbye 的弧在手的**指尖前方**（挥走）。

  ⚠️ **v1 / v2 踩过的三个坑（全部在栅格化里才看出来，实算一条都没报）：**
     ① **手指画成一块矩形压在掌心上 → 手掌正中一道贯穿横缝**，
        48px 下比任何细节都醒目，整只手读成「一只手 + 一块方砖」。
        ⇒ **手掌与指片合并成一条路径**，横缝从几何上不存在。
     ② **完全不画指缝 → 读成「一根竖起的大拇指」（👍）**。
        ⇒ 补三道**填实的暗色短条**。⚠️ 刻意用**填色**而不是 9–11px 描边：
        §5.5 只放开了嘴 / 眉毛 / 笑的描边，指缝不在其中；填色不踩那条线，
        且在 48px 下更实。
     ③ **挥手弧线画在旋转组之外 → 被手挡住只剩一小截**。
        ⇒ v3 把弧线收进旋转组，跟着手一起斜置。
        ⚠️ 反过来说，弧线**必须**跟着手转：弧线的作用是说明「这只手在动」，
           一旦弧线与手的方向不一致，整张图就散了。

  ⚠️ **掌心没有掌纹** —— 见 §5.5b「48px 可读性地板」，
     48px 下掌纹是 1–2px 的噪声图层，判据由 u1-hello 与本图共同遵守。

  ⚠️ **描边逐图元写在自身上**：实算脚本的半宽口径只认元素自己声明的 stroke
     （art-direction.md §5「已知偏差」），写到 <g> 上会让实算值偏小。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="再见">

  <!--
    ⚠️ 外层这个 translate 是实算调出来的，不是随手加的：
       斜置 -28° 会把外接框整体推偏，重心第一版落在 (222, 268)。
       平移后落在 (256, 256) 附近。
  -->
  <g transform="translate(6 -20) rotate(-24 256 330)">

    <!-- 挥手弧线：在指尖**前方**（上方），两道，跟着手一起斜置。 -->
    <g fill="none" stroke="#6f7a8c" stroke-width="18" stroke-linecap="round">
      <path d="M 212 160 Q 262 120 312 160" />
      <path d="M 200 126 Q 262 76 324 126" />
    </g>

    <!-- 袖口：同一套深蓝，刻意与 u1-hello 一致。 -->
    <rect x="204" y="424" width="108" height="58" rx="16" fill="#2b3a55"
          stroke="#1b2230" stroke-width="12" stroke-linejoin="round" />

    <!--
      手 = 手掌 + 五指并拢的指片，**合并成一条路径**（见文件头 v1 坑 ①）。
      ⚠️ 指片的顶缘是**一条圆滑的弧**而不是平横线 ——
         平顶读成「一块橡皮」，圆顶才读成「并拢的指尖」。
      ⚠️ 指片比手掌窄一截（336 对 356）：那个台阶是「手」与「袖」的过渡，
         完全没有的话整只手读成一根柱状物。
    -->
    <path d="M 176 250 Q 182 176 256 174 Q 330 176 336 250 L 336 320
             Q 352 342 356 372 C 362 414 322 448 274 448
             C 226 448 172 432 166 396 Q 162 364 180 344 L 176 250 Z"
          fill="#f0c69b" stroke="#1b2230" stroke-width="12" stroke-linejoin="round" />

    <!--
      三道指缝：填实的暗色短条，不是描边（见文件头 v2 坑 ②）。
      ⚠️ 只画到指片上半段（y≈258），**不画到掌心上** ——
         画满整根手指会读成「四根分开但底下连着」，停在指尖那截才对。
      ⚠️ 三条不等长：中指那道最长，两侧略短。
    -->
    <rect x="216" y="204" width="11" height="54" rx="5" fill="#c98f5e" />
    <rect x="252" y="198" width="11" height="60" rx="5" fill="#c98f5e" />
    <rect x="288" y="206" width="11" height="52" rx="5" fill="#c98f5e" />

    <!--
      拇指：从手掌左下方斜伸出去（-36°），与 hello 同侧、同角度量级。
      ⚠️ 本图里拇指的任务比 hello 更重：并拢的指片让整只手接近一个圆角形状，
         拇指是唯一打破它的形状。**画小了就前功尽弃。**
    -->
    <rect x="126" y="306" width="46" height="104" rx="23" fill="#efc299"
          stroke="#1b2230" stroke-width="12" stroke-linejoin="round"
          transform="rotate(-36 158 386)" />

  </g>
</svg>
