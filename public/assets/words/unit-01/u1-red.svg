<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：red（红色）—— Story 1.9 第二批，**颜色档**（抽象·通用符号）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 69%、重心居中、正面、完全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么是红心，而不是「红色的什么」。**
     AC-11 定的口径是「颜色词画**该颜色公认的通用符号**，不要发明新造型」——
     红色的通用符号是心（情人节、点赞、I ❤）。若画一个红色的球，那是 ball；
     画一只红色的狗，那是 dog 且同时激活另一个答案。
     ⇒ **心形本身就是「红」这个答案，不是一次描述。**

  ⚠️ **与 u1-yellow / u1-blue 的分工在形状上，不在颜色上。**
     三张颜色词刻意做成**三种形状差别极大的符号**（心 / 方 / 星），
     这样即使在灰度档下三张也不会互相认错 ——
     灰度下三张都是同一个明度的中灰，若形状再接近就彻底完了。

  ⚠️ **红只在本单元的这一张里出现。**
     其余 29 张里没有第二颗红心，也没有任何大面积红色块面
     （dog 的耳朵是棕色系、mother 的裙子是紫红偏冷），
     保证「红」这个答案在四选一里只有一个落点。

  ⚠️ **描边逐图元写在自身上**：实算脚本的半宽口径只认元素自己声明的 stroke
     （art-direction.md §5「已知偏差」），写到 <g> 上会让实算值偏小。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="红心">

  <!--
    心形：两枚圆瓣 + 一个下尖点，整条路径一次画完。
    ⚠️ **下尖点必须真的收成尖**。心形下缘画成圆弧会读成「一朵花」或
       「一颗心形的糖」；收成尖才读成「心」。
    ⚠️ 顶部的凹口（两瓣之间那个下陷）不能省，也不能填平 ——
       填平就是一块带缺口的花瓣砖，凹口在 48px 上占十几像素，是心形的第一识别点。
  -->
  <path d="M 256 414
           C 202 372 88 302 88 218
           C 88 162 130 124 182 124
           C 218 124 244 143 256 170
           C 268 143 294 124 330 124
           C 382 124 424 162 424 218
           C 424 302 310 372 256 414 Z"
        fill="#d92f3f" stroke="#9c1c2b" stroke-width="16" stroke-linejoin="round" />

  <!--
    高光：一小块偏亮的斜条，画在左上。
    ⚠️ 它的作用是让这张图读起来像「一个有体积的东西」，不是多余的装饰 ——
       没有它，红心在灰绿底（草绿）上会和背景明度贴太近。
    ⚠️ 但它**不许长到心形外面**：露出去就成了「一块浅红斑」。
  -->
  <path d="M 138 214 C 140 176 164 150 196 142 C 186 172 182 200 184 226 Z"
        fill="#f2737d" stroke="none" />
</svg>
