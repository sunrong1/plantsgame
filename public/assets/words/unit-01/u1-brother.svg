<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：brother（哥哥）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、**双手插在卫衣兜里**、主体占画布约 74%、重心居中略偏下

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ ① **帽檐是本批唯一的「头部横向外伸物」**。
        正面看的鸭舌帽，帽檐是一块**比头宽、比头低的横向板条**，
        左右各露出约 16px。48px 灰度下那是「一颗头上面压着一条横杠」。
        ⚠️ 它必须是**一整块连续的横向板条**，不能画成左右两片 ——
           两片就读成「头上有两个东西」，那是姐姐的双马尾。
  ⚠️ ② **双手插兜 ⇒ 手臂不出轮廓**。
        本批的老师、爸爸都是肘在躯干之外（外八 / 叉腰），
        本图的手臂一路贴着躯干往下、在兜口结束，侧影两侧是直的 ——
        与学生同一处理，但学生的识别点是**侧影上的书包鼓包**，本图没有。
  ⚠️ ③ **卫衣的兜是一道横着的浅色带**，从腰往上横过一大截。
        它把下半身的竖直分割打断，是本图第三重保险。
  ⚠️ ④ 帽檐**不许压到眼睛**。沿用 1.8 老师那条判据的变体：
        帽檐下缘 175 / 眼睛 196，只差 21px。
        压到眼睛就变成「一个蒙着脸的人」。
  ⚠️ 与同批 sister 的分工（两者的头都在头侧有东西）：
        哥哥的帽檐是**一整条横板，左右对称、位置低（压住额头）**；
        姐姐的马尾是**两坨分离的圆团，位置高（在头的两旁、齐耳）**。
        ⇒ 「一条横杠」与「两个圆点」在 48px 上是两种形状。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="哥哥">

  <g stroke="#2b2f38" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!-- 腿与鞋：落点齐平（§5 模板的「落地线」）。 -->
    <rect x="204" y="380" width="52" height="68" rx="24" fill="#4a4f5e" />
    <rect x="256" y="380" width="52" height="68" rx="24" fill="#414655" />
    <ellipse cx="230" cy="448" rx="38" ry="17" fill="#2b313b" />
    <ellipse cx="282" cy="448" rx="38" ry="17" fill="#2b313b" />

    <!-- 上身：肩宽腰窄。 -->
    <path d="M 180 262 Q 180 236 256 236 Q 332 236 332 262 L 322 374 Q 314 390 256 390
             Q 198 390 190 374 Z" fill="#2f8f8a" />

    <!--
      卫衣的兜：一道**横着的浅色带**。
      ⚠️ 必须在躯干**之后**画 —— 第一版画在躯干之前，整条被盖住，
         栅格化后只剩下两只手，「插兜」这个读法整个丢了。
      ⚠️ 也不许画成竖的两条（口袋常见的画法）：竖口袋会在腰上留下两道竖沟，
         和爸爸的皮带读法混。
    -->
    <path d="M 200 342 Q 256 358 312 342 L 308 374 Q 256 386 204 374 Z" fill="#3d9b96" />

    <!--
      卫衣的领：一圈落在肩上的厚领子。
      ⚠️ 宽度**不许超过肩宽**（rx 80 对肩 180–332）—— 超过就成了第二个横向外伸物，
         与帽檐抢同一个读法（见文件头 ④）。
    -->
    <ellipse cx="256" cy="252" rx="80" ry="34" fill="#26736f" />
    <path d="M 232 244 Q 256 268 280 244" fill="none" stroke="#1f5f5b" stroke-width="11" />

    <!-- 脖子 -->
    <rect x="240" y="224" width="32" height="32" rx="13" fill="#e0b088" />

    <!-- 头 -->
    <circle cx="256" cy="170" r="60" fill="#e0b088" />

    <!--
      鸭舌帽的帽冠：压在头顶上的一顶。
      ⚠️ 与「短平头」（爸爸）的区别是**帽冠高于头顶**，侧影上头顶有一顶东西。
    -->
    <path d="M 196 158 Q 196 98 256 98 Q 316 98 316 158 Z" fill="#d9534f" />

    <!--
      帽檐：**一整块连续的横向板条**，比头宽（184–328 对头 196–316），
      左右各外伸约 16px。这是本图在侧影上唯一的、也是最硬的一处特征。
      ⚠️ 下缘 175，**眼睛在 196** —— 差 21px，压住就变成「一个蒙着脸的人」。
    -->
    <path d="M 188 144 Q 256 158 324 144 L 328 168 Q 256 182 184 168 Z" fill="#b8413d" />

    <!--
      手臂：**一路贴着躯干往下、在兜口结束**，肘不出轮廓。
      ⚠️ 这是与老师 / 爸爸的分界（那两张的手臂都在躯干之外）。
    -->
    <g fill="none" stroke="#2f8f8a" stroke-width="34" stroke-linecap="round">
      <path d="M 192 266 Q 188 316 214 340" />
      <path d="M 320 266 Q 324 316 298 340" />
    </g>
    <!-- 插在兜里的两只手：明确的两只，压在兜口的上缘。 -->
    <circle cx="220" cy="340" r="19" fill="#e0b088" stroke-width="10" />
    <circle cx="292" cy="340" r="19" fill="#e0b088" stroke-width="10" />
  </g>

  <!-- 五官：实心不描边。只露眼睛以下，因为帽檐压住了额头。 -->
  <circle cx="234" cy="198" r="11" fill="#2b2118" />
  <circle cx="278" cy="198" r="11" fill="#2b2118" />
  <path d="M 240 218 Q 256 228 272 218" fill="none" stroke="#8a5a3c" stroke-width="10"
        stroke-linecap="round" />
</svg>
