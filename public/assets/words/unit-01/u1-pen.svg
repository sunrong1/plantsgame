<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：pen（钢笔）—— Story 1.9 第二批，**几何直线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：**斜置 35°**、笔尖朝左上、主体占画布约 68%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（与同批 pencil 的分工）：
  ⚠️ ① **笔夹**：一枚**顺着笔杆方向、压在笔帽上方**的窄条，
        这是本图在侧影上**唯一的侧向凸起**，也是本图与铅笔最干净的一条分界 ——
        铅笔的轮廓上什么都没有突出。
        ⚠️ 笔夹必须与笔杆**平行**（顺着笔的长方向），
           画成横跨笔杆的一根就成了「一根别针别在笔上」，
           48px 上整支笔会读成别针。
  ⚠️ ② ⚠️ **这里原本写的是「本图比铅笔更短更粗（360/68 对 400/56）」——
        写完量了一下，两支笔的长度几乎一样（406 对 408），
        只差笔身粗细 68 对 56，折算到 48px 不到 1 个像素。
        ⇒ 这条判据是假的，已删。长宽比不构成分界，**分界只有 ①③④**。**
  ⚠️ ③ 左端是**一段短的金属锥**，明显比铅笔的木锥短，
        锥尖没有深色的芯 —— 有深色芯的一端一定是铅笔。
  ⚠️ ④ 右端是**笔帽**：比笔杆粗一档、一端是圆的，没有橡皮头那种
        「颜色突变 + 等宽方柱」的结构。
  ⚠️ ⚠️ **本图刻意不用「圆珠笔」的塑料杆** —— 塑料杆与铅笔的木色太近，
        灰度档下两支笔会并成一支。深蓝笔杆 + 银色配件把两者的明度拉开了。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="钢笔">
  <g transform="rotate(-45 256 256)" stroke="#1b2230" stroke-width="12"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- 笔帽：比笔杆粗一档，右端是圆的。 -->
    <rect x="330" y="222" width="106" height="68" rx="30" fill="#22304a" />
    <!-- 笔帽箍：一条银色环。 -->
    <rect x="330" y="222" width="22" height="68" fill="#c2c8d2" stroke="none" />

    <!--
      笔夹：**顺着笔杆方向**的一根窄条，压在笔帽上方。
      ⚠️ 这是本图在侧影上唯一的侧向凸起 —— 与铅笔的全光轮廓相对。
      ⚠️ 必须与笔杆平行；横跨笔杆就成了别针（见文件头 ①）。
    -->
    <path d="M 372 214 L 424 214" fill="none" stroke="#1b2230" stroke-width="20"
          stroke-linecap="round" />
    <path d="M 372 214 L 424 214" fill="none" stroke="#c2c8d2" stroke-width="11"
          stroke-linecap="round" />
    <circle cx="424" cy="214" r="13" fill="#c2c8d2" />

    <!-- 笔杆：深蓝，两端各一道银环。 -->
    <rect x="96" y="230" width="244" height="52" rx="10" fill="#2b3a55" />
    <rect x="150" y="234" width="14" height="44" fill="#4d628a" stroke="none" />

    <!-- 金属锥：短而钝，没有深色的芯。 -->
    <path d="M 30 256 L 100 232 L 100 280 Z" fill="#c2c8d2" />
    <circle cx="34" cy="256" r="10" fill="#1b2230" stroke="none" />
  </g>
</svg>
