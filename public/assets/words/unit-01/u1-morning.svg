<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：morning（早上）—— **单元 1 的内容**（Story 2.10 换源批次）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 68%、重心居中、**正面全对称**

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么归 `abstract`**：时间词没有专属的具象物件，
     而**时钟是有公认通用符号的**（§5.1 的 `abstract` 档判据：「有公认的通用符号」）——
     孩子看到一只圆面带指针的表就知道那是「表」，不需要大人解释。

  ⚠️ **为什么画成 7:00 而不是 12:00**：指针的角度是「早上」这件事的**唯一载体**
     —— 表盘本身只说「时间」，不说「早上」。
     7:00 的时针指向左下（7 点钟方向），是英语教材里「Good morning」的标准时刻；
     12:00 会被读成中午。

  ⚠️ **为什么它与 `u1-afternoon`（太阳）必须一眼可分**：单词卡是**二选一**
     （Story 2.4 起档 1 的单词卡只有 2 个选项）⇒ 两张图并排出现时，
     孩子只能靠**轮廓**分辨。
     ⇒ 本图的轮廓是「**一个圆盘 + 四根粗刻度**」（方硬的圆），
        而下午那张是「**一个圆 + 八根尖刺**」（放射的尖）——
        一个是「圆里画了东西」，一个是「圆外长了东西」，48px 上也分得开。

  ⚠️ **指针为什么画粗 14px**：§5.5 的下限是 12px；
     48px 上 14px 的描边只剩 1.3px ⇒ 指针在卡面上基本看不见。
     这是**已知取舍**：指针是「细节层」，真正的识别来源是「圆盘 + 刻度」。
     针尖方向保留下来是为了让孩子在放大时能确认「早上」。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="时钟（早上七点）">
  <g stroke="#2a2a4a" stroke-linecap="round">

    <!--
      表盘外圈：深钢蓝的圆环。
      ⚠️ 描边 12px 写在元素自己身上（art-direction.md §5「已知偏差」：
         实算只认元素自身声明的 stroke，写在 <g> 上会让实算值偏小 —— 偏小正是判绿的方向）。
      ⚠️ 外圈半径 168 + 半宽 6 = 174 ⇒ 主体最长边 348px = **68.0%**，
         落在 abstract 档的 60%–75% 里（离两端都有余量）。
    -->
    <circle cx="256" cy="256" r="168" fill="#5c8fb0" stroke-width="12" />

    <!--
      表面：奶白。
      ⚠️ 不给表面描边：描边会在外圈内侧再画一道黑线，
         48px 上那道线会把圆盘切成两半，反而读成「靶心」。
    -->
    <circle cx="256" cy="256" r="142" fill="#fdf6e6" stroke="none" />

    <!--
      四根粗刻度（12 / 3 / 6 / 9 点）：从表面边缘**往里**伸 30px。
      ⚠️ **往里而不是往外**：刻度若伸出表面，它会顶到表圈之外
         （表面 r=142 ⇒ 12 点在 y=114；刻度往里到 y=144，往外就到 y=84，
         而表圈外沿在 y=82 —— 往外伸会**戳出表圈**）。
      ⚠️ **四根而不是十二根**：48px 上十二根会糊成一圈灰，
         而四根粗刻度还能保住「这是表盘」的读法。
    -->
    <line x1="256" y1="114" x2="256" y2="144" stroke-width="12" />
    <line x1="398" y1="256" x2="368" y2="256" stroke-width="12" />
    <line x1="256" y1="398" x2="256" y2="368" stroke-width="12" />
    <line x1="114" y1="256" x2="144" y2="256" stroke-width="12" />

    <!--
      四根细刻度（1 / 5 / 7 / 11 点）：45° 斜放，从表面边缘往里 22px。
      ⚠️ 斜向端点按 45° 分量算：r=142 ⇒ 分量 100.4；往里 22px ⇒ 分量再减 15.6。
    -->
    <line x1="356.4" y1="155.6" x2="340.8" y2="171.2" stroke-width="9" />
    <line x1="356.4" y1="356.4" x2="340.8" y2="340.8" stroke-width="9" />
    <line x1="155.6" y1="356.4" x2="171.2" y2="340.8" stroke-width="9" />
    <line x1="155.6" y1="155.6" x2="171.2" y2="171.2" stroke-width="9" />

    <!--
      时针：指向 7 点钟方向（左下）。
      ⚠️ 7 点 = 从 12 点起顺时针 210°；屏幕坐标里顺时针 = [[cos,-sin],[sin,cos]]，
         于是方向向量 (0,-1) 转到 (-0.5, 0.866) ⇒ 端点 (256-44, 256+76.2) = (212, 332.2)。
      ⚠️ 长度 88 比分针短：两根一样长就读不出「几点了」。
    -->
    <line x1="256" y1="256" x2="212" y2="332.2" stroke-width="14" />

    <!--
      分针：指向 12 点（正上），长 120。
      ⚠️ 12 点 = (0,-1) ⇒ 端点 (256, 136)。
    -->
    <line x1="256" y1="256" x2="256" y2="136" stroke-width="14" />

    <!-- 中心轴：一个小圆点，把两根针连成「一根针」而不是「两根棍」。 -->
    <circle cx="256" cy="256" r="14" fill="#2a2a4a" stroke="none" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-01` 实测）：
      主体占比 **68.0%**，最小留白 **82.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 82.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      表盘外圈 ✓（**主识别来源**：一个圆盘）
      四根粗刻度 ✓（**第二识别来源**：四根方硬的短线 = 表盘）
      四根细刻度 ✗ —— 48px 上基本消失，属纯噪声层 ⇒ **只加不加减**（见 §5.5b 的取舍）
      两根指针 ✗ —— 48px 上只剩 1.3px，但它们是「早上」这一**语义**的载体，
        放大看仍有用 ⇒ 保留，不计入 48px 的识别来源
      中心轴 ✗ —— 纯装饰
  -->
</svg>
