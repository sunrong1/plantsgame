<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：fish（鱼）—— Story 1.9 第一批，**有机曲线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：3/4 侧朝右、主体占画布约 72%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据：
  ⚠️ 鱼与鸟的分界全在**三处**：① 头端是**圆钝**的（鸟是硬三角喙）
     ② 尾是**一片竖着的扇形**（鸟是三根分开的尖角）
     ③ 有一条**立在背上的背鳍**（鸟没有这个东西）。
     ⇒ 这三处是本图与同批 bird 的唯一剪影分工，任一处画错就与 bird 重合。
  ⚠️ 鱼身画成上下对称的椭圆就读成「一个带尾的鸡蛋」。这里让**背线明显高于腹线**
     （背 30% / 腹 45% 的椭圆，加上一条被鳍切开的背线）。
  ⚠️ 鳞片在 48px 上必然变成噪点。**只用三道弧线表示，不画鳞** ——
     密集的细节在 48px 上会糊成一层脏色，反而把干净的剪影毁掉。
  ⚠️ 眼睛位置很要紧：必须在**头部靠前的那一端**，画在身体中央就成了一条虫。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鱼">

  <!--
    ⚠️ 整组位移（translate 16,-14）。
    原因：鱼尾向左下甩出去，重心自然偏左下 —— 第一版实测 §5.3 偏移 37.3px，超出 ±30.7px。
    改坐标会一路改到十来个数字，出错不易复查；包一层 `<g>` 只动一处，
    而且 §5.3 的守卫会跟着 transform 一起走（这一点由变异 M33 验过）。
  -->
  <g transform="translate(16,-14)">

  <!--
    尾鳍：一片**竖着的**扇形，边缘带波浪。
    ⚠️ 画成水平展开就与同批 bird 的尾羽同构了 —— 竖 / 横是这两张图的剪影分工。
  -->
  <path d="M 168 268 Q 108 178 60 196 Q 76 268 60 340 Q 108 358 168 268 Z"
        fill="#f0913c" stroke="#c25f14" stroke-width="14" stroke-linejoin="round" />

  <!--
    背鳍：立在背上的一个三角。
    ⚠️ 这是鱼与鸟的第三分界，去掉它整条鱼就可能读成一只没有喙的鸟。
  -->
  <path d="M 196 206 Q 246 128 306 190 Z"
        fill="#f0913c" stroke="#c25f14" stroke-width="12" stroke-linejoin="round" />

  <!--
    身体：背线高、腹线深，不是对称椭圆。
    用一条 `<path>` 而不是 `<ellipse>` —— ellipse 做不到不对称的上下缘。
  -->
  <path d="M 156 272 Q 190 152 312 172 Q 404 190 420 274 Q 396 372 286 386 Q 178 376 156 272 Z"
        fill="#f7a94a" stroke="#c25f14" stroke-width="14" stroke-linejoin="round" />

  <!--
    腹鳍：一片小三角，压在腹线上。
    ⚠️ 画大一点没关系 —— 它不参与辨识，但它让腹线不是一条光滑的弧，
    48px 上腹线因此有一个「凹口」，这是鱼与虫的分界。
  -->
  <path d="M 268 384 L 316 384 L 288 424 Z" fill="#f0913c" stroke="#c25f14" stroke-width="12"
        stroke-linejoin="round" />

  <!--
    鳃：三道短弧，交代这是鱼而不是一个带尾的蛋。
    ⚠️ 48px 上这三道弧会并成一道较深的线 —— 那是可接受的，它们是加分项不是必需项。
  -->
  <path d="M 344 206 Q 322 274 344 344"
        fill="none" stroke="#c25f14" stroke-width="12" stroke-linecap="round" />

  <!-- 侧线：一条浅浅的横带，与鳃之间留出空间。 -->
  <path d="M 176 268 Q 280 244 396 262"
        fill="none" stroke="#e08a2e" stroke-width="12" stroke-linecap="round" />

  <!-- 五官：眼睛必须在头端（靠前那一端），实心不描边。 -->
  <circle cx="372" cy="248" r="18" fill="#ffffff" />
  <circle cx="375" cy="248" r="10" fill="#22303a" />
  <circle cx="371" cy="243" r="4" fill="#ffffff" />

  <!--
    嘴：头端最前端的一道短弧线。
    ⚠️ 画圆锥就成鸟喙了（与同批 bird 撞剪影）—— 这里只留一条弧线表示闭合的嘴。
  -->
  <path d="M 404 296 Q 418 288 412 272"
        fill="none" stroke="#c25f14" stroke-width="12" stroke-linecap="round" />
  </g>
</svg>
