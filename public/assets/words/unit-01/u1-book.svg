<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：book（书）—— Story 1.9 第一批，**几何直线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：**合上的书竖立、微微侧倾**、主体占画布约 69%、重心居中略偏下

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  本图是本批的**故意对照组**：
  ⚠️ 它必须是本批**最省力的一张**，用来和同批的 11 张做对照 ——
     如果连它都要返工三版以上，说明是这一批的门槛定错了，
     而不是这张图难（第一批评判条件 (b) 就靠它来定门槛）。
  ⚠️ 因此这里只画一个**规则的长方形加一条丝带**：
     直线、右角、圆角 —— 全落在 geometric 档的形状语言里，
     不碰任何一条需要判断的曲线。

  剪影判据：
  ⚠️ 必须是**合上的、竖着的**书，不能画摊开的书。
     老师（1.8 交付）腰前已经有一块**摊开的书**；
     本批再来一张摊开的书，两张图在四选一里并排时就是同一件东西。
     ⇒ 本图的侧影是**一个竖立的长方形**（外加底下一条丝带），
        老师那张的侧影是**一个坐在人身上、左右摊开的宽块**。
  ⚠️ 书脊必须在**左边**、书页必须在**右边**：正面看一本合着的书，
     侧影上看不见厚薄，但**书脊那一条更深的色带**是「这是一本书」而不是
     「一块板」的第一交代。
  ⚠️ 侧倾 12° 是刻意的：一个完全竖直的长方形在 48px 上会读成
     「一扇门」或「一块砖」，侧倾之后立刻是「一本书」。
  ⚠️ 丝带**必须从书的下缘伸出来**，且不许伸得太长 ——
     露得太多时侧影重心下移，§5.3 会跟着偏。
     这里露出 35px（书高 290px 的 12%），偏移仍在 ±30.7px 内。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="书">

  <!--
    ⚠️ 整组侧倾 12°，绕书自身的中心 (266,260)。
    为什么必须 tilt：完全竖直的长方形在 48px 上是「一扇门」。
    为什么 tilt 不影响 §5.3：守卫会跟着 transform 一起算外接盒
    （这一点由变异 M33 验过：把词图整体 translate 之后 G13 照样能红）。
  -->
  <g transform="rotate(12 266 260)" stroke="#2a2a4a" stroke-width="12"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- 书签丝带：从下缘伸出来，两端带燕尾口。 -->
    <path d="M 296 400 L 296 440 L 312 430 L 328 440 L 328 400 Z" fill="#d9534f" />

    <!-- 书页：右侧一条浅色的厚度。 -->
    <rect x="322" y="121" width="19" height="278" fill="#fdf6e6" stroke="none" />
    <path d="M 331 150 L 331 370" fill="none" stroke="#e6dcc4" stroke-width="8" />

    <!-- 封面：合上竖立的长方形。 -->
    <rect x="191" y="115" width="150" height="290" rx="6" fill="#4b4b9e" />

    <!-- 书脊：左边一条更深的色带，「这是一本书」而不是「一块板」的第一交代。 -->
    <rect x="191" y="115" width="38" height="290" fill="#33336e" stroke="none" />
    <!-- 书脊上的两道横线（装订线）。 -->
    <path d="M 195 175 L 225 175 M 195 345 L 225 345" fill="none" stroke="#22224f"
          stroke-width="8" />

    <!--
      封面上的标签框：**空心的浅色矩形**。
      ⚠️ 这里绝不许写字（G10：答案不许以任何形式印在图上），
         所以它是一个纯装饰的框，靠「书封面通常有个框」这个约定把书读出来。
    -->
    <rect x="252" y="160" width="52" height="200" rx="8" fill="none" stroke="#fdf6e6"
          stroke-width="10" />
  </g>
</svg>
