<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：friend（朋友）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、**两个人并肩且共用一条地平线**、主体占画布约 74%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ 本图的分界点**不是服装也不是发型，而是「有两个头」** ——
     本批其余 6 张人物（含已交付的老师）全是一个头。
     只要两颗头在侧影上分离成两个隆起，「朋友」就成立；
     反过来，48px 灰度下即使两件衣服糊成同一片颜色，两颗头仍然分得开。
     ⇒ 排版上必须让两颗头**错开高度**（高个在左、矮个在右），
     等高的两颗头在 48px 上会并成一个「双峰的帽子」。
  ⚠️ 搭肩的手臂必须**从右边那个人的肩上出发、落在左边那个人的肩上**，
     画成两人之间的一根横杆就读成「两个人抬着一根木头」。
     这里让它**向上拱**（控制点抬高 44px），手臂与地面之间留出空隙。
  ⚠️ 两人的**脚必须落在同一条地平线上**（§5 模板的「落地线」），
     错开的话整张图读成「一个大人牵一个小孩」—— 那是另一个词。
  ⚠️ 两件衣服刻意选成**一冷一暖**（紫 / 橙），因为它们还要扛
     「灰度档下两个人不能糊成一坨」这件事。
  ⚠️ 搭肩的手臂在左侧那颗头**之后**画：它必须压住左孩子的肩、不能压住左孩子的头。
     压到头上就变成「左边的人被勒住」了。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="朋友">

  <g stroke="#33323a" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">

    <!--
      高个（左）：先画，后画的人压在他前面。
      ⚠️ 高矮差只用**头的高度差**表达，躯干宽度保持一致 ——
         宽度差一大就是大人小孩了。
    -->
    <rect x="146" y="366" width="46" height="78" rx="22" fill="#4a4f5e" />
    <rect x="192" y="366" width="46" height="78" rx="22" fill="#414655" />
    <ellipse cx="169" cy="444" rx="36" ry="17" fill="#2b313b" />
    <ellipse cx="215" cy="444" rx="36" ry="17" fill="#2b313b" />

    <path d="M 116 258 Q 116 232 176 232 Q 236 232 236 258 L 226 372 Q 218 388 176 388
             Q 134 388 126 372 Z" fill="#7b6bb5" />

    <rect x="158" y="222" width="38" height="42" rx="14" fill="#e8bd97" />
    <ellipse cx="176" cy="132" rx="60" ry="36" fill="#3b2a1d" />
    <ellipse cx="176" cy="176" rx="49" ry="55" fill="#f0c9a4" />
    <path d="M 128 156 Q 150 130 186 132 Q 220 134 226 160 Q 202 144 176 148 Q 148 150 128 156 Z"
          fill="#3b2a1d" stroke="none" />

    <!-- 高个的外侧手臂：**贴着躯干下垂**（与同批学生的处理一致）。 -->
    <g fill="none" stroke="#7b6bb5" stroke-width="32" stroke-linecap="round">
      <path d="M 126 258 L 128 344" />
    </g>
    <circle cx="128" cy="352" r="20" fill="#f0c9a4" />

    <!-- 矮个（右）：压在高个前面。 -->
    <rect x="300" y="366" width="46" height="78" rx="22" fill="#4a4f5e" />
    <rect x="346" y="366" width="46" height="78" rx="22" fill="#414655" />
    <ellipse cx="323" cy="444" rx="36" ry="17" fill="#2b313b" />
    <ellipse cx="369" cy="444" rx="36" ry="17" fill="#2b313b" />

    <path d="M 276 278 Q 276 252 336 252 Q 396 252 396 278 L 386 384 Q 378 398 336 398
             Q 294 398 286 384 Z" fill="#e8794a" />

    <rect x="318" y="242" width="38" height="40" rx="14" fill="#e8bd97" />
    <ellipse cx="336" cy="174" rx="56" ry="34" fill="#7a4a22" />
    <ellipse cx="336" cy="216" rx="46" ry="52" fill="#f0c9a4" />
    <path d="M 292 196 Q 314 170 348 172 Q 380 174 386 200 Q 362 184 336 188 Q 310 190 292 196 Z"
          fill="#7a4a22" stroke="none" />

    <!-- 矮个的外侧手臂。 -->
    <g fill="none" stroke="#e8794a" stroke-width="32" stroke-linecap="round">
      <path d="M 386 280 L 388 352" />
    </g>
    <circle cx="388" cy="360" r="20" fill="#f0c9a4" />
  </g>

  <!--
    搭肩的手臂：矮个的左臂，向上拱过高个的肩。
    ⚠️ 控制点抬到 y=246（比两端都高 22px 以上）才读成「搭着」；
       拉平就读成一根横杆（见本图头部判据第 2 条）。
  -->
  <path d="M 286 292 Q 226 240 158 262" fill="none" stroke="#33323a" stroke-width="34"
        stroke-linecap="round" />
  <path d="M 286 292 Q 226 240 158 262" fill="none" stroke="#e8794a" stroke-width="22"
        stroke-linecap="round" />
  <!-- 搭在肩上的那只手：明确的一只，压在高个的肩线上。 -->
  <circle cx="150" cy="264" r="19" fill="#f0c9a4" stroke="#33323a" stroke-width="9" />

  <!-- 五官：实心不描边。两个人的眼睛大小一致，靠位置区分左右。 -->
  <circle cx="158" cy="188" r="12" fill="#3b2a1d" />
  <circle cx="194" cy="188" r="12" fill="#3b2a1d" />
  <path d="M 160 214 Q 176 226 192 214" fill="none" stroke="#8a5a3c" stroke-width="9"
        stroke-linecap="round" />

  <circle cx="320" cy="228" r="12" fill="#3b2a1d" />
  <circle cx="354" cy="228" r="12" fill="#3b2a1d" />
  <path d="M 322 254 Q 338 268 354 254" fill="none" stroke="#8a5a3c" stroke-width="9"
        stroke-linecap="round" />
</svg>
