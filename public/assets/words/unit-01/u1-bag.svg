<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：bag（书包）—— Story 1.9 第二批，**几何直线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：geometric  ← 几何直线档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面、背包，主体占画布约 69%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据：
  ⚠️ 与同批第一批 student 的分工：student 身上那一条红色鼓包只是**书包的一条肩带**，
     侧影上是一根细窄的竖条；本图是**整个书包**，侧影上是一块
     「上方圆肩 + 中间鼓出两条肩带 + 下方外扩」的复合形。
     ⇒ 「一根细条」与「一整只包」不会混。
  ⚠️ 肩带必须**在包体之外露出**，而且要**上下两端都露**（上端露在包顶之上，
     下端露在包底之下）。只在中段露一条的话，48px 上就是一个方块，读不出是书包。
     这里肩带画成两枚竖着的圆角条，中心在包体两侧、上下各出头约 40px。
  ⚠️ 顶部的提手是**第二个认证点**：拱形的小把手，与圆肩顶在一起。
     提手 + 肩带 + 前袋 + 翻盖扣，四件套齐了才是「书包」而不是「箱子」。
  ⚠️ ⚠️ 刻意**不画成手提包**：手提包与同批第一批 mother 手上那只撞，
     而 mother 那只已经在侧影上占了一个低位凸起。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="书包">

  <!--
    ⚠️ 整组上移 12px。
    原因：书包是「上圆肩 + 下外扩」的形，重心天然偏下 ——
    第一版实算 §5.3 偏移 37.5px，超出 ±30.7px。
    包一层 `<g transform="translate(...)">` 只动一处，比把八条路径的 y 逐个改小不易复查；
    而 §5.3 的守卫会跟着 transform 一起走（这一点由变异 M33 验过）。
  -->
  <g transform="translate(0,-12)">
  <g stroke="#1f3d5c" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">

    <!-- 提手：拱形的小把手，与包顶圆肩顶在一起。 -->
    <path d="M 218 158 Q 256 108 294 158" fill="none" stroke="#1f3d5c" stroke-width="20" />

    <!--
      两条肩带：竖着的圆角条，**上下都露在包体之外**。
      ⚠️ 只在中段露一条的话，48px 上就是一个方块，读不出是书包（见文件头）。
    -->
    <rect x="100" y="196" width="60" height="268" rx="28" fill="#2f6ba6" />
    <rect x="352" y="196" width="60" height="268" rx="28" fill="#2f6ba6" />

    <!-- 包体：圆肩的长方形。 -->
    <rect x="142" y="150" width="228" height="300" rx="62" fill="#3f7fbf" />

    <!-- 翻盖：从包顶往下盖住上半截。 -->
    <path d="M 142 232 Q 142 150 204 150 L 308 150 Q 370 150 370 232 L 370 268
             Q 256 302 142 268 Z" fill="#2f6ba6" />
    <!-- 翻盖扣：一枚黄铜色的方扣。 -->
    <rect x="238" y="266" width="36" height="34" rx="6" fill="#e8b53a" />
    <rect x="248" y="300" width="16" height="30" rx="6" fill="#e8b53a" />

    <!-- 前袋：一只方袋，让包面不是一整块蓝。 -->
    <rect x="184" y="330" width="144" height="92" rx="26" fill="#4a8fd0" />
    <path d="M 184 356 L 328 356" fill="none" stroke="#2f6ba6" stroke-width="10" />
  </g>
  </g>
</svg>
