<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：bird（鸟）—— Story 1.9 第一批，**有机曲线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：3/4 侧朝右、栖在小枝上、主体占画布约 76%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（§5 模板：剪影判据的重灾区）：
  ⚠️ 鸟与鱼的分界全在**两处尖**：① 喙（一个明确向右的三角）② 尾羽（三根分开的尖）。
     把喙画圆就成鱼头；把尾羽画成一整片扇形就成鱼尾。
     ⇒ 这里喙是**硬三角**、尾羽是**三根分开的尖角**，两者都在剪影轮廓上。
  ⚠️ 喙画长了会读成「一只戴尖帽子的人」；画短了会并进头里读成一颗圆球。
     ⇒ 喙从头的最右缘伸出约 1/4 个头宽，且**上缘与头顶齐平**（不是从嘴中央戳出）。
  ⚠️ 尾羽向上翘会读成「一只张着翅膀的东西」。这里尾羽**水平向左后方展开**，
     与背线成一条连续的下斜线。
  ⚠️ 腿在 48px 上必然消失（两像素宽），所以**不让腿承担任何辨识任务** ——
     辨识全部交给喙与尾羽，腿只用来交代「站着」。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="鸟">

  <!--
    尾羽：三根分开的尖角，向左后方水平展开。
    ⚠️ 画成一整片扇形就与同批的鱼尾重合了 —— 剪影分工就断在这里。
  -->
  <g stroke="#1f4f6b" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 176 268 L 62 196 L 92 276 Z" fill="#2f7fa8" />
    <path d="M 172 280 L 56 280 L 100 312 Z" fill="#26688c" />
    <path d="M 178 292 L 74 356 L 122 282 Z" fill="#3a92ba" />
  </g>

  <!--
    身体：略呈水滴形（左厚右尖），背线与尾羽连成一条下斜线。
  -->
  <ellipse cx="252" cy="268" rx="112" ry="92" fill="#3a92ba"
           stroke="#1f4f6b" stroke-width="14" />

  <!--
    翅膀：一片叶子形的浅色，压在身体左半。
    ⚠️ 不压的话身体是一整块同色，灰度档下看不出是鸟还是一条鱼。
  -->
  <path d="M 300 226 Q 196 232 178 288 Q 214 340 296 316 Q 268 274 300 226 Z"
        fill="#8fc4dc" stroke="#1f4f6b" stroke-width="12" />

  <!--
    头：比身体小一号的圆，与身体之间**不画分界线**（同色 + 描边自然融合），
    避免 48px 上出现一道把头和身体切开的横线。
  -->
  <circle cx="344" cy="182" r="64" fill="#3a92ba" stroke="#1f4f6b" stroke-width="14" />

  <!--
    喙：硬三角，从头的最右缘伸出约 1/4 个头宽，上缘与头顶大致齐平。
    ⚠️ 从嘴中央戳出 / 画成圆锥 —— 两种都会让它读成鱼头。
  -->
  <path d="M 402 156 L 458 176 L 402 200 Z" fill="#f0a63c" stroke="#1f4f6b" stroke-width="12"
        stroke-linejoin="round" />

  <!-- 腿：只交代「站着」，不承担辨识。 -->
  <g fill="none" stroke="#c47a2a" stroke-width="12" stroke-linecap="round">
    <path d="M 244 352 L 244 402" />
    <path d="M 288 352 L 288 402" />
  </g>
  <!-- 小枝：给腿一个落点，也是剪影底部那条横线。 -->
  <rect x="150" y="400" width="230" height="26" rx="13" fill="#8a6236"
        stroke="#5d4120" stroke-width="12" />

  <!-- 五官：实心不描边。 -->
  <circle cx="362" cy="170" r="14" fill="#22303a" />
  <circle cx="367" cy="165" r="5" fill="#ffffff" />
</svg>
