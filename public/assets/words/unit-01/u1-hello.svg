<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：hello（你好）—— Story 1.9 第二批，**手势档**（figure）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure  ← 人物/手势档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 77%、重心居中、手掌正面、五指张开

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么只画一只手，不画人。**
     单元 1 已经有 8 个人物（teacher / student / father / mother / brother /
     sister / friend），本批的人形剪影**两两可分已经是刚踩过 4 版返工的活**。
     再加一个「挥手的人」，那 9 张人形要两两可分就是 36 对比较，且挥手的手臂
     在 48px 上极易读成「一个人侧身」——
     AC-11 点名的风险就是这个。⇒ **只画手 + 一截袖口，没有头、没有躯干。**
     袖口的作用是给「手臂的来处」一个交代，不是为了让手连着一个人。

  ⚠️ **与 u1-goodbye 的分界只有两条（剪影层面，不是颜色层面）。**
     ① **hello 的上缘是锯齿状的** —— 五指分开，指与指之间有四道缺口；
        goodbye 的上缘是一整条平滑弧。48px 上这道锯齿是本批唯一还看得见的差别，
        颜色（两只手肤色相同）不参与区分。
     ② **挥手弧线的位置相反** —— hello 的弧在手的**两侧**（左右挥），
        goodbye 的弧在手的**上方**（向下挥走）。
  ⚠️ 两只手刻意用**同一套肤色与同一套描边色**：
     如果给 goodbye 换个颜色，四选一里会出现「红手 / 蓝手」，
     孩子在 hello 与 goodbye 之间会先比颜色。**分界必须落在剪影上。**

  ⚠️ **掌心没有画任何掌纹。**
     按 §5.5b「48px 可读性地板」：48px 下掌纹每个只有 1–2px，
     属于「不承担识别功能的噪声图层」，一律不画。
     这条判据正是本 story 由 u1-dog 远侧耳朵的复核定出来的（art-direction.md §5.5b）。

  ⚠️ **描边只写在每个图元自身上，不写在 <g> 上。**
     实算脚本 `word-image-metrics.ts` 的半宽口径是「元素自己带 stroke/stroke-width
     才计入」（§5「已知偏差」，与 [CR] 黄金值对齐的那套口径）。
     写到 <g> 上会让实算值偏小 ⇒ 本图逐个图元带描边，判据与墨迹一致。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="你好">

  <!--
    ⚠️ 外层这一个 translate 不是偷懒，是实算调出来的：
       第一版重心落在 (245, 290) —— 偏下 34px，超出 G13 的 ±30.7px。
       根因是手 + 袖口整体偏重、而挥手弧线在中段，两头轻中间重。
       整体平移 (11, -34) 后重心落在 (256, 256)，§5.2 留白 29.5px → 63.5px。
  -->
  <g transform="translate(11 -34)">

  <!--
    挥手弧线：左右各两道，画在手的**后面**。
    ⚠️ 画在前面会被手的描边切断，48px 下读成四段断掉的短线。
    ⚠️ 刻意用中性石板色而不是暖色：暖色会与 yellow / beautiful 的花瓣撞上。
  -->
  <g fill="none" stroke="#6f7a8c" stroke-width="14" stroke-linecap="round">
    <path d="M 92 208 Q 62 256 92 304" />
    <path d="M 74 196 Q 40 256 74 316" />
    <path d="M 420 208 Q 450 256 420 304" />
    <path d="M 438 196 Q 472 256 438 316" />
  </g>

  <g transform="rotate(-8 256 256)">

    <!-- 袖口：一截深蓝袖管，给「手臂的来处」一个交代。 -->
    <rect x="180" y="392" width="152" height="76" rx="18" fill="#2b3a55"
          stroke="#1b2230" stroke-width="12" stroke-linejoin="round" />

    <!-- 手掌：略扁的椭圆，上宽下窄。 -->
    <ellipse cx="256" cy="330" rx="124" ry="104" fill="#e8b98a"
             stroke="#1b2230" stroke-width="12" />

    <!--
      四根手指：胶囊形（rx = 半宽），各自绕**指根**旋转。
      ⚠️ 旋转中心必须落在 y=330（掌心顶缘），
         画成绕自身中心转就变成手指在掌心里打转，48px 上读成「乱糟糟一堆」。
      ⚠️ 五指刻意不等长：中指最长、食指次之、无名指与小指依次收短，
         拇指最短且最斜。四根手指全等长会读成「一把梳子」。
    -->
    <rect x="166" y="140" width="42" height="190" rx="21" fill="#f0c69b"
          stroke="#1b2230" stroke-width="12" transform="rotate(-16 187 330)" />
    <rect x="214" y="100" width="42" height="230" rx="21" fill="#f5d0a8"
          stroke="#1b2230" stroke-width="12" transform="rotate(-5 235 330)" />
    <rect x="262" y="110" width="42" height="220" rx="21" fill="#f5d0a8"
          stroke="#1b2230" stroke-width="12" transform="rotate(6 283 330)" />
    <rect x="310" y="150" width="42" height="180" rx="21" fill="#efc299"
          stroke="#1b2230" stroke-width="12" transform="rotate(18 331 330)" />

    <!--
      拇指：从掌心左下方斜伸出去，角度比手指大得多（-40°）。
      ⚠️ 拇指是「这是一只手」与「这是一只脚 / 一块石头」的分界，
         48px 下没有拇指的手掌会读成别的东西。
      ⚠️ 拇指根要压在手掌**下面**（后画则被掌的描边切出一道横线，
         48px 上像手掌上有一道刀痕）。
    -->
    <rect x="88" y="222" width="46" height="118" rx="23" fill="#efc299"
          stroke="#1b2230" stroke-width="12" stroke-linejoin="round"
          transform="rotate(-40 134 320)" />

  </g>
  </g>
</svg>
