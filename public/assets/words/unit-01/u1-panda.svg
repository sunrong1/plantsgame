<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：panda（熊猫）—— Story 1.9 第一批，**有机曲线档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：organic    ← 有机曲线档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：**正面坐姿**、主体占画布约 76%、重心居中略偏下

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据：
  ⚠️ 与同批 cat / rabbit 的分工靠**两件事**：① 视角是**正面**，那两张是 3/4 侧 ——
     §5.4 说同一批视角要一致，本图是本批唯一正面图，是因为正面读法最不会认错；
     ② 剪影上**黑白块的位置**必须是「黑耳朵 + 黑眼圈 + 黑四肢」，
     这是灰度档下唯一还认得出的信息（见下面 180px 灰度的自检要求）。
  ⚠️ 耳朵画成圆的会与头连成一个球（第一版的失败）。必须是**两个分开的黑圆**，
     且**画在头之前**、头再盖上去 —— 露出来的是「头顶两侧的两坨」，不是一个连续圆。
  ⚠️ 黑色区块一律**不描边**：48px 下一个带描边的黑块会被描边吃掉一圈，
     读成灰边黑心，灰度档下整个图案塌掉。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="熊猫">

  <!--
    耳朵：两个黑圆。⚠️ 画在头之前、头再盖上来 —— 露出来的是「头顶两侧的两坨」，
    连成一个球就成了一个光头（第一版的失败）。
  -->
  <circle cx="190" cy="132" r="46" fill="#2f2f2f" />
  <circle cx="322" cy="132" r="46" fill="#2f2f2f" />

  <!-- 躯干：白色，梨形。描边是本图唯一的轮廓线。 -->
  <ellipse cx="256" cy="368" rx="116" ry="100" fill="#f7f5f0"
           stroke="#2f2f2f" stroke-width="14" />

  <!--
    四肢：黑色、实心、无描边。
    ⚠️ 四肢必须**在躯干轮廓之外露出** —— 全塞在躯干里的话，
    灰度档下整只熊猫就是「一个白球顶两个黑球」，读不出是坐着的熊猫。
  -->
  <ellipse cx="128" cy="332" rx="38" ry="66" fill="#2f2f2f" transform="rotate(-8 128 332)" />
  <ellipse cx="384" cy="332" rx="38" ry="66" fill="#2f2f2f" transform="rotate(8 384 332)" />
  <ellipse cx="204" cy="440" rx="50" ry="30" fill="#2f2f2f" />
  <ellipse cx="310" cy="440" rx="50" ry="30" fill="#2f2f2f" />

  <!-- 头：白色大圆，盖住两个黑耳的下半。 -->
  <circle cx="256" cy="200" r="100" fill="#f7f5f0" stroke="#2f2f2f" stroke-width="14" />

  <!--
    黑眼圈：熊猫的辨识签名。
    ⚠️ 位置**必须在眼睛高度、且斜着往外下**，正圆会读成「戴着墨镜的人」
    （1.8 的老师踩过同源问题：两侧灰块正好在眼睛高度 → 读成戴耳机的人）。
    斜置的椭圆 + 眼白露在上缘，是「熊猫」而不是「墨镜」。
  -->
  <ellipse cx="216" cy="212" rx="34" ry="42" fill="#2f2f2f" transform="rotate(-18 216 212)" />
  <ellipse cx="296" cy="212" rx="34" ry="42" fill="#2f2f2f" transform="rotate(18 296 212)" />

  <!-- 鼻子：一颗倒三角，压在两个眼圈之间偏下。 -->
  <path d="M 240 258 L 272 258 L 256 282 Z" fill="#2f2f2f" />

  <!--
    嘴：熊猫的嘴是「ω」形（两个下弧并排），不是一条线。
    ⚠️ 填实的短弧，48px 下纯描边只剩 1px。
  -->
  <path d="M 218 292 Q 234 312 250 292 Q 262 282 256 292 M 262 292 Q 278 312 294 292"
        fill="none" stroke="#2f2f2f" stroke-width="10" stroke-linecap="round" />

  <!-- 眼睛：黑眼圈里的白点 + 一点高光。 -->
  <circle cx="214" cy="204" r="13" fill="#ffffff" />
  <circle cx="298" cy="204" r="13" fill="#ffffff" />
  <circle cx="218" cy="200" r="6" fill="#2f2f2f" />
  <circle cx="302" cy="200" r="6" fill="#2f2f2f" />
</svg>
