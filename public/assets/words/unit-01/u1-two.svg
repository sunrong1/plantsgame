<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：two（二）—— Story 1.9 第二批，**数词档**（抽象·字形）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 68%、重心居中、正面

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么本图用「描边路径」而 u1-one 用「填充多边形」。**
     数字 2 的本体就是一根连续的笔画（起笔在左上、绕顶、斜下、收笔在右下），
     用填充多边形去描它的轮廓要手工算十几个顶点，算出来的字形反而不像 2。
     ⇒ **2 用一条 fill="none" 的粗描边路径**，笔画本身就是形状。
     这也顺带让「描边半宽必须计入」这条实算口径在本图上真的被考到
     —— 若脚本漏了半宽，本图的占比会明显偏小。

  ⚠️ **与 u1-one 的分工（48px 上还看得见的部分）**：
     1 的外轮廓是**直角多边形**（顶、底、竖干都是直边）；
     2 的外轮廓是**上圆下直**（顶是一段圆弧，底是一条横）。
     ⚠️ 2 顶部的圆弧半径刻意给大（从 (150,190) 绕到 (368,178)），
        收得太紧会读成「一个问号」或「一个 7」。
     ⚠️ 斜下笔与底横的夹角约 50°：更平读成「一」，更陡读成「一个 7 的下半截」。

  ⚠️ **为什么不用 <text> 写「2」**：同 u1-one，
     G10 禁止把答案以任何形式印在图上（照抄 <text> 就等于零教学价值）。

  ⚠️ **描边逐图元写在自身上** —— 实算脚本的半宽口径只认元素自己声明的 stroke，
     而本图的 stroke-width=44 恰好是全部 30 张里最粗的一根，
     「半宽不计入就会算错」这件事在它身上最明显。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="二">

  <!--
    数字 2 的单笔路径：
    起笔左上 (150,190) → 两段三次曲线绕出顶部的大圆弧 → 到 (288,296)
    → 斜下笔到 (200,388) → 底横右行到 (380,388)。
    ⚠️ linecap="round"：2 的起笔与收笔都是圆的，写成 butt 会读成「一根被切断的管子」。
    ⚠️ 斜下笔与底横的转折处是**同一个点** (200,388) 上的一次锐转，
       round 的 linejoin 让它不出现缺口；48px 下那个转角正是 2 与 7 的分界。
  -->
  <path d="M 150 190
           C 150 122 200 86 258 86
           C 320 86 368 124 368 178
           C 368 226 330 258 288 296
           L 200 388 L 380 388"
        fill="none" stroke="#2f3b4c" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
