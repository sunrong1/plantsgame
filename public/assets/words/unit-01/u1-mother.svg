<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：mother（妈妈）—— Story 1.9 第一批，**人物档**。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure     ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：正面站姿、双手下垂、**及踝长裙**、主体占画布约 75%、重心居中略偏下

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  剪影判据（本批 7 个人物两两可分，这是本图拿到的那一份）：
  ⚠️ 本图的分界点有**两个，都落在侧影的下半段**，与本批其余六张全都不同：
     ① **及踝长裙把两条腿整段盖住**。本批其余人物的下半段都是
        「两条分离的柱子 + 一条从上到下的竖缝」；
        本图的下半段是一块**实心的、下缘外张的梯形**，
        竖缝只剩鞋尖处一个**不到 30px 高的缺口**（实测约 19px）。
        ⚠️ 第一版写的是「下半段没有缝」—— 也不准确，鞋尖那里是有缺口的。
          准确的说法是「缝的长度差一个量级」，别把它简化成「没有缝」。
        ⇒ 这是 48px 灰度下最可靠的一处分界，比任何颜色都硬。
     ② **长发从头顶一直垂到腰**，在躯干两侧各留下一条**竖直的深色带**，
        头发与肩同宽或更宽。
        ⇒ 侧影上「头两侧各挂着一条直到腰的东西」= 妈妈。
        ⚠️ 反过来也成立：这条判据要求头发**必须宽过肩**。
           头发画成贴着脸颊的窄条就并进头了，48px 上整个头读成一颗光球。
     ③ **手提袋挂在左手、垂到大腿高度**，在侧影左下角制造一块
        **低位横向凸起**。本批没有任何别的人物在腰以下有侧向凸出物。

     ⚠️ **与同批 sister 的分工（两张都有裙子，必须额外交代）**：
        妈妈是**长裙 + 长发**，姐姐是**短裙 + 双马尾**。
        长发从头顶**连着垂到腰**（头两侧是两条竖条，中途不分叉）；
        马尾在**耳侧就结束**（头上是两坨分离的圆团，下面是脖子）。
        ⇒ 「头两侧是连着的长条」与「头上有两坨圆的」在 48px 上是两种形状，
          这是妈妈与姐姐唯一的分界，必须两条同时成立。
  ⚠️ 两条长发必须在**脸之前**画、脸再盖上来；判据仍沿用 1.8 老师那条：
     **头发的下缘必须在眼睛之上**。这里刘海下缘 138 / 眼睛 172。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="妈妈">

  <g stroke="#5d3a1e" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">

    <!--
      长发：一整块画在**脸与躯干之前**的底色。
      ⚠️ 宽过肩（180–332 对肩 188–324）—— 窄了就会并进头与肩，
         侧影上读不出「有头发」这件事。
    -->
    <path d="M 194 152 Q 182 92 256 92 Q 330 92 318 152 L 332 306 Q 332 330 306 330
             L 206 330 Q 180 330 180 306 Z" fill="#6b3a17" />

    <!-- 裙：及踝，**下缘外张**。这是本图最硬的一处分界（见文件头 ①）。 -->
    <path d="M 196 330 Q 256 342 316 330 L 352 446 Q 256 462 160 446 Z" fill="#a83a5c" />

    <!-- 裙上一道浅色的横褶：交代它是布，不是硬壳。 -->
    <path d="M 176 424 Q 256 442 336 424" fill="none" stroke="#c2456b" stroke-width="11" />

    <!-- 上身（连衣裙的上半段）：肩宽腰窄。 -->
    <path d="M 188 246 Q 188 220 256 220 Q 324 220 324 246 L 316 332 Q 310 348 256 348
             Q 202 348 196 332 Z" fill="#c2456b" />

    <!-- 领口：一道浅色的 V。 -->
    <path d="M 226 224 L 256 248 L 286 224" fill="none" stroke="#f0d6de" stroke-width="11" />

    <!-- 鞋：只露两个鞋尖，交代「下面是脚」。 -->
    <ellipse cx="222" cy="452" rx="32" ry="13" fill="#7a3f52" />
    <ellipse cx="290" cy="452" rx="32" ry="13" fill="#7a3f52" />

    <!-- 脖子 -->
    <rect x="238" y="206" width="36" height="38" rx="14" fill="#e8bd97" />

    <!-- 脸：比头发窄、后画，盖住发际线。 -->
    <circle cx="256" cy="160" r="56" fill="#f0c9a4" />

    <!-- 刘海：压到眉上，不许压到眼睛。 -->
    <path d="M 202 138 Q 226 110 258 112 Q 292 114 312 142 Q 288 126 258 130
             Q 226 132 202 138 Z" fill="#6b3a17" stroke="none" />

    <!--
      手臂：**贴着躯干下垂**，与学生同一处理。
      ⚠️ 肘不许外八 —— 那是老师和爸爸的签名。
    -->
    <g fill="none" stroke="#c2456b" stroke-width="34" stroke-linecap="round">
      <path d="M 186 252 L 178 334" />
      <path d="M 326 252 L 334 334" />
    </g>
    <circle cx="178" cy="348" r="20" fill="#f0c9a4" />
    <circle cx="334" cy="348" r="20" fill="#f0c9a4" />
  </g>

  <!--
    手提袋：挂在左手，垂到大腿高度。
    ⚠️ 袋子的上缘必须**低于手**、靠一根提梁连着 ——
       直接把袋子贴在手下面会读成「手是个包」。
    ⚠️ 这是侧影左下角唯一的横向凸起，见文件头 ③。
  -->
  <path d="M 178 356 Q 172 336 156 348" fill="none" stroke="#5d3a1e" stroke-width="11"
        stroke-linecap="round" />
  <rect x="132" y="358" width="80" height="72" rx="18" fill="#8a5a3c" stroke="#5d3a1e"
        stroke-width="13" />
  <rect x="152" y="372" width="40" height="20" rx="8" fill="#a8734f" stroke="none" />

  <!-- 五官：实心不描边。 -->
  <ellipse cx="234" cy="172" rx="12" ry="14" fill="#3b2a1d" />
  <ellipse cx="278" cy="172" rx="12" ry="14" fill="#3b2a1d" />
  <circle cx="238" cy="167" r="4.5" fill="#ffffff" />
  <circle cx="282" cy="167" r="4.5" fill="#ffffff" />

  <!-- 微笑：一条短上弯线。 -->
  <path d="M 240 200 Q 256 212 272 200" fill="none" stroke="#8a5a3c" stroke-width="10"
        stroke-linecap="round" />
</svg>
