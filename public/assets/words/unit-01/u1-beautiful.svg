<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：beautiful（美丽的）—— Story 1.9 第二批，**形容词档**（抽象·通用符号）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract  ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 70%、重心居中、正面、六重对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **为什么是花。**
     AC-11 的口径：抽象词画**有公认的通用符号**的那些。
     「美丽」的公认符号有三种：花、蝴蝶、闪光的星星。
     ⇒ **星被 u1-yellow 占了，蝴蝶的剪影在 48px 下与 u1-bird 撞**，
        只剩花这一条路。这不是巧合，是 1.8 立下的「同批剪影分工」纪律在起作用。

  ⚠️ **花心刻意用青绿而不是黄。**
     真实的花心多是黄的，但本单元里 **yellow 已经是那颗五角星**，
     花心再用黄就成了「两张图抢同一个答案」。
     ⇒ 花心取深青绿 #2f7d63：既是常见的花心色相（绿萼那一档），
       又与 yellow 的暖黄、red 的正红、blue 的蓝在色相环上拉得最开。

  ⚠️ **六瓣而不是五瓣**：
     五瓣 + 圆形花心在 48px 下会读成 u1-yellow 的星（五个尖角 + 中心）。
     六瓣的上缘没有尖角，**整张剪影是圆的带起伏**，
     与五角星的「尖」在剪影层面就分开了 —— 这是 1.8 的剪影判据，不是审美偏好。

  ⚠️ **不画茎与叶**：
     茎与叶会把外接框往下拉长，主体占比与重心都要重调，
     而 48px 下茎只是一根细线（见 §5.5b「48px 可读性地板」——
     不承担识别功能的细线不该画）。没有茎的花头依然是花。

  ⚠️ **描边逐图元写在自身上** —— 实算脚本的半宽口径只认元素自己声明的 stroke。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="花">

  <!--
    六枚花瓣：每枚是一个 54×80 的竖椭圆，绕花心呈 60° 均布。
    ⚠️ 每枚都要**绕自己的中心**旋转，不是绕花心 ——
       绕花心转会连位置一起转，六瓣会叠成一瓣。
    ⚠️ 花瓣**先画、花心后画**：花瓣的描边会被花心压住，
       若反过来，六枚花瓣的根部会在花心上留下一圈放射状的黑色短刺。
  -->
  <g fill="#e0609c" stroke="#a83268" stroke-width="14" stroke-linejoin="round">
    <ellipse cx="256" cy="156" rx="54" ry="80" />
    <ellipse cx="342.6" cy="206" rx="54" ry="80" transform="rotate(60 342.6 206)" />
    <ellipse cx="342.6" cy="306" rx="54" ry="80" transform="rotate(120 342.6 306)" />
    <ellipse cx="256" cy="356" rx="54" ry="80" transform="rotate(180 256 356)" />
    <ellipse cx="169.4" cy="306" rx="54" ry="80" transform="rotate(240 169.4 306)" />
    <ellipse cx="169.4" cy="206" rx="54" ry="80" transform="rotate(300 169.4 206)" />
  </g>

  <!--
    花心：一枚实心圆 + 一圈更深的芯。
    ⚠️ 芯不要画成「笑脸」或「小圆」之外的任何东西 ——
       u1-happy 已经是本单元唯一一张脸，这里再放五官就是两张脸打架。
    ⚠️ 深芯的作用是让花心在 48px 下不是一坨糊：浅芯只有 20px，
       48px 下不到 2px，画了等于没画；深芯直径 88 折算约 8px，读得出来。
  -->
  <circle cx="256" cy="256" r="72" fill="#2f7d63" stroke="#1c5346" stroke-width="14" />
  <circle cx="256" cy="256" r="30" fill="#1c5346" stroke="none" />
</svg>
