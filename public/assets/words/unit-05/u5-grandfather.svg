<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：grandfather（爷爷 / 外公）—— 单元 5 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 78%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **单元 5 的五张必须两两可分**（单词卡只并排放其中两张）⇒
     本图与另外四张的分工是「**白胡子**」：
       grandfather ＝ 白发 + **白胡子**
       grandmother ＝ 白发 + 发髻 + 圆眼镜
       father      ＝ 黑发 + 小胡子
       mother      ＝ 长发 + 粉裙
       me          ＝ 小孩 + 红上衣
     胡子是这张图的**唯一**识别来源 ⇒ 它必须是**实心块**而不是一根细描边
     （48px 上 26px 的描边只剩 2.5px，而「下巴上一块白」读作胡子）。

  ⚠️ **为什么不给爷爷画眼镜**：眼镜已经给了奶奶（发髻 + 眼镜），
     两个人同时戴眼镜在 48px 上会读成同一个人 ⇒ 爷爷靠胡子、奶奶靠眼镜+发髻。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="爷爷">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!-- 头。 -->
    <circle cx="256" cy="118" r="58" fill="#f6d7b0" stroke-width="12" />

    <!-- 白发：盖住头的上半。 -->
    <path d="M 198 118 A 58 58 0 0 1 314 118 Z" fill="#dcdce0" stroke="none" />

    <!-- 白胡子：下巴上一块实心（**本图的识别来源**）。 -->
    <path d="M 226 142 L 286 142 L 286 160 Q 256 198 226 160 Z"
          fill="#dcdce0" stroke-width="10" />

    <!-- 身体：深蓝上衣。 -->
    <rect x="198" y="176" width="116" height="156" rx="44" fill="#3f51b5" stroke-width="12" />

    <!-- 两条手臂垂在身侧。 -->
    <path d="M 206 210 L 178 302" fill="none" stroke-width="22" />
    <path d="M 306 210 L 334 302" fill="none" stroke-width="22" />

    <!-- 两条腿站直。 -->
    <path d="M 226 322 L 214 446" fill="none" stroke-width="22" />
    <path d="M 288 322 L 300 446" fill="none" stroke-width="22" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-05` 实测）：
      主体占比 **78.7%**，最小留白 **54.0px**，重心偏移 **0.5px**，重心 (256, 256)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 54.0px ≥30.72px；§5.3 的 0.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      白胡子 ✓（**主识别来源**：下巴上一块白）
      白发 ✓（**第二识别来源**：与 `father` 的黑发分开）
      手臂 / 腿 ✗ —— 通用人形，不承担识别 ⇒ 只加不减
  -->
</svg>
