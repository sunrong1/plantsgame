<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：me（我）—— 单元 5 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：figure    ← 人物档（§5.1：70%–85%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 76%、重心居中

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **「我」怎么画**：单元 5 里另外四张都是成人 ⇒ 本图必须一眼看出是**小孩**。
     小孩的识别不是「个子矮」（画布一样高，矮＝图变小，反而更看不清），
     而是**头身比**：小孩的头很大、身体很短。
     ⇒ 头 r=62 / 身高约 390 ⇒ 头占身高近 1/3（成人的头身比是 1/7 左右）。

  ⚠️ **为什么举手**：举起的手臂在**轮廓**上与另外四张（双臂垂在身侧）分开，
     而轮廓差别在 48px 上比「头身比」更可靠。

  ⚠️ **为什么本图不画成「小一号的成人」**：那需要把整个人缩小，
     而缩小 = 主体占比掉到 70% 以下（§5.1 判红）⇒ 必须靠比例而不是靠缩放。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="小孩（我）">
  <g stroke="#2a2a4a" stroke-linecap="round" stroke-linejoin="round">

    <!-- 头：大头（小孩的头身比）。 -->
    <circle cx="256" cy="128" r="62" fill="#f6d7b0" stroke-width="12" />

    <!-- 头发：盖住头的上半。 -->
    <path d="M 194 128 A 62 62 0 0 1 318 128 Z" fill="#3a2a22" stroke="none" />

    <!-- 身体：红色短袖（小身子）。 -->
    <rect x="212" y="190" width="88" height="118" rx="34" fill="#ef5350" stroke-width="12" />

    <!-- 一只手垂下、一只手举起（**轮廓上的区分点**）。 -->
    <path d="M 216 214 L 170 296" fill="none" stroke-width="22" />
    <path d="M 296 214 L 340 140" fill="none" stroke-width="22" />

    <!-- 两条短腿。 -->
    <path d="M 230 298 L 218 438" fill="none" stroke-width="22" />
    <path d="M 284 298 L 296 438" fill="none" stroke-width="22" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-05` 实测）：
      主体占比 **76.0%**，最小留白 **60.0px**，重心偏移 **1.5px**，重心 (255, 255)
    ⇒ §5.1 落在 figure 的 70%–85% 内；§5.2 的 60.0px ≥30.72px；§5.3 的 1.5px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      大头 + 短身 ✓（**主识别来源**：头身比 = 小孩）
      举起的手臂 ✓（**第二识别来源**：轮廓与四个成人分开）
      红上衣 ✗ —— 颜色不承担识别（灰阶下会塌）⇒ 只加不减
  -->
</svg>
