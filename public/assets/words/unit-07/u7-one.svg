<?xml version="1.0" encoding="UTF-8"?>
<!--
  词图：one（一）—— 单元 7 的内容（Story 2.6）。

  规格（docs/art-direction.md §1）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图档位：abstract    ← 抽象档（§5.1：60%–75%）；G11 按这一行取区间读，不写死
  构图（§5 词图模板）：主体占画布约 67%、重心居中、正面全对称

  G10：不得含 text / image / foreignObject —— 答案不许以任何形式印在图上。
  G8：XML 注释正文里不许出现连续双短横。

  ⚠️ **数字词不写数字，画成「N 个方块」**：数字 1 本身没有专属的具象物件，
     而 `<text>` 在 G10 里是被禁的（答案不许以任何形式印在图上）⇒
     数字词的通用画法是**数块**：一块就是 one，两块就是 two。
     孩子看到一块方块就知道这是「一」—— 这是数数的启蒙画法。

  ⚠️ **单元 7 的六张共用同一套方块（同样的颜色、同样的大小规则）**：
     它们的差别**只在于块数** ⇒ 六张并排时，孩子练的是「数数」，
     而颜色/形状不掺进来。

  ⚠️ **为什么一块要画这么大**：块数越少，单块越要清楚 ⇒
     one 用 330×330 的大方块，而 three / five / six 用 105×105 的小块。
     每张图的外接框都落在 66%–70%，都在 abstract 档的 60%–75% 内。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="一个方块">
  <g stroke="#2a2a4a" stroke-linejoin="round">
    <!-- 一块方块。 -->
    <rect x="91" y="91" width="330" height="330" rx="16" fill="#42a5f5" stroke-width="12" />
  </g>

  <!--
    外沿实算（`npm run word-image-metrics public/assets/words/unit-07` 实测）：
      主体占比 **66.8%**，最小留白 **85.0px**，重心偏移 **0.0px**，重心 (256, 256)
    ⇒ §5.1 落在 abstract 的 60%–75% 内；§5.2 的 85.0px ≥30.72px；§5.3 的 0.0px ≤30.72px。

    §5.5b 逐元素记账（48px 下是否承担识别）：
      单块方块 ✓（**唯一识别来源**：块数 = 一）
  -->
</svg>
