<?xml version="1.0" encoding="UTF-8"?>
<!--
  僵尸 —— Story 1.7 / FR71。全场只有这一种敌人，所以只有这一张图；
  文件名不带「关卡」或「类型」，那是留给将来可能出现第二种僵尸时的
  `zombie-<type>.svg` 形态的（改动必须同步改 validate-content 的守卫）。

  规格（docs/art-direction.md 第 1 节 / 第 3 节）：SVG / viewBox 0 0 512 512 / 512×512 / 透明底
  构图（§3）：3/4 侧、面朝左（僵尸从右向左走）、描边 16px、主体占画布约 66%

  ⚠️ **上面那行规格就写在注释里。** `tests/assets/asset-geometry.test.ts` 的几何守卫
     必须先剥注释再匹配属性，否则每个文件都会因为这一行字而**恒绿**（AC-15）。
     Task 5 的 M8 就是把剥注释那一步删掉再跑一遍，用来证明守卫读的是属性不是注释。

  ⚠️ 色值是 tokens.css 的**字面副本**：SVG 经 `<img src>` 加载是独立文档，
     继承不到 `:root` 的 CSS 变量。一致性由 asset-geometry.test.ts 的 G3/G4 锁住。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="僵尸">
  <!--
    剪影。五个部分带 16px 白色描边 —— 这条高对比边界就是 AC-5 的兜底机制本身：
    描边与主体同色时边界消失，而这里主体是深墨绿、描边近白，在灰度屏上依然分得开。
    ⚠️ **躯干与手臂刻意重叠**：3/4 侧视图里手臂挡住躯干才是对的，
       拆成互不相接的图元会看成一只断手。
  -->
  <g fill="#1b5e20" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <!-- 头（3/4 侧：脸偏向左） -->
    <ellipse cx="230" cy="150" rx="58" ry="62" />
    <!-- 躯干：右肩略高于左肩，是 3/4 透视的体积线索；下摆不齐，破布感 -->
    <polygon points="186,208 288,214 306,338 250,352 178,336" />
    <!-- 前伸的手臂（朝左 —— 它是僵尸「在靠近房子」这件事的视觉说明） -->
    <polygon points="192,238 216,258 154,306 136,282" />
    <!-- 后臂（只露出一截，藏在躯干后面） -->
    <ellipse cx="322" cy="282" rx="32" ry="46" />
    <!-- 前腿：下端外撇成脚，与躯干用一条描边分界（省一条内部白线） -->
    <polygon points="186,340 234,340 240,410 250,424 172,424 180,410" />
    <!-- 后腿 -->
    <polygon points="256,344 302,344 308,410 318,424 244,424 252,410" />
  </g>

  <!--
    细节：**刻意不描边**。缩到 48px 的格子里，多余的白线会把剪影切碎成几块，
    孩子看到的就不是「一只僵尸」而是「几个深绿色的方块」。
    两个眼白偏左，是「面朝左」的第二个线索（第一个是手臂的方向）。
  -->
  <g fill="#ffffff">
    <ellipse cx="202" cy="142" rx="9" ry="11" />
    <ellipse cx="242" cy="144" rx="9" ry="11" />
    <polygon points="184,180 208,168 232,182 256,168 280,182 272,202 192,200" />
  </g>

  <!-- 头顶的乱发：白描边的一撮竖毛。不画这一撮，僵尸在 48px 上会被看成一台机器人。 -->
  <polygon fill="#1b5e20" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"
           points="204,100 218,70 232,94 248,66 258,98" />
</svg>
